const R=(symbol)=>ref('source/remote.c',symbol), V=(symbol)=>ref('source/vtfs.c',symbol), C=(symbol)=>ref('goi/cli.py',symbol), S=(symbol)=>ref('goi/storage.py',symbol), H=(symbol)=>ref('goi/server.py',symbol), P=(symbol)=>ref('goi/publish.py',symbol), G=(symbol)=>ref('goi/github.py',symbol);
const lessons=[
{title:'1. Общая карта процессов',html:`<p><b>VFS</b> — общий слой файловых систем в ядре. Он принимает операции приложений и передаёт их конкретной файловой системе: ext4, tmpfs или нашей VTFS. Приложение использует обычные open/read/write; выбранный путь определяет обработчик.</p><p>Есть два входа в наш сервер: модуль отправляет файловые запросы <code>/api/...</code>, а CLI отправляет управляющие запросы <code>/control</code>. Поэтому команда goi может сначала вызвать ядро для синхронизации, а затем обратиться к сервису напрямую для публикации.</p><div class="table-wrap"><table><tr><th>Элемент</th><th>Где исполняется</th></tr><tr><td>Bash, Vim, cat, goi</td><td>Обычные пользовательские процессы Ubuntu VM.</td></tr><tr><td>VFS и vtfs.ko</td><td>Код ядра. VTFS не отдельный демон и не отдельная VM.</td></tr><tr><td>Фоновое сохранение</td><td>Рабочий поток ядра выполняет функцию модуля из workqueue.</td></tr><tr><td>goi-server</td><td>Отдельный Python-процесс, сейчас в той же VM, потенциально на другой машине.</td></tr><tr><td>SQLite</td><td>Библиотека в процессе сервера и файлы на его диске.</td></tr><tr><td>GitHub и браузер</td><td>Удалённый API и браузер для подтверждения авторизации.</td></tr></table></div><p>Определения VFS и объектов ядра основаны на <a href="https://docs.kernel.org/filesystems/vfs.html">документации Linux VFS</a>; конкретные пути запросов — на нашем коде.</p>`,steps:[['Приложение','cat / Vim / goi → системные вызовы; процесс может ждать ответ.'],['VFS → VTFS','VFS выбирает таблицу операций конкретного inode / открытого файла.'],['VTFS → HTTP','C-клиент передаёт запрос серверу по TCP.'],['Python → SQLite','Сервер обрабатывает запрос и завершает транзакцию.'],['Python → GitHub','По необходимости получает исходные данные или публикует коммит.']],refs:[R('goi_file_ops'),R('goi_dir_inode_ops'),H('Server'),H('handle_request'),C('Client')]},
{title:'2. inode, dentry и открытый файл',html:`<p><b>inode</b> — объект файла или каталога: тип, права, размер, время, операции, связь с кешем содержимого. <b>Имя файла не хранится в inode.</b> В общем случае несколько имён могут ссылаться на один inode — это основа жёстких ссылок; в GOI ссылки не реализованы.</p><p><b>dentry</b> — объект имени в родительском каталоге, связанный с inode. Это не «весь каталог» и не список его содержимого. Каталог имеет собственный inode; у его детей есть свои dentry. Отрицательный dentry обозначает найденное отсутствие имени.</p><p><b>struct file</b> описывает открытие: режим доступа, текущую позицию, ссылку на путь и операции. Два независимых open одного файла обычно создают два struct file с разными позициями. <b>fd</b> — небольшое число, индекс в таблице дескрипторов процесса; это не номер inode.</p><p>В GOI серверный <code>nodes.id</code> передаётся как <code>inode-&gt;i_ino</code>. Строка SQLite — долговечная запись сервиса, а не сама C-структура inode. Наш дополнительный <code>struct goi_inode</code> хранится через <code>i_private</code>: dirty, loaded, номер ветки, число открытий.</p><p>Структуры Linux приходят из заголовков <code>&lt;linux/fs.h&gt;</code> и <code>&lt;linux/dcache.h&gt;</code>. Мы используем их, а не объявляем заново. Встроенный снимок показывает наши структуры и заполнение полей.</p>`,steps:[['Имя: main/README.md','VFS разбирает компоненты пути и получает dentry для README.md.'],['dentry → inode','Имя README.md указывает на объект файла с размером, правами и операциями.'],['inode → i_mapping','Содержимое находится в страницах page cache, не в поле имени.'],['open → struct file → fd','Процесс получает fd, например 3. Чтение по fd использует это открытие.'],['rename меняет имя','Переименование не обязано создавать новый объект файла. Открытый fd не является строкой пути.']],commands:'ls -li README.md\nstat README.md',refs:[R('goi_inode'),R('goi_new_inode'),R('goi_lookup'),R('goi_revalidate'),V('vtfs_new_inode'),ref('goi/schema.sql','nodes')]},
{title:'3. super_block и таблицы операций',html:`<p><b>super_block</b> описывает экземпляр файловой системы. В нашей nodev-ФС отдельное монтирование получает собственное состояние: корень, сервер, список отслеживаемых inode и фоновую задачу. Обычные bind-mount работают иначе — не надо переносить на них это упрощение.</p><p><code>sb-&gt;s_root</code> указывает на корневой dentry, <code>sb-&gt;s_fs_info</code> — на наш <code>goi_super</code>. Тот содержит адрес сервера, токен сервиса, tracked-список, mutex, delayed_work и active_branch.</p><p>Таблицы операций — структуры с указателями на функции. Присваивание <code>.fsync = goi_fsync</code> ничего не сохраняет немедленно: оно сообщает VFS, какую функцию вызвать позднее. Это объясняет и вложенность callbacks при монтировании.</p><ul><li><code>inode_operations</code>: lookup, create, mkdir, unlink, rmdir, rename.</li><li><code>file_operations</code>: open, read_iter, write_iter, fsync, ioctl, iterate_shared.</li><li><code>super_operations</code>: sync_fs, evict_inode, statfs.</li><li><code>dentry_operations</code>: проверка актуальности имени через d_revalidate.</li></ul>`,steps:[['file_system_type','Описывает тип vtfs и callbacks монтирования.'],['super_block','Создаётся экземпляр ФС с корнем и goi_super.'],['inode / dentry','Появляются объекты файлов и имена.'],['Таблицы операций','VFS вызывает функцию, выбранную по типу операции и объекту.']],refs:[V('vtfs_fs_type'),R('goi_super'),R('goi_file_ops'),R('goi_dir_ops'),R('goi_dir_inode_ops'),R('goi_super_ops')]},
{title:'4. Как загружается модуль',html:`<p><code>make</code> собирает <code>vtfs.ko</code>: ELF-объект с машинным кодом, данными и сведениями о модуле. Это не исполняемый Python-сервис.</p><p><code>insmod</code> просит ядро загрузить объект через семейство системных вызовов <code>finit_module/init_module</code>. Ядро проверяет допустимость загрузки, размещает код, разрешает символы и релокации, затем вызывает функцию инициализации. Подробности: <a href="https://man7.org/linux/man-pages/man2/init_module.2.html">init_module(2)</a>.</p><p>У нас <code>module_init(vtfs_init)</code> указывает на функцию, которая вызывает <code>register_filesystem</code>. После этого ядро знает тип vtfs, но каталог ещё не смонтирован. У модуля нет main, бесконечного цикла или собственного пользовательского процесса.</p><p>Код модуля работает с полномочиями ядра: ошибка памяти способна повредить систему. Поэтому разработку ведём в VM. Сборка привязана к заголовкам и интерфейсам работающего ядра.</p>`,steps:[['make W=1','Kbuild компилирует C и связывает единицы трансляции в vtfs.ko.'],['sudo insmod source/vtfs.ko','Пользовательская утилита передаёт модуль ядру.'],['Загрузчик ядра','Проверки, память, символы, релокации и вызов init.'],['vtfs_init → register_filesystem','Регистрация vtfs_fs_type. Код остаётся в ядре после завершения insmod.'],['Ожидание mount','Инициализация модуля закончена; отдельного mount пока нет.']],commands:'cd ~/code/goi\nmake W=1\nsudo insmod source/vtfs.ko\nlsmod | grep vtfs\nsudo dmesg | tail -20',refs:[V('vtfs_fs_type'),V('vtfs_init'),V('vtfs_exit'),ref('Makefile','all'),ref('Makefile','obj-m')]},
{title:'5. Сервер и монтирование',html:`<p>Сначала запускаем сервис. Он открывает SQLite в режиме WAL с <code>synchronous=FULL</code>, переносит прежнюю структуру при необходимости и читает либо создаёт server-token. HTTP обслуживается потоками, доступ к Store сериализован через RLock.</p><p><code>goi mount</code> берёт настройки этого пути из mounts.json или defaults, создаёт точку монтирования и вызывает системную утилиту mount. Ядро создаёт fs_context: это временный контекст параметров будущего mount.</p><p><code>vtfs_init_fs_context</code> только подготавливает config и callbacks. После разбора параметров VFS вызывает <code>get_tree</code>. Он передаёт fill_super в <code>get_tree_nodev</code>, чтобы ядро само управляло созданием super_block и вызвало заполнение в нужный момент. Прямой вызов fill_super из init_fs_context был бы слишком ранним.</p><p>Если указан server, выбирается HTTP-backend. Без него есть отдельный RAM-backend для базовой части лабы; у него нет долговечного fsync. Mount не авторизуется на GitHub и не скачивает репозитории.</p>`,steps:[['goi-server','Открывает БД, server-token и слушает 127.0.0.1:8080.'],['goi mount ~/code/github','Читает настройки; создаёт каталог; запускает mount -t vtfs.'],['vtfs_init_fs_context → parse_param','Выделяет config; читает server, port, token, uid, gid, autosync.'],['vtfs_get_tree → get_tree_nodev','Выбирает RAM или HTTP callback заполнения super_block.'],['vtfs_remote_fill_super → hello','Сервис возвращает корневые метаданные; goi_new_inode и d_make_root создают корень.'],['delayed_work и готовый mount','Фоновая синхронизация запланирована; параметры сохранены CLI.']],commands:'# Терминал 1\ncd ~/code/goi\nexport GOI_GITHUB_CLIENT_ID="CLIENT_ID_ТВОЕГО_OAUTH_APP"\n./bin/goi-server\n\n# Терминал 2, модуль уже загружен\ncd ~/code/goi\nexport PATH="$PWD/bin:$PATH"\nsource "$PWD/shell/goi.sh"\ngoi mount ~/code/github',refs:[H('main'),H('session_token'),S('__init__'),C('main'),V('vtfs_init_fs_context'),V('vtfs_get_tree'),R('vtfs_remote_fill_super')]},
{title:'6. Авторизация и активация',html:`<p>server-token разрешает доступ к нашему HTTP-сервису. GitHub access token разрешает сервису работать с GitHub. Это разные секреты: GitHub-токен остаётся в SQLite сервера, ядру он не передаётся.</p><p>При Device Flow браузер подтверждает вход, а CLI опрашивает сервер. Сервер получает токен от GitHub и сохраняет аккаунт. При первом чтении корня обнаруживаются организации, при чтении владельца — его репозитории.</p><p>Активация получает сведения о репозитории, правах и ветках, записывает SHA исходных коммитов и деревьев. Ветки лежат прямо в каталоге репозитория. Содержимое файлов ещё не скачано. Нет веток — нужен первый коммит на GitHub; создание первого коммита через GOI не реализовано.</p>`,steps:[['goi auth → /control auth_start','Сервис запрашивает device_code, user_code и адрес входа.'],['Браузер → GitHub','Пользователь вводит код и подтверждает доступ.'],['auth_poll → SQLite','Сервис сохраняет access token; CLI получает имя пользователя.'],['ls владельца','Ленивое получение списка репозиториев, без файловых blobs.'],['goi activate → Store.activate','Создание каталогов веток, .info.json и служебных файлов ветки.']],commands:'goi auth ~/code/github --no-browser\nls ~/code/github\ncd ~/code/github/TheGeniusOfEternity/vtfs-test-repo\ngoi activate\nls -a\ncd main',refs:[H('control'),G('device_start'),G('device_poll'),S('add_account'),S('load_directory'),S('activate'),S('make_controls')]},
{title:'7. Путь, ls и ленивое чтение',html:`<p>Чтобы открыть файл, VFS проходит компоненты пути. Имена связаны с dentry, объекты — с inode. При необходимости вызываются lookup и проверки актуальности. В нашей реализации даже кешированный объект может потребовать HTTP-проверки метаданных: «данные в RAM» не означает «вообще никаких запросов».</p><p><code>ls</code> вызывает перечисление каталога через iterate_shared. Сервер возвращает порции списка по 100 элементов. Если каталог ещё не загружен, Store получает его Git tree и сохраняет метаданные в SQLite.</p><p><code>open</code> вызывает goi_open → goi_load. Если файла ещё нет в RAM, он загружается целиком порциями до 32 КиБ. При первом обращении сервер получает blob целиком с GitHub, проверяет SHA и сохраняет его в SQLite. Последующий read берёт байты из page cache. Максимальный файл — 64 МиБ.</p>`,steps:[['cat README.md → open','Разрешить путь и найти inode.'],['goi_open → goi_load','Проверить loaded; загруженный файл не скачивается заново.'],['HTTP read(id, offset, count)','Передача содержимого от сервера порциями.'],['Store.read → GitHub.blob при необходимости','SQLite кеширует содержимое; на GitHub проверяется blob SHA.'],['Page cache → generic_file_read_iter','Заполненные страницы передаются приложению по read.']],commands:'ls\nls src\ncat README.md',refs:[R('goi_lookup'),R('goi_iterate'),R('goi_open'),R('goi_load'),S('load_directory'),S('read'),G('blob')]},
{title:'8. Запись, dirty и page cache',html:`<p><b>Page cache</b> — страницы содержимого файла в памяти ядра, связанные с inode через address_space (i_mapping). Страницы не находятся в пользовательском буфере Vim и не являются строками SQLite.</p><p>После write наш goi_write_iter использует общие функции записи Linux и выставляет <code>goi_inode.dirty=true</code>. Это собственный флаг «байты ещё нужно отправить сервису». Не путай его с внутренним dirty-битом страниц Linux и с <code>nodes.dirty</code> на сервере.</p><p><code>nodes.dirty</code> означает «локальная рабочая версия отличается от опубликованной». Успешный fsync снимает флаг ядра, но сохраняет изменения для будущего goi commit.</p><p>Содержимое передаётся при синхронизации. Создание имени, mkdir, rename и unlink передаются по HTTP непосредственно во время этих операций. Поэтому не все изменения ФС ждут фонового таймера.</p>`,steps:[['Vim / printf → write','Приложение передаёт байты ядру.'],['goi_write_iter','Блокирует inode, при необходимости загружает старые данные.'],['__generic_file_write_iter','Меняет страницы page cache.'],['goi_inode.dirty = true','Сервис ещё может хранить предыдущую версию.'],['write возвращает результат','Обычный успешный write не является подтверждением долговечного сохранения.']],commands:'printf "\\nHello from GOI\\n" >> README.md\nmkdir notes\nprintf "text\\n" > notes/example.txt\nmv notes/example.txt notes/result.txt',refs:[R('goi_write_iter'),R('goi_setattr'),R('goi_create_common'),R('goi_rename'),R('goi_remove'),S('write'),S('rename')]},
{title:'9. Что именно делает fsync',html:`<p><code>fsync(fd)</code> — системный вызов: дождаться сохранения данных файла и необходимых метаданных в долговечном хранилище. Он относится к открытому файлу по fd. Приложение ждёт и получает результат либо ошибку. Для локальных ФС долговечность новой записи каталога может требовать отдельного fsync каталога: <a href="https://man7.org/linux/man-pages/man2/fsync.2.html">fsync(2)</a>.</p><p>В нашем HTTP-backend VFS вызывает <code>goi_fsync</code>, тот — <code>goi_sync_inode</code>. Границы start/end сейчас не используются: отправляется весь файл одним POST. Сервер принимает полное тело, обновляет SQLite, делает commit транзакции и только затем отвечает успехом. WAL + synchronous=FULL задают долговечность SQLite в рамках гарантий ОС и диска сервера.</p><p>Сеть сама по себе не делает данные долговечными: нужен успешный ответ после серверной транзакции. Если ответ потерялся, запись могла сохраниться, но клиент всё равно считает её неподтверждённой и допускает повтор целого файла.</p><p>fsync не означает «GitHub-коммит». В RAM-backend нашей лабы он возвращает EOPNOTSUPP: там нет постоянного хранилища. Каталожный callback HTTP-backend не заменяет полную POSIX-реализацию долговечности каталогов: наши изменения дерева уже подтверждаются серверными операциями.</p>`,steps:[['goi sync README.md','CLI открывает файл и вызывает os.fsync(fd).'],['VFS → goi_fsync → goi_sync_inode','Выполняется в контексте вызывающего потока, уже в режиме ядра.'],['Снимок под inode_lock','Собрать полный файл из страниц в отдельный буфер.'],['POST /api/write → Store.write','Сервер меняет данные внутри транзакции.'],['SQLite commit → ответ','Только подтверждённый успех снимает dirty в ядре.'],['Возврат вызывающему процессу','CLI сообщает успех; при ошибке возвращает ненулевой код.']],commands:'goi sync README.md\necho $?\n\n# То же обращение к fsync без CLI GOI:\npython3 -c \'import os; f = os.open("README.md", os.O_RDONLY); os.fsync(f); os.close(f)\'',refs:[C('sync_file'),R('goi_fsync'),R('goi_sync_inode'),H('handle_request'),S('write'),S('__init__')]},
{title:'10. Autosync и workqueue',html:`<p><b>Workqueue</b> позволяет поставить функцию на выполнение рабочим потоком ядра. В нашем случае это threaded workqueue, в которой обработчик может ожидать сеть. Это не запуск новой пользовательской программы и не прямое исполнение HTTP-операции внутри аппаратного прерывания. См. <a href="https://docs.kernel.org/core-api/workqueue.html">документацию workqueue</a>.</p><p>В каждом goi_super есть delayed_work. При mount он связывается с goi_background_sync и ставится в system_long_wq с задержкой autosync × HZ. После выполнения обработчик ставит следующий запуск. Следовательно, «1 секунда» — задержка до очередного запуска, а не обещание сохранить любой байт за секунду: добавляются время предыдущего прохода, планирование и сеть.</p><p>goi_background_sync вызывает goi_sync_all, который сохраняет грязные файлы через goi_sync_inode. При ошибке пишет предупреждение в журнал ядра и планирует следующий проход. Shell результата этого прохода не ждёт.</p><p>При размонтировании cancel_delayed_work_sync отменяет ожидающую работу и дожидается выполняющейся перед освобождением состояния. Сам рабочий поток общий: отдельного «процесса autosync» для каждой ФС мы не создаём.</p>`,steps:[['Mount: INIT_DELAYED_WORK','Запомнить callback goi_background_sync.'],['queue_delayed_work(system_long_wq, …)','Запланировать выполнение после задержки.'],['Рабочий поток ядра','Когда задача готова, выполняет callback в контексте kworker.'],['goi_sync_all → goi_sync_inode','Те же POST write и подтверждения SQLite.'],['Ошибка → журнал; успех → дальше','Несохранённые данные остаются dirty при ошибке.'],['Планирование следующего прохода','Повторить через autosync × HZ после текущего выполнения.']],commands:'# Отключить при следующем монтировании:\ngoi mount ~/code/github --autosync 0\n\n# Включить с интервалом 1 секунда при следующем mount:\ngoi mount ~/code/github --autosync 1\n\n# Посмотреть сообщения ядра:\nsudo dmesg | tail -30',refs:[R('goi_super'),R('vtfs_remote_fill_super'),R('goi_background_sync'),R('goi_sync_all'),R('vtfs_remote_kill_sb')]},
{title:'11. Сравнение способов сохранения',html:`<div class="table-wrap"><table><tr><th>Действие</th><th>Запуск и охват</th><th>Кто ждёт / где ошибка</th></tr><tr><td>goi sync файл</td><td>open + fsync одного файла; goi_sync_inode.</td><td>Поток CLI ждёт; ошибка возвращается в терминал.</td></tr><tr><td>goi sync</td><td>ioctl GOI_SYNC_ALL на корне mount; проход по отслеживаемым inode всего mount.</td><td>CLI ждёт завершения прохода. Это не один fsync «всей системы».</td></tr><tr><td>autosync</td><td>delayed_work → goi_sync_all; весь mount.</td><td>Работает kworker; приложение не ждёт. Ошибка в журнале ядра.</td></tr><tr><td>goi commit</td><td>Сначала сохранение выбранных файлов, затем публикация сервисом.</td><td>CLI ждёт; GitHub-коммит — отдельный этап после SQLite.</td></tr></table></div><p>Во всех трёх вариантах синхронизации общий нижний путь один: <code>goi_sync_inode → HTTP write → SQLite commit</code>. Отличаются инициатор, объём обхода и способ получения результата.</p><p>Вызов системной функции не означает обязательное переключение на другой процесс: при fsync поток goi входит в ядро и может уснуть, ожидая I/O. Фоновая задача начинается из другого потока — kworker. На сервере в обоих случаях запрос обрабатывает Python-процесс.</p><p>inode_lock сериализует доступ при сохранении: один и тот же файл не сохраняется двумя обработчиками одновременно. Это не атомарный снимок всех файлов проекта: обход пофайловый.</p>`,steps:[['Явно: поток goi','fsync(файл) или ioctl(весь mount) → ожидание результата.'],['В фоне: kworker','delayed_work → goi_background_sync → goi_sync_all.'],['Общая функция','goi_sync_inode: собрать и отправить полный файл.'],['Общая граница подтверждения','SQLite commit на сервере → ответ.'],['Разные получатели результата','CLI печатает ошибку; autosync пишет в журнал и повторяет позднее.']],sim:true,refs:[C('sync_file'),C('sync_all'),R('goi_ioctl'),R('goi_fsync'),R('goi_background_sync'),R('goi_sync_inode')]},
{title:'12. HTTP и SQLite',html:`<p>Модуль не использует libc, requests или Python. C-клиент создаёт сокет ядра и отправляет HTTP по TCP. Цепочка основана на шаблоне лабы: fill_request → send_all → receive_all → parse_http_response. Есть обработка частичной передачи, таймауты и проверки длины.</p><p><code>/api</code> возвращает бинарный статус и бинарные данные или метаданные. Размер поля, byte order и структура заданы совместно в remote.c и protocol.py. <code>/control</code> использует JSON. Это два представления протокола одного микросервиса.</p><p>Сервер сначала полностью читает тело запроса. Под блокировкой Store выполняет операцию и commit; при исключении откатывает транзакцию. Только потом формирует успешный ответ. HTTP-ответ сам по себе ещё не успех операции: нужно проверить её статус внутри протокола.</p><p>Таблицы: nodes — дерево и байты; accounts — учётные записи и токены; repos — активация; branches — исходные коммиты; devices — незавершённые Device Flow; conflicts — данные конфликтов. Ветки и файлы не являются git checkout на диске: их рабочие версии хранятся в БД.</p>`,steps:[['VTFS → goi_call','Выбирает параметры сервера из super_block.'],['vtfs_http_call','TCP connect, HTTP-заголовки, query и при необходимости тело POST.'],['Handler.api или Handler.control','Проверка session token, аргументов и размера.'],['Store + SQLite','Обработка под RLock и фиксация транзакции.'],['Ответ → parse_http_response','Проверка HTTP, длины и статуса; метаданные обновляют inode.']],refs:[R('goi_call'),ref('source/http.c','vtfs_http_call'),ref('source/http.c','parse_http_response'),ref('goi/protocol.py','metadata'),H('handle_request'),H('api'),ref('goi/schema.sql','nodes')]},
{title:'13. Status, diff и commit',html:`<p>status и diff сначала синхронизируют mount, затем читают изменения текущей ветки на сервисе. Сравнение для diff идёт с исходным blob, а проверка актуальной удалённой версии производится перед commit.</p><p>goi commit с путями синхронизирует выбранные существующие файлы; без путей — mount целиком, но публикует изменения текущей ветки. Сообщение записывается в .goi/commit/message и сохраняется через fsync. Затем CLI делает /control commit.</p><p>Сервис проверяет права и текущий HEAD, сравнивает SHA и режимы файлов, создаёт blobs, tree, commit и обновляет ref без force. fsync одной транзакции SQLite и GitHub commit — две разные операции. Для удаления единственного файла используется Contents DELETE: Git Trees API в проверенном случае возвращал 404.</p><p>Намерение публикации сохраняется в SQLite перед обновлением ref. Recover проверяет опубликованный SHA и сохраняет последующие локальные правки; неоднозначные случаи требуют ручной проверки. Это не распределённая транзакция между SQLite и GitHub.</p>`,steps:[['CLI: синхронизация','Подготовить актуальные байты на сервисе.'],['CLI: сообщение и /control commit','Передать ветку и выбранные пути.'],['Сервис: проверки','Права, актуальный HEAD, исходные SHA, конфликты.'],['GitHub: blobs → tree → commit','Собрать один коммит из одного или нескольких файлов.'],['GitHub: update ref без force','Привязать ветку к новому коммиту; при гонке возможен отказ.'],['SQLite: новые baseline SHA','Снять опубликованные изменения и вернуть SHA в CLI.']],commands:'goi status\ngoi diff\ngoi commit README.md -m "Update README"\n# Все изменения текущей ветки:\ngoida -m "Save changes"',refs:[C('main'),P('status'),P('diff'),P('selected'),P('commit'),G('create_tree'),G('update_head'),G('delete_file')]},
{title:'14. Конфликты и сохранение Vim',html:`<p>Конфликт — несовместимое изменение относительно известной исходной версии, а не просто различие двух произвольных файлов. При обнаружении сервис создаёт отдельную копию в .goi/commit/changes, сохраняет данные о конфликте и возвращает ошибку.</p><p>resolve без флагов читает отредактированную копию и проверяет отсутствие маркеров. --ours выбирает локальную версию, --theirs — удалённую. Оригинал заменяется только при resolve; редактору нужно переоткрыть его. Публикация после resolve всё равно требует commit.</p><p>Vim может переименовать исходник в README.md~, создать новый README.md и удалить backup. dirty_nodes переносит исходные SHA на замену, когда видит эту пару. Созданные и удалённые до публикации временные файлы не являются удалениями на GitHub. Это обработка сохранения редактора, а не игнорирование файлов по маске.</p>`,steps:[['GitHub изменён после загрузки','Перед commit сервис сравнивает исходную и актуальную версии.'],['make_conflict → Store.mirror','Создать отдельный файл с маркерами и строку conflicts.'],['Пользователь редактирует копию','Или явно выбирает --ours / --theirs.'],['goi resolve → publish.resolve','Обновить рабочий файл и снять конфликт.'],['Повторный commit','Опубликовать выбранный результат.']],commands:'vim .goi/commit/changes/README.md\ngoi sync .goi/commit/changes/README.md\ngoi resolve README.md\ncat README.md\ngoi commit README.md -m "Resolve conflict"',refs:[P('make_conflict'),S('mirror'),P('resolve'),S('dirty_nodes'),S('rename')]},
{title:'15. Ветки, refresh и shell',html:`<p>Внешняя программа не может сменить cwd родительского shell. Поэтому shell/goi.sh определяет функции cd и goi. Ручной goi switch печатает корень выбранной ветки, а shell-обёртка выполняет builtin cd.</p><p>Обёртка cd сначала вычисляет путь в subshell, затем вызывает goi switch --from-cd и только после успеха меняет cwd текущего shell. Вне GOI и на уровнях корня/владельца/репозитория переключение не требуется. При ошибке сохранения cwd остаётся прежним.</p><p>GOI_SWITCH сохраняет файлы mount и освобождает кеш чистых закрытых файлов других веток. Открытые файлы и mmap не выбрасываются. Активная ветка одна на mount, а не на терминал. Она управляет кешем, а не скрывает остальные ветки.</p><p>refresh из владельца добавляет новые репозитории; из корня — организации. Из ветки обновляет чистые файлы и объединяет независимые правки. Локальные поддеревья каталогов сохраняются; конфликты остаются в служебных копиях. Активация уже активного репозитория не является общей командой обнаружения новых веток: это ограничение текущего кода.</p>`,steps:[['cd ../main/src','Shell вычисляет целевой путь без изменения текущего cwd.'],['goi switch --from-cd','Определяет корень ветки, открывает его.'],['ioctl GOI_SWITCH','Если ветка действительно меняется: goi_sync_all с keep_branch.'],['goi_drop_cache','Убирает содержимое закрытых чистых файлов неактивных веток.'],['builtin cd','Переходит в исходно выбранный вложенный каталог.']],commands:'source ~/code/goi/shell/goi.sh\ngoi switch main\n# Новые репозитории:\ncd ~/code/github/TheGeniusOfEternity\ngoi refresh',refs:[ref('shell/goi.sh','cd()'),C('branch_context'),C('switch_branch'),C('main'),R('goi_ioctl'),R('goi_drop_cache'),S('refresh_owners'),S('refresh')]},
{title:'16. Размонтирование и выгрузка',html:`<p>goi unmount сначала ждёт синхронизации всего mount, затем вызывает umount. Если сохранение не удалось, CLI не переходит к размонтированию. Busy mount (cwd другого shell, открытые файлы) тоже может помешать.</p><p>При уничтожении HTTP-backend отменяется delayed_work и освобождаются структуры экземпляра. Сам каталог остаётся обычной папкой. Сервер и SQLite продолжают существовать независимо.</p><p>rmmod удаляет тип ФС и выгружает код модуля, когда он больше не используется. Это отдельный уровень жизненного цикла. Снова mount возможен только после загрузки модуля. Принудительную выгрузку не используем.</p><p>Ни unmount, ни rmmod не создают GitHub-коммит. После сохранения в SQLite неопубликованные изменения переживают перезапуск сервера. RAM-backend, в отличие от HTTP-backend, теряет содержимое после unmount.</p>`,steps:[['Выйти из mount','cd ~/code; закрыть использующие ФС приложения.'],['goi unmount → GOI_SYNC_ALL','Дождаться серверного сохранения.'],['umount → kill_sb','Отменить фоновую задачу, освободить mount.'],['sudo rmmod vtfs','vtfs_exit → unregister_filesystem → выгрузка кода.'],['goi service stop','Остановить фоновый сервер; файлы базы остаются.']],commands:'cd ~/code\ngoi unmount ~/code/github\nsudo rmmod vtfs\ngoi service stop',refs:[C('main'),R('goi_sync_fs'),V('vtfs_kill_sb'),R('vtfs_remote_kill_sb'),R('goi_evict_inode'),V('vtfs_exit'),H('main')]},
{title:'17. Карта исходников и проверка понимания',html:`<p>Слева — порядок изучения, ниже — точки входа во все основные элементы. Нажатие на имя показывает исходный текст; это надёжнее ссылки на номера строк в будущей изменённой версии.</p><details><summary>Почему dentry и inode не одно и то же?</summary><p>Имя в каталоге и сам объект файла — разные сущности. Имя может измениться, несколько имён в общем случае могут указывать на один inode, а открытый файл имеет ещё собственное состояние struct file.</p></details><details><summary>Почему после fsync goi status всё ещё показывает modified?</summary><p>Байты уже подтверждены SQLite, но ещё не опубликованы на GitHub. Флаг dirty ядра и dirty в базе отвечают на разные вопросы.</p></details><details><summary>Почему autosync может выполнять HTTP, а обработчик прерывания — плохое место для этого?</summary><p>Наша threaded workqueue исполняет callback в рабочем потоке: он может спать, ждать сеть и mutex. Это не жёсткий interrupt context.</p></details><details><summary>Чем очередь отличается от нового процесса?</summary><p>Мы создаём структуру работы с callback и ставим её в очередь существующей инфраструктуры потоков ядра. fork/exec пользовательского goi не происходит.</p></details><details><summary>Почему init_fs_context не вызывает fill_super сразу?</summary><p>На первом этапе только создаётся контекст и задаются callbacks. VFS ещё должен разобрать параметры и создать экземпляр. Позже get_tree_nodev вызывает fill_super с подготовленным super_block.</p></details><details><summary>Какие границы у текущей реализации?</summary><p>Один писатель рабочей копии; файл до 64 МиБ; нет общей квоты RAM; нет ссылок, создания веток и первого коммита пустого репозитория. Сетевое сохранение пофайловое. Поддержка всех версий Linux не заявлена. Сервис может быть удалённым, но HTTP требует доверенной сети либо SSH-туннеля.</p></details>`,steps:[['CLI / shell','Команды пользователя и переходы между ветками.'],['vtfs.c / remote.c','Регистрация типа, монтирование и файловые операции.'],['http.c / protocol.py','Передача и формат сообщений.'],['server.py / storage.py / schema.sql','Диспетчер запросов и долговечное рабочее состояние.'],['github.py / publish.py','Внешний API, сравнение изменений, публикация и конфликты.']],refs:[C('main'),ref('shell/goi.sh','goi()'),V('vtfs_init'),V('vtfs_get_tree'),R('goi_new_inode'),R('goi_file_ops'),R('goi_background_sync'),ref('source/http.c','vtfs_http_call'),ref('goi/protocol.py','metadata'),H('handle_request'),S('__init__'),ref('goi/schema.sql','nodes'),G('request'),P('commit')]}
];

section(4,'2. Запуск микросервиса',{html:'<p>goi-server — отдельный Python-процесс. Для локального сервера goi mount запускает пользовательский unit systemd и ждёт готовности HTTP; systemd перезапускает процесс после аварии. Явно заданный удалённый сервер запускается отдельно. Он принимает HTTP-запросы от ядра и CLI, хранит рабочие версии в SQLite и обращается к GitHub через HTTPS. Сам модуль ядра в GitHub API не ходит.</p>'+lessons[11].html,steps:[['Запуск Python','Прочитать --data, --listen, --port и Client ID.'],['Store.__init__','Открыть SQLite, включить WAL и synchronous=FULL, создать таблицы и выполнить миграции.'],['session_token','Создать или прочитать server-token. Не путать с GitHub access token.'],['Server.serve_forever','Принимать HTTP. Запросы обслуживают потоки, операции Store сериализует RLock.']],commands:'goi service install --client-id CLIENT_ID_ТВОЕГО_OAUTH_APP\ngoi service start\ngoi service status\njournalctl --user -u goi -f',refs:[ref('goi/service.py','ensure'),ref('goi/service.py','install'),H('main'),S('__init__'),H('session_token'),H('Server'),H('handle_request'),ref('goi/schema.sql','nodes')]}),

chapters[0].html += '<p>При обычном mount есть ещё один процесс: локальный journal. Он сохраняет снимок в SQLite на клиенте до возврата write; основной сервис может находиться на другой машине.</p>';
chapters[3].html += '<p>goi mount автоматически запускает локальный журнал и восстанавливает его до подключения VFS. --cache-mib задаёт квоту содержимого файлов в RAM, --no-journal явно отключает защиту до fsync.</p>';
chapters[3].refs.unshift(ref('goi/journal.py','ensure'));
chapters[4].html += '<p>goi accounts показывает Client ID и логины. goi logout login удаляет токен, сохраняя рабочие файлы; повторный goi auth использует прежний аккаунт. Скачивание и публикация без токена недоступны, сохранённые данные остаются локально доступны.</p>';
chapters[8].html += '<p>Перед возвратом успешного write модуль сохраняет полный снимок в локальный журнал. goi_reserve учитывает dirty и открытые файлы в квоте; чистые закрытые копии освобождаются при нехватке места, иначе ENOSPC. Метаданные и временные буферы считаются отдельно.</p>';
chapters[8].steps=[['write / truncate','Редактор меняет содержимое обычными системными вызовами.'],['goi_reserve','Резервировать память; вытеснить чистые закрытые копии либо ENOSPC.'],['page cache + dirty','Изменить страницы и пометить файл для отправки основному сервису.'],['goi_journal → HTTP loopback','Послать полный снимок локальному Python-процессу.'],['Journal.record → SQLite FULL commit','Сохранить исходную ревизию, права и последние байты на диске клиента.'],['Ответ write','Успех означает наличие долговечной клиентской копии; GitHub ещё не изменился.']];

chapters[14].html += '<p>После аварии goi mount воспроизводит клиентский журнал. Проверяется исходная ревизия либо совпадение байтов и прав. ESTALE сохраняет запись для ручного разбора: goi journal export --output DIR. goi journal discard --id N после unmount явно удаляет выбранную запись.</p>';

const sourceData=JSON.parse(document.getElementById("source-data").textContent);
function lineFor(file,symbol){
 const lines=(sourceData[file]||'').split('\n');
 const needle=symbol.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const py=new RegExp('^\\s*(?:def|class) '+needle+'(?:\\(|:)');
 let i=lines.findIndex(l=>py.test(l));
 if(i<0)i=lines.findIndex(l=>new RegExp('^(?:static |struct |int |void |char |ssize_t )').test(l)&&l.includes(symbol)&&!l.trim().endsWith(';'));
 if(i<0)i=lines.findIndex(l=>l.includes(symbol));
 return Math.max(0,i);
}
function sourceExtent(file,start){
 const lines=sourceData[file].split('\n');
 if(file.endsWith('.py')){const indent=lines[start].match(/^ */)[0].length;let end=start+1;for(;end<lines.length;end++){if(lines[end].trim()&&lines[end].match(/^ */)[0].length<=indent)break}return Math.min(end,start+240)}
 if(file.endsWith('.c')){let end=start+1;for(;end<lines.length;end++)if(/^}/.test(lines[end]))return end+1;return Math.min(start+70,lines.length)}
 return Math.min(start+70,lines.length);
}
const glossary={
 'journal':{title:'Journal — журнал записей клиента',html:'<p>Отдельный локальный Python-процесс и SQLite. Полный снимок файла сохраняется перед успешным ответом write и удаляется после подтверждённого fsync на основном сервисе. При аварии VM восстановление проверяет ревизию. Это другой журнал, чем намерения публикации GitHub.</p>',refs:[ref('goi/journal.py','Journal'),R('goi_journal')]},
 'inode':{title:'inode — объект файла',html:lessons[1].html,refs:[R('goi_new_inode'),R('goi_inode'),V('vtfs_new_inode')]},
 'dentry':{title:'dentry — имя в каталоге',html:'<p>Связывает имя и родительский каталог с inode. Имя README.md находится здесь; размер, права и операции — в inode. Это объект в памяти ядра, а не SQL-строка и не весь каталог.</p><p>При lookup VTFS получает метаданные от сервера, создаёт inode и связывает его с dentry. Отрицательный dentry означает, что имя отсутствует. В обычных Linux-ФС несколько dentry могут ссылаться на один inode (hard links); в GOI hard links не реализованы.</p>',refs:[R('goi_lookup'),R('goi_revalidate'),R('goi_create_common')]},
 'vfs':{title:'VFS — общий слой файловых систем',html:'<p>Virtual File System находится в ядре Linux. Приложения используют одинаковые open, read, write и fsync, а VFS вызывает callbacks выбранной файловой системы.</p><p>Мы не написали VFS целиком: мы зарегистрировали тип vtfs и заполнили таблицы inode_operations, file_operations и super_operations. VFS — библиотека механизмов и маршрутизация операций внутри ядра, не отдельный демон.</p><p><a href="https://docs.kernel.org/filesystems/vfs.html">Документация Linux VFS</a></p>',refs:[V('vtfs_fs_type'),R('goi_file_ops'),R('goi_dir_inode_ops')]},
 'super_block':{title:'super_block — экземпляр ФС',html:lessons[2].html,refs:[R('goi_super'),R('vtfs_remote_fill_super')]},
 'fs_context':{title:'fs_context — подготовка монтирования',html:'<p>Временный объект подготовки mount: параметры и callbacks. init_fs_context выделяет config, parse_param читает опции, get_tree создаёт экземпляр ФС через get_tree_nodev.</p><p>super_block появится на следующем этапе; поэтому fill_super не вызывается напрямую из init_fs_context.</p>',refs:[V('vtfs_init_fs_context'),V('vtfs_parse_param'),V('vtfs_get_tree')]},
 'fsync':{title:'fsync — подтверждённое сохранение',html:lessons[8].html,refs:[C('sync_file'),R('goi_fsync'),R('goi_sync_inode')]},
 'autosync':{title:'autosync — фоновая синхронизация GOI',html:lessons[9].html+lessons[10].html,refs:[R('goi_background_sync'),R('goi_sync_all')]},
 'workqueue':{title:'workqueue — очередь работы ядра',html:lessons[9].html,refs:[R('goi_super'),R('goi_background_sync'),R('vtfs_remote_fill_super')]},
 'kworker':{title:'kworker — рабочий поток ядра',html:'<p>Поток ядра, исполняющий поставленные в workqueue callbacks. Наша фоновая задача может спать в ожидании HTTP. Это не отдельный запуск goi и не аппаратное прерывание.</p><p>При явном fsync вызывающий поток goi входит в ядро; при autosync та же нижняя функция сохранения вызывается из kworker. Механизм сохранения совпадает, контекст и получение результата различаются.</p>',refs:[R('goi_background_sync'),R('goi_sync_inode')]},
 'delayed_work':{title:'delayed_work — отложенная работа',html:'<p>Структура, которая связывает callback с отложенным запуском. Задержка измеряется в тиках; в коде используется autosync × HZ. Когда задержка проходит, выполнение получает рабочая очередь.</p><p>Мы планируем следующий проход после окончания предыдущего, поэтому это не строгий таймер «каждую секунду» и не гарантия максимального времени сохранения.</p>',refs:[R('goi_super'),R('goi_background_sync'),R('vtfs_remote_kill_sb')]},
 'page cache':{title:'Page cache — содержимое в памяти ядра',html:lessons[7].html,refs:[R('goi_new_inode'),R('goi_load'),R('goi_write_iter'),R('goi_drop_cache')]},
 'dirty':{title:'Dirty: о какой копии идёт речь?',html:'<p><code>goi_inode.dirty</code> означает, что содержимое RAM ещё не подтверждено микросервисом. <code>nodes.dirty</code> в SQLite означает, что рабочий файл ещё не опубликован на GitHub. Внутренние dirty-флаги страниц Linux — ещё один механизм, их нельзя механически приравнивать к двум нашим флагам.</p><p>После fsync первый флаг снимается, второй остаётся до commit. Это причина, по которой goi status после goi sync всё ещё показывает modified.</p>',refs:[R('goi_write_iter'),R('goi_sync_inode'),S('write'),P('commit')]},
 'ioctl':{title:'ioctl — управляющая операция через fd',html:'<p>Системный вызов для команд, которые не сводятся к read/write. Наш CLI открывает каталог и посылает числовую команду GOI_SYNC_ALL или GOI_SWITCH.</p><p>goi sync без путей использует ioctl, а goi sync файл — fsync. Для ioctl в file_operations установлен callback goi_ioctl. Это команда ядру, не HTTP-запрос непосредственно серверу.</p>',refs:[C('sync_all'),C('switch_branch'),R('goi_ioctl')]},
 'sqlite':{title:'SQLite — долговечная рабочая копия',html:lessons[11].html,refs:[S('__init__'),H('handle_request'),ref('goi/schema.sql','nodes')]},
 'fd':{title:'fd — дескриптор в таблице процесса',html:'<p>Целое число, возвращаемое open. В таблице дескрипторов процесса оно ссылается на открытый struct file. fd — не inode ID и не имя файла.</p><p>Два отдельных open могут иметь разные позиции чтения. dup или наследование дескриптора могут разделять одно открытое описание. fsync принимает именно fd.</p>',refs:[C('sync_file'),C('sync_all')]},
 'struct file':{title:'struct file — состояние открытия',html:'<p>Объект ядра с режимом доступа, позицией, путём и файловыми операциями. inode описывает сам объект файла, а struct file — конкретное открытие. Он удерживает ссылки на путь и inode, пока используется.</p>',refs:[R('goi_open'),R('goi_release'),R('goi_file_ops')]},
 'inode_lock':{title:'inode_lock — блокировка inode',html:'<p>Захватывает блокировку inode (i_rwsem) на запись. В нашем сохранении она защищает сборку и отправку содержимого от одновременной записи в тот же файл.</p><p>Ожидание ответа сервера происходит под этой блокировкой, поэтому конкурентная запись того же файла может ждать сеть. Блокировка одного inode не превращает синхронизацию всех файлов в общую атомарную транзакцию.</p>',refs:[R('goi_sync_inode'),R('goi_write_iter')]},
 'blob':{title:'Blob — содержимое файла Git',html:'<p>Git-объект с байтами одного файла. Имя и путь хранятся в tree. SHA рассчитывается из типа, длины и содержимого объекта; GOI проверяет полученные blobs по SHA.</p>',refs:[G('blob_sha'),G('blob'),G('create_blob')]},
 'tree':{title:'Tree — снимок каталога Git',html:'<p>Содержит имена, режимы и ссылки на blobs или вложенные trees. Commit указывает на корневое tree. В GOI исходные tree SHA позволяют лениво читать каталоги без загрузки всех файлов.</p>',refs:[G('tree'),S('load_directory'),G('create_tree')]},
 'baseline':{title:'Baseline — известная исходная версия',html:'<p>Исходный путь, blob SHA и режим файла, от которых сделаны локальные изменения. Это нужно для diff и обнаружения настоящего конфликта, когда GitHub тоже изменился.</p><p>При замене файла редактором baseline переносится на новую локальную запись, если она заменяет удалённую исходную.</p>',refs:[S('dirty_nodes'),P('commit')]}
};

function highlight(text,file){
 const pattern=/(\/\*[\s\S]*?\*\/|\/\/[^\n]*|#[^\n]*|"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:0x[\da-fA-F]+|\d+)\b|\b[A-Za-z_]\w*\b)/g;
 const keywords=new Set('if else elif for while return def class import from as with try except finally raise in not and or is lambda pass break continue yield static const void int unsigned long bool struct enum sizeof switch case default goto NULL true false None True False CREATE TABLE IF NOT EXISTS INTEGER PRIMARY KEY TEXT NOT NULL DEFAULT INDEX ON WHERE'.split(' '));
 let out='',last=0,m;while((m=pattern.exec(text))){out+=escapeHTML(text.slice(last,m.index));const t=m[0];let kind='';if(t.startsWith('//')||t.startsWith('/*')||t.startsWith('#')&&!file.endsWith('.c')&&!file.endsWith('.h'))kind='comment';else if(t.startsWith('"')||t.startsWith("'"))kind='string';else if(/^\d/.test(t))kind='number';else if(keywords.has(t)||t.startsWith('#'))kind='keyword';else if(/^\s*\(/.test(text.slice(m.index+t.length)))kind='function';else if(/^(?:u\d+|s\d+|size_t|ssize_t|loff_t|umode_t|__le\d+)$/.test(t))kind='type';out+=kind?'<span class="tok-'+kind+'">'+escapeHTML(t)+'</span>':escapeHTML(t);last=pattern.lastIndex;}return out+escapeHTML(text.slice(last));
}

function edges(){const nodes=[...document.querySelectorAll('.node')];el('edge-lines').innerHTML=positions.slice(0,-1).map((p,i)=>{const q=positions[i+1],w=nodes[i].offsetWidth,h=nodes[i].offsetHeight;let x1=p.x+w/2,y1=p.y+h,x2=q.x+w/2,y2=q.y;if(Math.abs(p.y-q.y)<100&&q.x>p.x+w){x1=p.x+w;y1=p.y+h/2;x2=q.x;y2=q.y+nodes[i+1].offsetHeight/2;return `<path d="M ${x1} ${y1} C ${x1+30} ${y1}, ${x2-30} ${y2}, ${x2} ${y2}" stroke="#a488c8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>`;}return `<path d="M ${x1} ${y1} C ${x1} ${y1+50}, ${x2} ${y2-50}, ${x2} ${y2}" stroke="#a488c8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>`}).join('');}
function fit(){const board=el('board').getBoundingClientRect(),mobile=innerWidth<720;const left=!mobile&&!el('left-panel').hidden?el('left-panel').offsetWidth+40:30,right=!mobile&&!el('right-panel').hidden?el('right-panel').offsetWidth+40:30;const avail=Math.max(250,board.width-left-right);const nodes=[...document.querySelectorAll('.node')],minX=Math.min(...positions.map(p=>p.x)),minY=Math.min(...positions.map(p=>p.y)),maxX=Math.max(...positions.map((p,i)=>p.x+nodes[i].offsetWidth)),maxY=Math.max(...positions.map((p,i)=>p.y+nodes[i].offsetHeight));view.z=Math.max(.2,Math.min(1.2,avail/(maxX-minX+50),(board.height-140)/(maxY-minY+30)));view.x=left+(avail-(maxX-minX)*view.z)/2-minX*view.z;view.y=60+(board.height-140-(maxY-minY)*view.z)/2-minY*view.z;transform();}
function chooseChapter(index){if(positions.length)memory.set(chapter,positions.map(p=>({...p})));chapter=index;step=0;const c=chapters[chapter];el('chapter-select').value=String(index);positions=memory.get(index)||c.steps.map((_,i)=>({x:160+(i%2)*340,y:100+Math.floor(i/2)*255}));el('nodes').replaceChildren();c.steps.forEach(([title,desc],i)=>{const b=document.createElement('button');b.className='node';b.dataset.index=i;b.style.left=positions[i].x+'px';b.style.top=positions[i].y+'px';b.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><h3>'+escapeHTML(title)+'</h3><p>'+escapeHTML(desc)+'</p><code>'+escapeHTML((c.stepRefs[i]||c.refs[0]).symbol)+'</code>';b.onclick=()=>{if(!suppressClick)selectNode(i)};el('nodes').append(b)});selectNode(0,false);requestAnimationFrame(()=>{edges();fit()});history.replaceState(null,'','#chapter-'+(index+1));}
function zoom(factor,x,y){const z=Math.max(.2,Math.min(2.5,view.z*factor));view.x=x-(x-view.x)*z/view.z;view.y=y-(y-view.y)*z/view.z;view.z=z;transform();}
el('board').addEventListener('wheel',e=>{e.preventDefault();const r=el('board').getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
el('board').addEventListener('pointerdown',e=>{if(e.button!==0)return;const n=e.target.closest('.node');gesture={id:e.pointerId,x:e.clientX,y:e.clientY,node:n,index:n?Number(n.dataset.index):-1,origin:n?{...positions[Number(n.dataset.index)]}:{x:view.x,y:view.y},moved:false};suppressClick=false;el('board').setPointerCapture(e.pointerId);el('board').classList.add('dragging')});
el('board').addEventListener('pointermove',e=>{if(!gesture||e.pointerId!==gesture.id)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>4)gesture.moved=true;if(!gesture.moved)return;if(gesture.node){const p=positions[gesture.index];p.x=gesture.origin.x+dx/view.z;p.y=gesture.origin.y+dy/view.z;gesture.node.style.left=p.x+'px';gesture.node.style.top=p.y+'px';edges()}else{view.x=gesture.origin.x+dx;view.y=gesture.origin.y+dy;transform()}});
function endGesture(e){if(!gesture||e.pointerId!==gesture.id)return;const g=gesture;gesture=null;suppressClick=g.moved;el('board').classList.remove('dragging');if(!g.moved&&g.node)selectNode(g.index);setTimeout(()=>suppressClick=false,0)}
el('board').addEventListener('pointerup',endGesture);el('board').addEventListener('pointercancel',()=>{gesture=null;el('board').classList.remove('dragging')});
for(const side of ['left','right']){el('toggle-'+side).onclick=()=>panel(side,el(side+'-panel').hidden);el('close-'+side).onclick=()=>panel(side,false)}
el('zoom-in').onclick=()=>zoom(1.2,el('board').clientWidth/2,el('board').clientHeight/2);el('zoom-out').onclick=()=>zoom(1/1.2,el('board').clientWidth/2,el('board').clientHeight/2);el('fit').onclick=fit;
el('previous-step').onclick=()=>selectNode(step-1);el('next-step').onclick=()=>selectNode(step+1);el('close-term').onclick=()=>el('term-dialog').close();el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{el('fullscreen').textContent='Используй F11'}};
chapters.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.title;el('chapter-select').append(o)});el('chapter-select').onchange=e=>chooseChapter(Number(e.target.value));window.addEventListener('resize',()=>{if(innerWidth<720&&!el('left-panel').hidden&&!el('right-panel').hidden)panel('left',true);fit()});
const model={ram:0,db:0,gh:0,serial:0};function updateModel(action){const offline=el('offline').checked;if(action==='reset'){Object.assign(model,{ram:0,db:0,gh:0,serial:0});el('offline').checked=false}else if(action==='edit')model.ram=++model.serial;else if(!offline){model.db=model.ram;if(action==='commit')model.gh=model.db}['ram','db','gh'].forEach(k=>el(k+'-version').textContent='v'+model[k]);el('sim-result').textContent=offline&&action!=='edit'&&action!=='reset'?(action==='auto'?'Ошибка в журнале ядра; будет повтор.':'Ошибка команды; данные остаются в RAM.'):action==='commit'?'Версия опубликована на GitHub.':action==='edit'?'Изменена RAM; подтверждения сервера ещё нет.':'SQLite подтверждена; GitHub не изменён.'}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>updateModel(b.dataset.action));
if(innerWidth<720){panel('left',false);panel('right',false)}
let initial=Number(location.hash.replace('#chapter-',''))-1;chooseChapter(Number.isInteger(initial)&&initial>=0&&initial<chapters.length?initial:0);updateModel('reset');

</script></body></html>

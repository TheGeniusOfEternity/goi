h(request[\"branch\"])\n            require(branch[\"kind\"] == \"branch\", message=\"expected a branch directory\")\n            if operation == \"status\":\n                return publish.status(store, branch[\"id\"], request.get(\"ignored\", False))\n            if operation == \"diff\":\n                return {\"diff\": publish.diff(store, branch[\"id\"])}\n            if operation == \"commit\":\n                return publish.commit(store, branch[\"id\"], request.get(\"paths\", []), request[\"message\"], request.get(\"force\", False))\n            if operation == \"recover\":\n                if request.get(\"forget\"):\n                    store.db.execute(\"DELETE FROM publications WHERE branch=?\", (branch[\"id\"],))\n                    return {\"forgotten\": True}\n                return recovery.recover(store, branch[\"id\"])\n            require(not store.db.execute(\"SELECT 1 FROM publications WHERE branch=?\", (branch[\"id\"],)).fetchone()\n                    or operation in (\"status\", \"diff\", \"commit\"), errno.EBUSY,\n                    \"recover pending publication before changing the workspace\")\n            if operation == \"restore\":\n                return workspace.restore(store, branch[\"id\"], request.get(\"paths\", []))\n            if operation == \"refresh\":\n                return store.refresh(branch[\"id\"])\n            path = request[\"path\"]\n            conflicted = {row[0] for row in store.db.execute(\"SELECT node FROM conflicts WHERE branch=?\", (branch[\"id\"],))}\n            candidates = [n for n in store.dirty_nodes(branch[\"id\"])\n                          if n[\"id\"] in conflicted and (store.path(n) == path or n[\"base_path\"] == path)]\n            require(len(candidates) == 1, errno.ENOENT, \"conflicted file not found\")\n            publish.resolve(store, candidates[0][\"id\"], request.get(\"choice\"))\n            return {\"resolved\": path}\n        raise Error(errno.ENOSYS, \"unknown control operation\")\n\n\ndef session_token(directory):\n    path = Path(directory) / \"server-token\"\n    if not path.exists():\n        try:\n            fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)\n        except FileExistsError:\n            pass\n        else:\n            with os.fdopen(fd, \"w\") as file:\n                file.write(secrets.token_hex(32) + \"\\n\")\n                file.flush()\n                os.fsync(file.fileno())\n    token = path.read_text().strip()\n    require(len(token) == 64 and all(c in \"0123456789abcdef\" for c in token), message=\"invalid server-token file\")\n    os.chmod(path, 0o600)\n    return token\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"--data\", default=str(Path.home() / \".local/share/goi\"))\n    parser.add_argument(\"--listen\", default=\"127.0.0.1\")\n    parser.add_argument(\"--port\", type=int, default=8080)\n    parser.add_argument(\"--client-id\", default=os.environ.get(\"GOI_GITHUB_CLIENT_ID\", \"\"))\n    parser.add_argument(\"--cache-mib\", type=int, default=256, help=\"clean blob cache limit; 0 disables caching\")\n    args = parser.parse_args()\n    if args.cache_mib < 0:\n        parser.error(\"--cache-mib must be nonnegative\")\n    store = Store(args.data, args.client_id, cache_bytes=args.cache_mib * 1024 * 1024)\n    with store.db:\n        store.trim_cache()\n    for row in list(store.db.execute(\"SELECT branch FROM publications\")):\n        try:\n            recovery.recover(store, row[\"branch\"])\n        except Exception as exc:\n            store.db.rollback()\n            print(f\"Pending publication in branch {row['branch']}: {type(exc).__name__}; use goi recover\", flush=True)\n    server = Server((args.listen, args.port), store, session_token(args.data))\n    print(f\"GOI server on {args.listen}:{server.server_port}; session token file: {args.data}/server-token\", flush=True)\n    try:\n        server.serve_forever()\n    except KeyboardInterrupt:\n        pass\n    finally:\n        server.server_close()\n        store.close()\n\n\nif __name__ == \"__main__\":\n    main()\n", "goi/storage.py": "\"\"\"Durable, lazy GitHub working copies. SQLite transactions are the fsync boundary.\"\"\"\n\nimport errno\nimport json\nimport os\nfrom pathlib import Path\nimport sqlite3\nimport stat\nimport threading\nimport time\nfrom urllib.parse import quote\n\nfrom .github import GitHub, blob_sha\nfrom .protocol import MAX_FILE_SIZE, require\n\n\nclass Store:\n    def __init__(self, directory, client_id=\"\", github_factory=GitHub, cache_bytes=256 * 1024 * 1024):\n        require(cache_bytes >= 0, message=\"cache limit must be nonnegative\")\n        self.cache_bytes = cache_bytes\n        self.directory = Path(directory)\n        self.directory.mkdir(mode=0o700, parents=True, exist_ok=True)\n        os.chmod(self.directory, 0o700)\n        self.db = sqlite3.connect(self.directory / \"goi.sqlite3\", check_same_thread=False)\n        os.chmod(self.directory / \"goi.sqlite3\", 0o600)\n        self.db.row_factory = sqlite3.Row\n        self.db.execute(\"PRAGMA journal_mode=WAL\")\n        self.db.execute(\"PRAGMA synchronous=FULL\")\n        self.db.executescript(Path(__file__).with_name(\"schema.sql\").read_text())\n        self.lock = threading.RLock()\n        self.client_id, self.github_factory = client_id, github_factory\n        if not self.db.execute(\"SELECT 1 FROM nodes WHERE id=1\").fetchone():\n            self.new_node(None, \"\", \"root\", stat.S_IFDIR | 0o755)\n        with self.db:\n            self.migrate_owners()\n            self.migrate_branches()\n            self.db.execute(\"UPDATE nodes SET name='.info.json' \"\n                            \"WHERE kind='info' AND name='info.json'\")\n        self.db.commit()\n\n    def migrate_owners(self):\n        \"\"\"Move old containers without changing repository IDs or working files.\"\"\"\n        containers = self.db.execute(\n            \"SELECT * FROM nodes WHERE kind IN ('personal','orgs') AND deleted=0\").fetchall()\n        for container in containers:\n            target = container[\"parent\"] if container[\"kind\"] == \"personal\" else 1\n            for child in self.children(container[\"id\"]):\n                require(self.child(target, child[\"name\"]) is None, errno.EEXIST,\n                        \"owner migration has duplicate names; original data retained\")\n                self.update(child[\"id\"], parent=target)\n            if container[\"kind\"] == \"personal\":\n                self.update(target, loaded=container[\"loaded\"])\n            self.db.execute(\"DELETE FROM nodes WHERE id=?\", (container[\"id\"],))\n        if containers:\n            self.update(1, loaded=0)\n\n    def migrate_branches(self):\n        \"\"\"Flatten branch containers while preserving node IDs and local edits.\"\"\"\n        containers = self.db.execute(\n            \"SELECT id,parent FROM nodes WHERE kind='branches'\").fetchall()\n        for container in containers:\n            children = self.children(container[\"id\"])\n            self.db.execute(\"DELETE FROM nodes WHERE id=?\", (container[\"id\"],))\n            for child in children:\n                require(self.child(container[\"parent\"], child[\"name\"]) is None,\n                        errno.EEXIST, \"branch migration has duplicate names; original data retained\")\n                self.update(child[\"id\"], parent=container[\"parent\"])\n\n    def close(self):\n        self.db.close()\n\n    def new_node(self, parent, name, kind, mode, **values):\n        if parent is not None:\n            self.check_name(name)\n        fields = {\"parent\": parent, \"name\": name, \"kind\": kind, \"mode\": mode,\n                  \"mtime_ns\": time.time_ns(), **values}\n        cursor = self.db.execute(\n            \"INSERT INTO nodes (\" + \",\".join(fields) + \") VALUES (\" + \",\".join(\"?\" for _ in fields) + \")\",\n            tuple(fields.values()),\n        )\n        return self.node(cursor.lastrowid)\n\n    @staticmethod\n    def check_name(name):\n        require(isinstance(name, str) and name not in (\"\", \".\", \"..\") and \"/\" not in name\n                and \"\\0\" not in name, message=\"invalid filename\")\n        require(len(name.encode()) <= 255, errno.ENAMETOOLONG, \"filename exceeds 255 bytes\")\n\n    def node(self, number, *, deleted=False):\n        row = self.db.execute(\"SELECT * FROM nodes WHERE id=?\", (int(number),)).fetchone()\n        require(row is not None and (deleted or not row[\"deleted\"]), errno.ENOENT, \"object not found\")\n        return dict(row)\n\n    def update(self, number, **values):\n        self.db.execute(\"UPDATE nodes SET \" + \",\".join(key + \"=?\" for key in values) + \" WHERE id=?\",\n                        (*values.values(), number))\n        return self.node(number, deleted=True)\n\n    def child(self, parent, name):\n        row = self.db.execute(\"SELECT id FROM nodes WHERE parent=? AND name=? AND deleted=0\",\n                              (parent, name)).fetchone()\n        return self.node(row[0]) if row else None\n\n    def children(self, parent):\n        return [dict(row) for row in self.db.execute(\n            \"SELECT * FROM nodes WHERE parent=? AND deleted=0 ORDER BY name COLLATE BINARY\", (parent,))]\n\n    def github(self, account):\n        row = self.db.execute(\"SELECT token FROM accounts WHERE id=?\", (account,)).fetchone()\n        require(row is not None and row[0], errno.EACCES, \"account is not authenticated; run goi auth\")\n        return self.github_factory(row[0])\n\n    def repo(self, number):\n        row = self.db.execute(\"SELECT * FROM repos WHERE id=?\", (number,)).fetchone()\n        require(row is not None, errno.ENOENT, \"repository not found\")\n        return dict(row)\n\n    def branch(self, number):\n        row = self.db.execute(\"SELECT * FROM branches WHERE id=?\", (number,)).fetchone()\n        require(row is not None, errno.ENOENT, \"branch not found\")\n        return dict(row)\n\n    def add_account(self, token):\n        profile = self.github_factory(token).profile()\n        login = profile[\"login\"]\n        existing = self.child(1, login)\n        if existing:\n            self.db.execute(\"UPDATE accounts SET token=? WHERE id=?\", (token, existing[\"id\"]))\n            return existing\n        account = self.new_node(1, login, \"account\", stat.S_IFDIR | 0o755)\n        self.update(account[\"id\"], account=account[\"id\"])\n        self.db.execute(\"INSERT INTO accounts VALUES (?,?,?)\", (account[\"id\"], login, token))\n        self.update(1, loaded=0)\n        return self.node(account[\"id\"])\n\n    def add_repo(self, parent, item):\n        existing = self.child(parent[\"id\"], item[\"name\"])\n        if existing:\n            return existing\n        permissions = item.get(\"permissions\", {})\n        writable = bool(permissions.get(\"push\") or permissions.get(\"admin\")) and not item.get(\"archived\", False)\n        node = self.new_node(parent[\"id\"], item[\"name\"], \"repo\", stat.S_IFDIR | 0o755,\n                             account=parent[\"account\"], writable=0, loaded=1)\n        self.update(node[\"id\"], repo=node[\"id\"])\n        self.db.execute(\"INSERT INTO repos(id,account,owner,name) VALUES (?,?,?,?)\",\n                        (node[\"id\"], parent[\"account\"], item[\"owner\"][\"login\"], item[\"name\"]))\n        info = {\"owner\": item[\"owner\"][\"login\"], \"name\": item[\"name\"], \"active\": False,\n                \"writable\": writable, \"hint\": \"goi activate <repository-path>\"}\n        self.new_node(node[\"id\"], \".info.json\", \"info\", stat.S_IFREG | 0o444,\n                      data=json.dumps(info, indent=2).encode(), size=len(json.dumps(info, indent=2).encode()),\n                      account=parent[\"account\"], repo=node[\"id\"], loaded=1)\n        return self.node(node[\"id\"])\n\n    def load_directory(self, node):\n        require(stat.S_ISDIR(node[\"mode\"]), errno.ENOTDIR, \"not a directory\")\n        if node[\"kind\"] == \"root\":\n            require(self.db.execute(\"SELECT 1 FROM accounts LIMIT 1\").fetchone() is not None,\n                    errno.EACCES, \"sign in with goi auth before browsing /github\")\n        if node[\"loaded\"]:\n            return\n        kind = node[\"kind\"]\n        if kind == \"root\":\n            for account in self.db.execute(\"SELECT id FROM accounts WHERE token IS NOT NULL\").fetchall():\n                for org in self.github(account[\"id\"]).organizations():\n                    if self.child(1, org[\"login\"]) is None:\n                        self.new_node(1, org[\"login\"], \"org\", stat.S_IFDIR | 0o755,\n                                      account=account[\"id\"])\n            self.update(1, loaded=1)\n            return\n        api = self.github(node[\"account\"])\n        if kind in (\"account\", \"org\"):\n            owner = node[\"name\"]\n            for repo in api.repositories(owner, personal=kind == \"account\"):\n                if repo[\"owner\"][\"login\"].casefold() == owner.casefold():\n                    self.add_repo(node, repo)\n        elif kind in (\"branch\", \"dir\"):\n            repo = self.repo(node[\"repo\"])\n            for entry in api.tree(repo[\"owner\"], repo[\"name\"], node[\"tree_sha\"]):\n                # Symbolic links and submodules are intentionally not regular writable files.\n                if entry[\"type\"] not in (\"tree\", \"blob\") or entry[\"mode\"] == \"120000\":\n                    continue\n                if entry[\"path\"] in (\".goi\", \".git\"):\n                    continue\n                isdir = entry[\"type\"] == \"tree\"\n                path = (node[\"base_path\"] + \"/\" if node[\"base_path\"] else \"\") + entry[\"path\"]\n                permissions = (0o755 if isdir or entry[\"mode\"] == \"100755\" else 0o644)\n                if not node[\"writable\"]:\n                    permissions &= ~0o222\n                self.new_node(node[\"id\"], entry[\"path\"], \"dir\" if isdir else \"file\",\n                              (stat.S_IFDIR if isdir else stat.S_IFREG) | permissions,\n                              account=node[\"account\"], repo=node[\"repo\"], branch=node[\"branch\"],\n                              remote_sha=None if isdir else entry[\"sha\"],\n                              base_mode=entry[\"mode\"],\n                              tree_sha=entry[\"sha\"] if isdir else None, base_path=path,\n                              size=entry.get(\"size\", 0), writable=node[\"writable\"])\n        self.update(node[\"id\"], loaded=1)\n\n    def refresh_owners(self, path):\n        node = self.resolve_path(path)\n        require(node[\"kind\"] in (\"root\", \"account\", \"org\"),\n                message=\"expected /github or an owner directory\")\n        self.load_directory(self.update(node[\"id\"], loaded=0))\n        return {\"path\": path}\n\n    def lookup(self, parent, name):\n        self.check_name(name)\n        node = self.node(parent)\n        self.load_directory(node)\n        result = self.child(parent, name)\n        require(result is not None, errno.ENOENT, \"object not found\")\n        return result\n\n    def list(self, number, offset=0, limit=100):\n        node = self.node(number)\n        self.load_directory(node)\n        return self.children(number)[offset:offset + limit]\n\n    def resolve_path(self, path):\n        current = self.node(1)\n        require(isinstance(path, str) and not path.startswith(\"/\"), message=\"expected a mount-relative path\")\n        for component in path.split(\"/\"):\n            if component:\n                current = self.lookup(current[\"id\"], component)\n        return current\n\n    def activate(self, number):\n        repo = self.repo(number)\n        if repo[\"active\"] and self.db.execute(\n                \"SELECT 1 FROM branches WHERE repo=?\", (number,)).fetchone():\n            return self.node(number)\n        api = self.github(repo[\"account\"])\n        item = api.repository(repo[\"owner\"], repo[\"name\"])\n        writable = bool(item.get(\"permissions\", {}).get(\"push\")) and not item.get(\"archived\", False)\n        branches = api.branches(repo[\"owner\"], repo[\"name\"])\n        require(branches, errno.ENOENT,\n                \"repository has no branches; create the first commit on GitHub \"\n                \"(for example, add README.md), then run goi activate again\")\n        parent = self.node(number)\n        for branch in branches:\n            head = branch[\"commit\"][\"sha\"]\n            commit = api.commit(repo[\"owner\"], repo[\"name\"], head)\n            # Protection may allow PRs but not direct commits: conservatively expose read-only.\n            can_write = writable and not branch.get(\"protected\", False)\n            node = self.new_node(parent[\"id\"], quote(branch[\"name\"], safe=\"\"), \"branch\",\n                                 stat.S_IFDIR | (0o755 if can_write else 0o555),\n                                 account=repo[\"account\"], repo=number, writable=can_write,\n                                 tree_sha=commit[\"tree\"][\"sha\"], base_path=\"\")\n            self.update(node[\"id\"], branch=node[\"id\"])\n            self.db.execute(\"INSERT INTO branches VALUES (?,?,?,?,?)\",\n                            (node[\"id\"], number, branch[\"name\"], head, commit[\"tree\"][\"sha\"]))\n            self.make_controls(self.node(node[\"id\"]))\n        self.db.execute(\"UPDATE repos SET active=1 WHERE id=?\", (number,))\n        info = self.child(number, \".info.json\")\n        data = json.loads(info[\"data\"])\n        data[\"active\"] = True\n        raw = json.dumps(data, indent=2).encode()\n        self.update(info[\"id\"], data=raw, size=len(raw), revision=info[\"revision\"] + 1)\n        return self.node(number)\n\n    def make_controls(self, branch):\n        attrs = {\"account\": branch[\"account\"], \"repo\": branch[\"repo\"], \"branch\": branch[\"id\"], \"loaded\": 1}\n        goi = self.new_node(branch[\"id\"], \".goi\", \"control_dir\", stat.S_IFDIR | 0o755, **attrs)\n        commit = self.new_node(goi[\"id\"], \"commit\", \"control_dir\", stat.S_IFDIR | 0o755, **attrs)\n        self.new_node(commit[\"id\"], \"changes\", \"changes\", stat.S_IFDIR | 0o755, **attrs)\n        self.new_node(commit[\"id\"], \"message\", \"message\", stat.S_IFREG | 0o600,\n                      writable=branch[\"writable\"], data=b\"\", **attrs)\n        data = b\"gitdir: /GOI-GIT-IS-DISABLED-use-goi-instead\\n\"\n        self.new_node(branch[\"id\"], \".git\", \"git_trap\", stat.S_IFREG | 0o444,\n                      size=len(data), data=data, **attrs)\n\n    def read(self, number, offset, count):\n        node = self.node(number)\n        require(stat.S_ISREG(node[\"mode\"]), errno.EISDIR, \"not a regular file\")\n        if node[\"data\"] is None:\n            repo = self.repo(node[\"repo\"])\n            require(node[\"size\"] <= MAX_FILE_SIZE, errno.EFBIG, \"file exceeds configured size limit\")\n            data = self.github(node[\"account\"]).blob(repo[\"owner\"], repo[\"name\"], node[\"remote_sha\"])\n            node = self.update(number, data=data, size=len(data))\n        result = node[\"data\"][offset:offset + count]\n        if node[\"kind\"] == \"file\":\n            self.db.execute(\"INSERT OR REPLACE INTO cache_access VALUES (?,?)\", (number, time.time_ns()))\n        self.trim_cache()\n        return result\n\n    def trim_cache(self, limit=None):\n        \"\"\"Discard only reproducible GitHub blobs; working copies are never cache.\"\"\"\n        limit = self.cache_bytes if limit is None else limit\n        rows = self.db.execute(\n            \"SELECT n.id,length(n.data) AS bytes FROM nodes n \"\n            \"LEFT JOIN cache_access c ON c.node=n.id \"\n            \"WHERE n.kind='file' AND n.dirty=0 AND n.deleted=0 \"\n            \"AND n.remote_sha IS NOT NULL AND n.data IS NOT NULL \"\n            \"AND n.id NOT IN (SELECT node FROM conflicts) \"\n            \"AND n.branch NOT IN (SELECT branch FROM publications) \"\n            \"ORDER BY COALESCE(c.used_ns,0),n.id\").fetchall()\n        remaining = sum(row[\"bytes\"] for row in rows)\n        removed = 0\n        for row in rows:\n            if remaining <= limit:\n                break\n            self.db.execute(\"UPDATE nodes SET data=NULL WHERE id=?\", (row[\"id\"],))\n            self.db.execute(\"DELETE FROM cache_access WHERE node=?\", (row[\"id\"],))\n            remaining -= row[\"bytes\"]\n            removed += row[\"bytes\"]\n        return {\"cached_bytes\": remaining, \"removed_bytes\": removed, \"limit_bytes\": self.cache_bytes}\n\n    def create(self, parent, name, mode):\n        self.check_name(name)\n        directory = self.node(parent)\n        self.load_directory(directory)\n        require(directory[\"kind\"] in (\"branch\", \"dir\") and directory[\"writable\"], errno.EACCES,\n                \"this directory is not writable\")\n        require(name not in (\".git\", \".goi\"), errno.EPERM, \"reserved GOI name; use goi\")\n        require(self.child(parent, name) is None, errno.EEXIST, \"name already exists\")\n        kind = stat.S_IFMT(mode)\n        require(kind in (stat.S_IFREG, stat.S_IFDIR), errno.EOPNOTSUPP, \"unsupported object type\")\n        return self.new_node(parent, name, \"file\" if kind == stat.S_IFREG else \"dir\", mode,\n                             account=directory[\"account\"], repo=directory[\"repo\"], branch=directory[\"branch\"],\n                             writable=1, loaded=1, dirty=1, data=b\"\" if kind == stat.S_IFREG else None)\n\n    def remove(self, parent, name, directory=False):\n        node = self.lookup(parent, name)\n        require(node[\"kind\"] in (\"file\", \"dir\") and node[\"writable\"], errno.EACCES, \"object is read-only\")\n        require(stat.S_ISDIR(node[\"mode\"]) == directory,\n                errno.ENOTDIR if directory else errno.EISDIR, \"wrong object type\")\n        if directory:\n            self.load_directory(node)\n            require(not self.children(node[\"id\"]), errno.ENOTEMPTY, \"directory is not empty\")\n        self.update(node[\"id\"], deleted=1, dirty=1, revision=node[\"revision\"] + 1)\n\n    def path(self, node):\n        parts = []\n        while node[\"kind\"] != \"branch\":\n            require(node[\"parent\"] is not None, message=\"object is not in a branch\")\n            parts.append(node[\"name\"])\n            node = self.node(node[\"parent\"], deleted=True)\n        return \"/\".join(reversed(parts))\n\n    def rename(self, old_parent, old_name, new_parent, new_name, flags=0):\n        self.check_name(new_name)\n        require(new_name not in (\".git\", \".goi\"), errno.EPERM, \"reserved GOI name\")\n        require(flags in (0, 1), errno.EINVAL, \"unsupported rename flags\")\n        source, target_dir = self.lookup(old_parent, old_name), self.node(new_parent)\n        self.load_directory(target_dir)\n        require(source[\"kind\"] in (\"file\", \"dir\") and source[\"writable\"]\n                and target_dir[\"writable\"] and target_dir[\"kind\"] in (\"branch\", \"dir\"),\n                errno.EACCES, \"rename is not allowed\")\n        require(source[\"branch\"] == target_dir[\"branch\"], errno.EXDEV, \"cross-branch move is not atomic\")\n        if old_parent == new_parent and old_name == new_name:\n            return source\n        ancestor = target_dir\n        while ancestor[\"kind\"] != \"branch\":\n            require(ancestor[\"id\"] != source[\"id\"], errno.EINVAL, \"directory cannot contain itself\")\n            ancestor = self.node(ancestor[\"parent\"])\n        target = self.child(new_parent, new_name)\n        if target:\n            require(not flags, errno.EEXIST, \"destination exists\")\n            require(stat.S_ISDIR(target[\"mode\"]) == stat.S_ISDIR(source[\"mode\"]),\n                    errno.EISDIR if stat.S_ISDIR(target[\"mode\"]) else errno.ENOTDIR, \"type mismatch\")\n            self.remove(new_parent, new_name, directory=stat.S_ISDIR(target[\"mode\"]))\n        # Materialize directory metadata before moving, never the file contents.\n        if source[\"kind\"] == \"dir\":\n            self.materialize(source)\n        baseline = {}\n        if target and not source[\"base_path\"] and target[\"base_path\"]:\n            # An editor's unpublished temporary file replaces the original's baseline.\n            baseline = {key: target[key] for key in (\"base_path\", \"remote_sha\", \"base_mode\")}\n            self.update(target[\"id\"], dirty=0)\n        source = self.update(source[\"id\"], parent=new_parent, name=new_name, dirty=1,\n                             revision=source[\"revision\"] + 1, **baseline)\n        for child in self.descendants(source[\"id\"]):\n            if child[\"kind\"] in (\"dir\", \"file\"):\n                self.update(child[\"id\"], dirty=1)\n        return source\n\n    def materialize(self, node):\n        self.load_directory(node)\n        for child in self.children(node[\"id\"]):\n            if child[\"kind\"] == \"dir\":\n                self.materialize(child)\n\n    def descendants(self, number):\n        return [dict(row) for row in self.db.execute(\"\"\"\n          WITH RECURSIVE subtree(id) AS (SELECT id FROM nodes WHERE parent=?\n            UNION ALL SELECT n.id FROM nodes n JOIN subtree s ON n.parent=s.id)\n          SELECT n.* FROM nodes n JOIN subtree s ON n.id=s.id\n        \"\"\", (number,))]\n\n    def mirror(self, node, content):\n        \"\"\"A separate editable file is created only when GitHub reports a conflict.\"\"\"\n        goi = self.child(node[\"branch\"], \".goi\")\n        commit = self.child(goi[\"id\"], \"commit\")\n        parent = self.child(commit[\"id\"], \"changes\")\n        attrs = {\"branch\": node[\"branch\"], \"repo\": node[\"repo\"], \"account\": node[\"account\"], \"loaded\": 1}\n        parts = self.path(node).split(\"/\")\n        for part in parts[:-1]:\n            parent = self.child(parent[\"id\"], part) or self.new_node(\n                parent[\"id\"], part, \"control_dir\", stat.S_IFDIR | 0o755, **attrs)\n        mirror = self.child(parent[\"id\"], parts[-1]) or self.new_node(\n            parent[\"id\"], parts[-1], \"change\", stat.S_IFREG | 0o600, source_id=node[\"id\"], **attrs)\n        return self.update(mirror[\"id\"], data=content, size=len(content), writable=1,\n                           mode=stat.S_IFREG | 0o600, revision=mirror[\"revision\"] + 1)\n\n    def dirty_nodes(self, branch):\n        nodes = [dict(row) for row in self.db.execute(\n            \"SELECT * FROM nodes WHERE branch=? AND kind IN ('file','dir') AND dirty=1 ORDER BY id\", (branch,))]\n        replacements = {self.path(node): node for node in nodes\n                        if node[\"kind\"] == \"file\" and not node[\"deleted\"] and not node[\"base_path\"]}\n        for node in nodes:\n            if not node[\"deleted\"]:\n                continue\n            if not node[\"base_path\"]:\n                # Created and removed locally: there is nothing to publish.\n                self.update(node[\"id\"], dirty=0)\n                node[\"dirty\"] = 0\n            elif node[\"kind\"] == \"file\" and node[\"base_path\"] in replacements:\n                # Vim moves the original to a backup, writes a new file, then\n                # removes the backup. Keep the original Git baseline on its replacement.\n                replacement = replacements.pop(node[\"base_path\"])\n                baseline = {key: node[key] for key in (\"base_path\", \"remote_sha\", \"base_mode\")}\n                self.update(replacement[\"id\"], **baseline)\n                replacement.update(baseline)\n                self.update(node[\"id\"], dirty=0)\n                node[\"dirty\"] = 0\n        return [node for node in nodes if node[\"dirty\"]]\n\n    def setattr(self, number, mode=None, size=None):\n        node = self.node(number)\n        require(node[\"kind\"] in (\"file\", \"dir\") and node[\"writable\"], errno.EACCES, \"read-only object\")\n        values = {\"revision\": node[\"revision\"] + 1, \"mtime_ns\": time.time_ns(), \"dirty\": 1}\n        if mode is not None:\n            values[\"mode\"] = stat.S_IFMT(node[\"mode\"]) | (mode & 0o777)\n        if size is not None:\n            require(node[\"kind\"] == \"file\", errno.EISDIR, \"cannot resize a directory\")\n            require(0 <= size <= MAX_FILE_SIZE, errno.EFBIG, \"file exceeds configured size limit\")\n            data = self.read(number, 0, MAX_FILE_SIZE)\n            values.update(data=data[:size].ljust(size, b\"\\0\"), size=size)\n        return self.update(number, **values)\n\n    def refresh(self, branch_id):\n        from .workspace import refresh\n        return refresh(self, branch_id)\n\n    def write(self, number, data, mode):\n        \"\"\"One fsync request replaces one complete file inside the HTTP transaction.\"\"\"\n        node = self.node(number, deleted=True)\n        require(node[\"writable\"] and node[\"kind\"] in (\"file\", \"change\", \"message\"),\n                errno.EACCES, \"file is read-only\")\n        require(len(data) <= MAX_FILE_SIZE, errno.EFBIG, \"file exceeds configured size limit\")\n        return self.update(number, data=data, size=len(data), mode=stat.S_IFREG | (mode & 0o777),\n                           revision=node[\"revision\"] + 1, mtime_ns=time.time_ns(),\n                           dirty=node[\"dirty\"] if node[\"deleted\"] else int(node[\"kind\"] == \"file\"))\n", "goi/schema.sql": "CREATE TABLE IF NOT EXISTS nodes (\nid INTEGER PRIMARY KEY, parent INTEGER, name TEXT NOT NULL, kind TEXT NOT NULL,\nmode INTEGER NOT NULL, size INTEGER NOT NULL DEFAULT 0,\nmtime_ns INTEGER NOT NULL, revision INTEGER NOT NULL DEFAULT 1,\naccount INTEGER, repo INTEGER, branch INTEGER,\nremote_sha TEXT, tree_sha TEXT, base_path TEXT, data BLOB,\ndirty INTEGER NOT NULL DEFAULT 0, deleted INTEGER NOT NULL DEFAULT 0,\nloaded INTEGER NOT NULL DEFAULT 0, writable INTEGER NOT NULL DEFAULT 0,\nsource_id INTEGER, base_mode TEXT);\nCREATE UNIQUE INDEX IF NOT EXISTS names ON nodes(parent,name) WHERE deleted=0;\nCREATE TABLE IF NOT EXISTS accounts (id INTEGER PRIMARY KEY, login TEXT, token TEXT);\nCREATE TABLE IF NOT EXISTS repos (id INTEGER PRIMARY KEY, account INTEGER,\nowner TEXT, name TEXT, active INTEGER DEFAULT 0);\nCREATE TABLE IF NOT EXISTS branches (id INTEGER PRIMARY KEY, repo INTEGER,\nname TEXT, head TEXT, tree_sha TEXT);\nCREATE TABLE IF NOT EXISTS devices (id TEXT PRIMARY KEY, code TEXT, expires REAL,\ninterval INTEGER, next_poll REAL);\nCREATE TABLE IF NOT EXISTS conflicts (node INTEGER PRIMARY KEY, branch INTEGER,\npath TEXT, theirs BLOB, remote_sha TEXT, remote_head TEXT, mirror INTEGER, remote_mode TEXT);\nCREATE TABLE IF NOT EXISTS publications (branch INTEGER PRIMARY KEY,\nbase TEXT NOT NULL, target TEXT, payload TEXT NOT NULL, state TEXT NOT NULL);\n\nCREATE TABLE IF NOT EXISTS cache_access (node INTEGER PRIMARY KEY, used_ns INTEGER NOT NULL);\n", "goi/protocol.py": "\"\"\"Version 1 of the bounded HTTP/binary protocol shared with the kernel.\"\"\"\n\nimport errno\nimport struct\n\nSTATUS = struct.Struct(\"<q\")\nMETA = struct.Struct(\"<QQQIIQ\")  # id, size, mtime_ns, mode, flags, revision\nCOUNT = struct.Struct(\"<I\")\nNAME_LEN = struct.Struct(\"<H\")\nREADONLY = 1\nBRANCH = 2\nCHUNK_SIZE = 32768\nMAX_FILE_SIZE = 64 * 1024 * 1024\nMAX_REQUEST = MAX_FILE_SIZE\n\n\nclass Error(Exception):\n    def __init__(self, code, message):\n        super().__init__(message)\n        self.code = code\n\n\ndef require(condition, code=errno.EINVAL, message=\"invalid request\"):\n    if not condition:\n        raise Error(code, message)\n\n\ndef metadata(node):\n    return META.pack(node[\"id\"], node[\"size\"], node[\"mtime_ns\"], node[\"mode\"],\n                     node.get(\"flags\", 0) | (0 if node[\"writable\"] else READONLY)\n                     | (BRANCH if node[\"kind\"] == \"branch\" else 0), node[\"revision\"])\n", "goi/github.py": "\"\"\"GitHub HTTPS adapter. No Git executable or third-party packages required.\"\"\"\n\nimport base64\nimport errno\nimport hashlib\nimport json\nimport socket\nfrom urllib.error import HTTPError, URLError\nfrom urllib.parse import quote, urlencode\nfrom urllib.request import Request, urlopen\n\nfrom .protocol import Error\n\n\ndef blob_sha(data):\n    return hashlib.sha1(b\"blob \" + str(len(data)).encode() + b\"\\0\" + data).hexdigest()\n\n\nclass GitHub:\n    def __init__(self, token=\"\", api=\"https://api.github.com\",\n                 oauth=\"https://github.com\", timeout=20):\n        self.token, self.api, self.oauth, self.timeout = token, api.rstrip(\"/\"), oauth.rstrip(\"/\"), timeout\n\n    def request(self, method, path, data=None, *, oauth=False):\n        headers = {\"Accept\": \"application/json\", \"User-Agent\": \"goi-vtfs/1\"}\n        if self.token and not oauth:\n            headers[\"Authorization\"] = \"Bearer \" + self.token\n        if data is not None:\n            if oauth:\n                payload = urlencode(data).encode()\n                headers[\"Content-Type\"] = \"application/x-www-form-urlencoded\"\n            else:\n                payload = json.dumps(data).encode()\n                headers[\"Content-Type\"] = \"application/json\"\n        else:\n            payload = None\n        url = (self.oauth if oauth else self.api) + path\n        try:\n            with urlopen(Request(url, payload, headers, method=method), timeout=self.timeout) as response:\n                raw = response.read()\n                return json.loads(raw) if raw else {}\n        except HTTPError as exc:\n            codes = {401: errno.EACCES, 403: errno.EACCES, 404: errno.ENOENT,\n                     409: errno.EAGAIN, 422: errno.EINVAL, 429: errno.EAGAIN}\n            # Never include response headers or access tokens in errors/logs.\n            try:\n                detail = json.loads(exc.read(8192)).get(\"message\", \"request rejected\")\n            except (ValueError, AttributeError):\n                detail = \"request rejected\"\n            finally:\n                exc.close()\n            raise Error(codes.get(exc.code, errno.EIO), f\"GitHub HTTP {exc.code} ({method} {path}): {detail}\") from None\n        except (URLError, TimeoutError, socket.timeout, OSError):\n            raise Error(errno.EHOSTUNREACH, \"GitHub is unreachable; saved changes are retained\") from None\n        except (ValueError, KeyError):\n            raise Error(errno.EPROTO, \"invalid GitHub response\") from None\n\n    def pages(self, path):\n        result = []\n        for page in range(1, 10001):\n            separator = \"&\" if \"?\" in path else \"?\"\n            batch = self.request(\"GET\", f\"{path}{separator}per_page=100&page={page}\")\n            if not isinstance(batch, list):\n                raise Error(errno.EPROTO, \"expected a GitHub list\")\n            result.extend(batch)\n            if len(batch) < 100:\n                return result\n        raise Error(errno.EOVERFLOW, \"GitHub pagination limit exceeded\")\n\n    @staticmethod\n    def repo_path(owner, repo):\n        return \"/repos/\" + quote(owner, safe=\"\") + \"/\" + quote(repo, safe=\"\")\n\n    def profile(self):\n        return self.request(\"GET\", \"/user\")\n\n    def repositories(self, owner, personal=False):\n        if personal:\n            return self.pages(\"/user/repos?affiliation=owner&visibility=all\")\n        return self.pages(\"/orgs/\" + quote(owner, safe=\"\") + \"/repos?type=all\")\n\n    def organizations(self):\n        return self.pages(\"/user/orgs\")\n\n    def repository(self, owner, repo):\n        return self.request(\"GET\", self.repo_path(owner, repo))\n\n    def branches(self, owner, repo):\n        return self.pages(self.repo_path(owner, repo) + \"/branches\")\n\n    def head(self, owner, repo, branch):\n        return self.request(\"GET\", self.repo_path(owner, repo) + \"/git/ref/heads/\" + quote(branch, safe=\"\"))[\"object\"][\"sha\"]\n\n    def commit(self, owner, repo, sha):\n        return self.request(\"GET\", self.repo_path(owner, repo) + \"/git/commits/\" + sha)\n\n    def tree(self, owner, repo, sha):\n        # GitHub can return 404 for the canonical empty Git tree.\n        if sha == hashlib.sha1(b\"tree 0\\0\").hexdigest():\n            return []\n        result = self.request(\"GET\", self.repo_path(owner, repo) + \"/git/trees/\" + sha)\n        if result.get(\"truncated\"):\n            raise Error(errno.EOVERFLOW, \"GitHub directory response was truncated\")\n        return result[\"tree\"]\n\n    def full_tree(self, owner, repo, sha):\n        # Traverse non-recursively returned trees: no silently truncated recursive response.\n        result, pending = {}, [(\"\", sha)]\n        while pending:\n            prefix, tree = pending.pop()\n            for entry in self.tree(owner, repo, tree):\n                path = prefix + entry[\"path\"]\n                if entry[\"type\"] == \"tree\":\n                    pending.append((path + \"/\", entry[\"sha\"]))\n                else:\n                    result[path] = entry\n        return result\n\n    def blob(self, owner, repo, sha):\n        item = self.request(\"GET\", self.repo_path(owner, repo) + \"/git/blobs/\" + sha)\n        if item.get(\"encoding\") != \"base64\":\n            raise Error(errno.EPROTO, \"unsupported blob encoding\")\n        data = base64.b64decode(item[\"content\"])\n        if blob_sha(data) != sha:\n            raise Error(errno.EIO, \"GitHub blob checksum mismatch\")\n        return data\n\n    def create_blob(self, owner, repo, data):\n        return self.request(\"POST\", self.repo_path(owner, repo) + \"/git/blobs\",\n                            {\"content\": base64.b64encode(data).decode(), \"encoding\": \"base64\"})[\"sha\"]\n\n    def create_tree(self, owner, repo, base, entries):\n        return self.request(\"POST\", self.repo_path(owner, repo) + \"/git/trees\",\n                            {\"base_tree\": base, \"tree\": entries})[\"sha\"]\n\n    def create_commit(self, owner, repo, parent, tree, message, author):\n        return self.request(\"POST\", self.repo_path(owner, repo) + \"/git/commits\",\n                            {\"parents\": [parent], \"tree\": tree, \"message\": message,\n                             \"author\": author, \"committer\": author})[\"sha\"]\n\n    def update_head(self, owner, repo, branch, sha):\n        self.request(\"PATCH\", self.repo_path(owner, repo) + \"/git/refs/heads/\" + quote(branch, safe=\"\"),\n                     {\"sha\": sha, \"force\": False})\n\n    def delete_file(self, owner, repo, branch, path, sha, message, author):\n        result = self.request(\"DELETE\", self.repo_path(owner, repo) + \"/contents/\" + quote(path, safe=\"/\"),\n                              {\"branch\": branch, \"sha\": sha, \"message\": message,\n                               \"author\": author, \"committer\": author})\n        return result[\"commit\"][\"sha\"]\n\n    def device_start(self, client_id):\n        return self.request(\"POST\", \"/login/device/code\",\n                            {\"client_id\": client_id, \"scope\": \"repo read:org read:user\"}, oauth=True)\n\n    def device_poll(self, client_id, device_code):\n        return self.request(\"POST\", \"/login/oauth/access_token\",\n                            {\"client_id\": client_id, \"device_code\": device_code,\n                             \"grant_type\": \"urn:ietf:params:oauth:grant-type:device_code\"}, oauth=True)\n", "goi/publish.py": "\"\"\"GitHub commands. Filesystem operations and SQLite rows live in storage.py.\"\"\"\n\nfrom datetime import datetime, timezone\nimport difflib\nimport errno\nimport stat\n\nfrom .github import blob_sha\nfrom .merge import merge\nfrom . import recovery, ignore\nfrom .protocol import Error, MAX_FILE_SIZE, require\n\n\ndef status(store, branch, show_ignored=False):\n    patterns = ignore.rules(store, branch)\n    conflicts = {row[0] for row in store.db.execute(\"SELECT node FROM conflicts WHERE branch=?\", (branch,))}\n    result = []\n    for node in store.dirty_nodes(branch):\n        is_ignored = ignore.ignored(store, node, patterns)\n        if is_ignored and not show_ignored:\n            continue\n        path = store.path(node)\n        state = \"conflict\" if node[\"id\"] in conflicts else (\n            \"deleted\" if node[\"deleted\"] else \"added\" if not node[\"base_path\"] else\n            \"renamed\" if path != node[\"base_path\"] else \"modified\")\n        result.append({\"id\": node[\"id\"], \"path\": path + (\"/\" if node[\"kind\"] == \"dir\" else \"\"), \"old_path\": node[\"base_path\"], \"state\": \"ignored\" if is_ignored else state})\n    return result\n\n\ndef diff(store, branch):\n    result = []\n    repo = store.repo(store.branch(branch)[\"repo\"])\n    api = store.github(repo[\"account\"])\n    for item in status(store, branch):\n        node = store.node(item[\"id\"], deleted=True)\n        if node[\"kind\"] == \"dir\":\n            continue\n        before = api.blob(repo[\"owner\"], repo[\"name\"], node[\"remote_sha\"]) if node[\"remote_sha\"] else b\"\"\n        after = b\"\" if node[\"deleted\"] else store.read(node[\"id\"], 0, MAX_FILE_SIZE)\n        try:\n            if b\"\\0\" in before + after:\n                raise UnicodeError()\n            result.extend(difflib.unified_diff(before.decode().splitlines(True), after.decode().splitlines(True),\n                                              fromfile=\"a/\" + (node[\"base_path\"] or item[\"path\"]),\n                                              tofile=\"b/\" + item[\"path\"]))\n        except UnicodeError:\n            result.append(f\"Binary file changed: {item['path']}\\n\")\n    return \"\".join(result)\n\n\ndef make_conflict(store, node, theirs, remote_sha, remote_head, remote_mode):\n    ours = store.read(node[\"id\"], 0, MAX_FILE_SIZE) if not node[\"deleted\"] else b\"\"\n    try:\n        ours.decode(\"utf-8\")\n        theirs.decode(\"utf-8\")\n        text = b\"\\0\" not in ours + theirs and not node[\"deleted\"] and remote_sha is not None\n    except UnicodeError:\n        text = False\n    if text:\n        content = (b\"<<<<<<< local\\n\" + ours + (b\"\" if ours.endswith(b\"\\n\") else b\"\\n\") +\n                   b\"=======\\n\" + theirs + (b\"\" if theirs.endswith(b\"\\n\") else b\"\\n\") + b\">>>>>>> remote\\n\")\n    else:\n        content = b\"Choose a version with goi resolve --ours or --theirs.\\n\"\n    mirror = store.mirror(node, content)\n    store.db.execute(\"INSERT OR REPLACE INTO conflicts VALUES (?,?,?,?,?,?,?,?)\",\n                     (node[\"id\"], node[\"branch\"], store.path(node), theirs, remote_sha, remote_head,\n                      mirror[\"id\"], remote_mode))\n\n\ndef resolve(store, number, choice=None):\n    node = store.node(number, deleted=True)\n    row = store.db.execute(\"SELECT * FROM conflicts WHERE node=?\", (number,)).fetchone()\n    require(row is not None, errno.ENOENT, \"file has no unresolved conflict\")\n    if choice == \"ours\":\n        data = node[\"data\"] or b\"\"\n    elif choice == \"theirs\":\n        data = row[\"theirs\"]\n    else:\n        data = store.node(row[\"mirror\"])[\"data\"] or b\"\"\n        require(not any(marker in data for marker in (b\"<<<<<<<\", b\"=======\", b\">>>>>>>\")),\n                errno.EAGAIN, \"remove conflict markers before confirming resolution\")\n        require(row[\"remote_sha\"] is not None and not node[\"deleted\"], errno.EINVAL,\n                \"deletion conflicts need --ours or --theirs\")\n    deleted = node[\"deleted\"] if choice != \"theirs\" else int(row[\"remote_sha\"] is None)\n    mode = (stat.S_IFREG | (0o755 if row[\"remote_mode\"] == \"100755\" else 0o644)) if choice == \"theirs\" else node[\"mode\"]\n    store.update(number, data=data, size=len(data), deleted=deleted, dirty=1, mode=mode,\n                 remote_sha=row[\"remote_sha\"], base_mode=row[\"remote_mode\"], revision=node[\"revision\"] + 1)\n    store.db.execute(\"DELETE FROM conflicts WHERE node=?\", (number,))\n    store.update(row[\"mirror\"], writable=0, mode=stat.S_IFREG | 0o444)\n\n\ndef selected(store, branch, paths, force=False):\n    patterns = ignore.rules(store, branch)\n    nodes = [n for n in store.dirty_nodes(branch) if force or not ignore.ignored(store, n, patterns)]\n    if paths:\n        def matches(node, prefix):\n            return any(path is not None and (prefix in (\"\", \".\") or path == prefix or path.startswith(prefix + \"/\"))\n                       for path in (store.path(node), node[\"base_path\"]))\n        nodes = [node for node in nodes if any(matches(node, prefix) for prefix in paths)]\n        require(all(any(matches(node, prefix) for node in nodes) for prefix in paths), errno.ENOENT,\n                \"selected path has no publishable changes; ignored additions require --force\")\n    destinations = {store.path(node) for node in nodes if not node[\"deleted\"]}\n    for node in store.dirty_nodes(branch):\n        if node[\"deleted\"] and node[\"base_path\"] in destinations and node not in nodes:\n            nodes.append(node)\n    return [node for node in nodes if node[\"kind\"] == \"file\"]\n\n\ndef commit(store, branch_id, paths, message, force=False):\n    \"\"\"Read saved files, build one Git tree/commit, then fast-forward the branch.\"\"\"\n    require(isinstance(message, str) and message.strip() and len(message.encode()) <= 8192,\n            message=\"commit message must be nonempty and at most 8192 bytes\")\n    recovered = recovery.recover(store, branch_id)\n    require(not store.db.execute(\"SELECT 1 FROM conflicts WHERE branch=?\", (branch_id,)).fetchone(),\n            errno.EAGAIN, \"resolve pending conflicts first\")\n    require(store.node(branch_id)[\"writable\"], errno.EACCES, \"branch is read-only\")\n    branch = store.branch(branch_id)\n    repo = store.repo(branch[\"repo\"])\n    api = store.github(repo[\"account\"])\n    latest_repo = api.repository(repo[\"owner\"], repo[\"name\"])\n    require(latest_repo.get(\"permissions\", {}).get(\"push\") and not latest_repo.get(\"archived\", False),\n            errno.EACCES, \"GitHub does not grant write access\")\n    nodes = selected(store, branch_id, paths, force)\n    if not nodes:\n        return {\"sha\": recovered.get(\"sha\"), \"message\": \"No changes\"}\n    head = api.head(repo[\"owner\"], repo[\"name\"], branch[\"name\"])\n    current_commit = api.commit(repo[\"owner\"], repo[\"name\"], head)\n    current = api.full_tree(repo[\"owner\"], repo[\"name\"], current_commit[\"tree\"][\"sha\"])\n    conflicts = []\n    for node in nodes:\n        path = store.path(node)\n        old = node[\"base_path\"] or path\n        remote = current.get(old, {})\n        ours = b\"\" if node[\"deleted\"] else store.read(node[\"id\"], 0, MAX_FILE_SIZE)\n        same = (not node[\"deleted\"] and remote.get(\"sha\") == blob_sha(ours)) or (node[\"deleted\"] and not remote)\n        collision = path != old and path in current and not any(n[\"deleted\"] and n[\"base_path\"] == path for n in nodes)\n        mode = \"100755\" if node[\"mode\"] & 0o111 else \"100644\"\n        mode_conflict = not node[\"deleted\"] and remote.get(\"mode\") not in (None, node[\"base_mode\"], mode)\n        if (remote.get(\"sha\") != node[\"remote_sha\"] and not same) or collision or mode_conflict:\n            theirs = current.get(path if collision else old, {})\n            data = api.blob(repo[\"owner\"], repo[\"name\"], theirs[\"sha\"]) if theirs else b\"\"\n            if not collision and not mode_conflict and not node[\"deleted\"] and node[\"remote_sha\"] and theirs:\n                base = api.blob(repo[\"owner\"], repo[\"name\"], node[\"remote_sha\"])\n                merged = merge(base, ours, data)\n                if merged is not None:\n                    updated = store.update(node[\"id\"], data=merged, size=len(merged),\n                                           remote_sha=theirs[\"sha\"], base_mode=theirs[\"mode\"],\n                                           revision=node[\"revision\"] + 1)\n                    node.update(updated)\n                    continue\n            make_conflict(store, node, data, theirs.get(\"sha\"), head, theirs.get(\"mode\"))\n            conflicts.append(path)\n    if conflicts:\n        store.db.commit()  # Keep the conflict copies even though commit reports EAGAIN.\n        raise Error(errno.EAGAIN, \"conflicts: \" + \", \".join(conflicts))\n\n    entries, saved = {}, []\n    for node in sorted(nodes, key=lambda item: not item[\"deleted\"]):\n        path = store.path(node)\n        mode = \"100755\" if node[\"mode\"] & 0o111 else \"100644\"\n        sha = None\n        if node[\"base_path\"] and (node[\"deleted\"] or path != node[\"base_path\"]) and node[\"base_path\"] in current:\n            entries[node[\"base_path\"]] = {\"path\": node[\"base_path\"], \"mode\": mode, \"type\": \"blob\", \"sha\": None}\n        if not node[\"deleted\"]:\n            data = store.read(node[\"id\"], 0, MAX_FILE_SIZE)\n            sha = blob_sha(data)\n            if current.get(path, {}).get(\"sha\") != sha or current.get(path, {}).get(\"mode\") != mode:\n                require(api.create_blob(repo[\"owner\"], repo[\"name\"], data) == sha, errno.EIO, \"unexpected blob id\")\n                entries[path] = {\"path\": path, \"mode\": mode, \"type\": \"blob\", \"sha\": sha}\n        saved.append((node, path, sha, mode))\n    if entries:\n        profile = api.profile()\n        author = {\"name\": profile.get(\"name\") or profile[\"login\"],\n                  \"email\": profile.get(\"email\") or f\"{profile['id']}+{profile['login']}@users.noreply.github.com\",\n                  \"da          child = store.new_node(parent[\"id\"], part, \"dir\", stat.S_IFDIR | 0o755,\n                                       branch=branch_id, repo=branch[\"repo\"], account=branch[\"account\"],\n                                       loaded=1, writable=branch[\"writable\"])\n            require(child[\"kind\"] == \"dir\", errno.EEXIST, \"restore parent is occupied by a file\")\n            parent = child\n        other = store.child(parent[\"id\"], parts[-1])\n        require(other is None or other[\"id\"] in selected, errno.EEXIST,\n                \"restore destination has other local data\")\n        values = dict(parent=parent[\"id\"], name=parts[-1], deleted=0, dirty=0)\n        if node[\"kind\"] == \"file\":\n            data = content.get(node[\"id\"], b\"\")\n            values.update(data=data, size=len(data), loaded=1,\n                          mode=stat.S_IFREG | (0o755 if node[\"base_mode\"] == \"100755\" else 0o644))\n        else:\n            values.update(mode=stat.S_IFDIR | 0o755, loaded=1)\n        store.update(node[\"id\"], **values)\n    for node in nodes:\n        store.db.execute(\"DELETE FROM conflicts WHERE node=?\", (node[\"id\"],))\n        store.db.execute(\"UPDATE nodes SET deleted=1 WHERE source_id=?\", (node[\"id\"],))\n    return {\"restored\": len(nodes)}\n\n\ndef refresh(store, branch_id):\n    \"\"\"Update remote metadata while preserving local edits and object identities.\"\"\"\n    from .github import blob_sha\n    from .merge import merge\n    from .publish import make_conflict\n\n    require(not store.db.execute(\"SELECT 1 FROM conflicts WHERE branch=?\", (branch_id,)).fetchone(),\n            errno.EBUSY, \"resolve pending conflicts before refreshing\")\n    branch = store.node(branch_id)\n    repo = store.repo(branch[\"repo\"])\n    api = store.github(repo[\"account\"])\n    head = api.head(repo[\"owner\"], repo[\"name\"], store.branch(branch_id)[\"name\"])\n    tree = api.commit(repo[\"owner\"], repo[\"name\"], head)[\"tree en(node[\"id\"]):\n            store.update(node[\"id\"], deleted=1)\n    store.update(branch_id, tree_sha=tree, loaded=1)\n    store.db.execute(\"UPDATE branches SET head=?,tree_sha=? WHERE id=?\", (head, tree, branch_id))\n    return {\"head\": head, \"conflicts\": conflicts, \"preserved_directories\": sorted(set(protected))}\n", "goi/merge.py": "\"\"\"Conservative line-based three-way merge, without external executables.\"\"\"\n\nimport difflib\n\n\ndef merge(base, ours, theirs):\n    \"\"\"Return merged bytes, or None when edits overlap or content is binary.\"\"\"\n    if ours == theirs or theirs == base:\n        return ours\n    if ours == base:\n        return theirs\n    try:\n        if b\"\\0\" in base + ours + theirs:\n            return None\n        original, local, remote = [data.decode(\"utf-8\").splitlines(True)\n                                   for data in (base, ours, theirs)]\n    except UnicodeError:\n        return None\n\n    def edits(lines):\n        return [(a, b, lines[c:d]) for tag, a, b, c, d in\n                difflib.SequenceMatcher(None, original, lines, autojunk=False).get_opcodes()\n                if tag != \"equal\"]\n\n    left, right = edits(local), edits(remote)\n    combined = list(left)\n    for change in right:\n        if change in left:\n            continue\n        a, b, _ = change\n        for c, d, _ in left:\n            # Insertions at an edited boundary are deliberately conflicts:\n            # there is no unambiguous ordering for the new lines.\n            if (max(a, c) < min(b, d) or\n                    a == b and c <= a <= d or c == d and a <= c <= b):\n                return None\n        combined.append(change)\n    result = list(original)\n    for a, b, replacement in sorted(combined, key=lambda item: (item[0], item[1]), reverse=True):\n        result[a:b] = replacement\n    return \"\".join(result).encode(\"utf-8\")\n", "goi/recovery.py": "\"\"\"Durable intent before publishing a Git ref; retries preserve subsequent edits.\"\"\"\n\nimport errno\nimport json\n\nfrom .github import blob_sha\nfrom .protocol import require\n\n\ndef prepare(store, branch, base, target, saved):\n    payload = [{\"id\": node[\"id\"], \"path\": path, \"sha\": sha, \"mode\": mode,\n                \"revision\": node[\"revision\"], \"deleted\": bool(node[\"deleted\"])}\n               for node, path, sha, mode in saved]\n    store.db.execute(\"INSERT INTO publications VALUES (?,?,?,?,?)\",\n                     (branch, base, target, json.dumps(payload), \"pending\"))\n    store.db.commit()\n\n\ndef finish(store, branch, head, payload):\n    for item in payload:\n        node = store.node(item[\"id\"], deleted=True)\n        unchanged = (store.path(node) == item[\"path\"] and bool(node[\"deleted\"]) == item[\"deleted\"]\n                     and (node[\"deleted\"] or node[\"data\"] is not None and blob_sha(node[\"data\"]) == item[\"sha\"]\n                          and (\"100755\" if node[\"mode\"] & 0o111 else \"100644\") == item[\"mode\"]))\n        store.update(node[\"id\"], base_path=item[\"path\"], remote_sha=item[\"sha\"],\n                     base_mode=item[\"mode\"], dirty=int(not unchanged))\n        if unchanged:\n            store.db.execute(\"UPDATE nodes SET deleted=1 WHERE source_id=?\", (node[\"id\"],))\n    store.db.execute(\"UPDATE branches SET head=? WHERE id=?\", (head, branch))\n    store.db.execute(\"DELETE FROM publications WHERE branch=?\", (branch,))\n    store.db.commit()\n\n\ndef recover(store, branch_id):\n    row = store.db.execute(\"SELECT * FROM publications WHERE branch=?\", (branch_id,)).fetchone()\n    if row is None:\n        return {\"recovered\": False}\n    branch = store.branch(branch_id)\n    repo = store.repo(branch[\"repo\"])\n    api = store.github(repo[\"account\"])\n    current = api.head(repo[\"owner\"], repo[\"name\"], branch[\"name\"])\n    payload = json.loads(row[\"payload\"])\n    target = row[\"target\"]\n    if target is None:\n        # Contents DELETE creates its own commit. Only acknowledge a deletion\n        # when the resulting tree is empty; never replay an uncertain DELETE.\n        tree = api.commit(repo[\"owner\"], repo[\"name\"], current)[\"tree\"][\"sha\"]\n        require(current != row[\"base\"] and not api.full_tree(repo[\"owner\"], repo[\"name\"], tree),\n                errno.EAGAIN, \"uncertain deletion; inspect GitHub before goi recover --forget\")\n    else:\n        if current == row[\"base\"]:\n            permissions = api.repository(repo[\"owner\"], repo[\"name\"])\n            require(permissions.get(\"permissions\", {}).get(\"push\") and not permissions.get(\"archived\"),\n                    errno.EACCES, \"GitHub does not grant write access\")\n            api.update_head(repo[\"owner\"], repo[\"name\"], branch[\"name\"], target)\n            current = target\n        cursor = current\n        for _ in range(128):\n            if cursor == target:\n                break\n            if cursor == row[\"base\"]:\n                # A competing fast-forward won before our ref update. Retain\n                # every local edit and let the next commit rebuild on that head.\n                store.db.execute(\"DELETE FROM publications WHERE branch=?\", (branch_id,))\n                store.db.commit()\n                return {\"recovered\": False}\n            parents = api.commit(repo[\"owner\"], repo[\"name\"], cursor).get(\"parents\", [])\n            if not parents:\n                break\n            parent = parents[0]\n            cursor = parent[\"sha\"] if isinstance(parent, dict) else parent\n        require(cursor == target, errno.EAGAIN,\n                \"remote branch diverged from pending publication; inspect GitHub before goi recover --forget\")\n    finish(store, branch_id, current, payload)\n    return {\"recovered\": True, \"sha\": current}\n", "goi/journal.py": "\"\"\"Client-side durable write journal. No GitHub tokens or filesystem logic here.\"\"\"\nimport argparse\nimport errno\nimport fcntl\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport sqlite3\nimport subprocess\nimport sys\nimport threading\nimport time\nfrom urllib.request import Request, urlopen\n\nfrom .protocol import Error, STATUS, META, MAX_FILE_SIZE, require\nfrom .server import Handler, Server\n\nLIMIT = 512 * 1024 * 1024\n\n\nclass Journal:\n    def __init__(self, directory, server, token):\n        self.directory = Path(directory)\n        self.directory.mkdir(mode=0o700, parents=True, exist_ok=True)\n        os.chmod(self.directory, 0o700)\n        self.server, self.token = server.rstrip('/'), token\n        self.identity = hashlib.sha256((self.server + '\\n' + token).encode()).hexdigest()\n        self.db = sqlite3.connect(self.directory / 'journal.sqlite3', check_same_thread=False)\n        os.chmod(self.directory / 'journal.sqlite3', 0o600)\n        self.db.row_factory = sqlite3.Row\n        self.db.execute('PRAGMA journal_mode=WAL')\n        self.db.execute('PRAGMA synchronous=FULL')\n        self.db.executescript('CREATE TABLE IF NOT EXISTS identity (value TEXT); '\n                             'CREATE TABLE IF NOT EXISTS writes (id INTEGER PRIMARY KEY, revision INTEGER, '\n                             'mode INTEGER, data BLOB NOT NULL);')\n        existing = self.db.execute('SELECT value FROM identity').fetchone()\n        if existing is not None and existing[0] != self.identity:\n            self.db.close()\n            raise Error(errno.EXDEV, 'journal belongs to another server/token; export pending data before changing configuration')\n        if existing is None:\n            self.db.execute('INSERT INTO identity VALUES (?)', (self.identity,))\n        self.db.commit()\n        self.lock = threading.RLock()\n\n    def trim_cache(self):\n        pass\n\n    def close(self):\n        self.db.close()\n\n    def record(self, number, revision, mode, data):\n        size = self.db.execute('SELECT COALESCE(SUM(length(data)),0) FROM writes WHERE id!=?', (number,)).fetchone()[0]\n        require(size + len(data) <= LIMIT, errno.ENOSPC, 'client journal is full; sync pending files')\n        # Keep the first remote baseline while successive local writes replace the snapshot.\n        self.db.execute('INSERT INTO writes VALUES (?,?,?,?) ON CONFLICT(id) DO UPDATE '\n                        'SET mode=excluded.mode,data=excluded.data', (number, revision, mode, data))\n\n    def recover(self):\n        restored = 0\n        for row in list(self.db.execute('SELECT * FROM writes ORDER BY id')):\n            query = f\"id={row['id']}&mode={row['mode']}&expected_revision={row['revision']}\"\n            request = Request(self.server + '/api/write?' + query, row['data'],\n                              {'Authorization': 'Bearer ' + self.token}, method='POST')\n            with urlopen(request, timeout=120) as response:\n                data = response.read(STATUS.size + META.size + 4096)\n            require(len(data) >= STATUS.size, errno.EPROTO, 'short replay response')\n            code = STATUS.unpack_from(data)[0]\n            require(code == 0, -code if code < 0 else errno.EPROTO,\n                    f\"journal file {row['id']} cannot be replayed; export it before resolving the remote change\")\n            require(len(data) == STATUS.size + META.size, errno.EPROTO, 'short replay metadata')\n            self.db.execute('DELETE FROM writes WHERE id=?', (row['id'],))\n            self.db.commit()  # Lost replies are safe: server compares both revision and bytes.\n            restored += 1\n        return {'restored': restored}\n\n\nclass JournalHandler(Handler):\n    def api(self, method, args, body):\n        require(self.command == 'POST', message='journal changes require POST')\n        number = int(args['id'])\n        require(number > 0, message='invalid inode')\n        if method == 'record':\n            revision, mode = int(args['revision']), int(args['mode'])\n            require(revision >= 0 and 0 <= mode <= 0o777 and len(body) <= MAX_FILE_SIZE)\n            self.server.store.record(number, revision, mode, body)\n        elif method == 'ack':\n            self.server.store.db.execute('DELETE FROM writes WHERE id=?', (number,))\n        else:\n            raise Error(errno.ENOSYS, 'unknown journal operation')\n        return b''\n\n    def control(self, request):\n        store = self.server.store\n        operation = request['operation']\n        if operation == 'info':\n            return {'identity': store.identity, 'files': [\n                {'id': row['id'], 'revision': row['revision'], 'bytes': row['bytes']}\n                for row in store.db.execute('SELECT id,revision,length(data) AS bytes FROM writes ORDER BY id')]}\n        if operation == 'discard':\n            store.db.execute('DELETE FROM writes WHERE id=?', (int(request['id']),))\n            return {'discarded': int(request['id'])}\n        if operation == 'replay':\n            return store.recover()\n        if operation == 'export':\n            # The CLI chooses a local destination; the daemon never writes arbitrary paths.\n            import base64\n            row = store.db.execute('SELECT data FROM writes WHERE id=?', (int(request['id']),)).fetchone()\n            require(row is not None, errno.ENOENT, 'journal entry not found')\n            return {'data': base64.b64encode(row['data']).decode()}\n        raise Error(errno.ENOSYS, 'unknown journal operation')\n\n\ndef ensure(client):\n    from .cli import Client, configuration_path\n    key = hashlib.sha256(str(client.mountpoint).encode()).hexdigest()[:24]\n    directory = configuration_path().parent / 'journals' / key\n    directory.mkdir(mode=0o700, parents=True, exist_ok=True)\n    identity = hashlib.sha256((client.server.rstrip('/') + '\\n' + client.token).encode()).hexdigest()\n    token_path = directory / 'token'\n    # Refuse a changed backend before replacing the token of a running journal.\n    dbpath = directory / 'journal.sqlite3'\n    if dbpath.exists():\n        db = sqlite3.connect(dbpath)\n        try:\n            row = db.execute('SELECT value FROM identity').fetchone()\n            require(row is None or row[0] == identity, errno.EXDEV,\n                    'journal backend changed; retain the old configuration and export/recover its data first')\n        finally:\n            db.close()\n    fd = os.open(token_path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)\n    with os.fdopen(fd, 'w') as file:\n        file.write(client.token)\n        file.flush()\n        os.fsync(file.fileno())\n    def connect():\n        try:\n            port = int((directory / 'port').read_text())\n            local = Client(client.mountpoint, {'server': f'http://127.0.0.1:{port}', 'token_file': str(token_path)})\n            require(local.call('info')['identity'] == identity, errno.EXDEV, 'journal identity mismatch')\n            return local, port\n        except (OSError, ValueError, Error):\n            return None\n    running = connect()\n    if running:\n        return running\n    env = dict(os.environ, PYTHONPATH=str(Path(__file__).resolve().parents[1]))\n    with (directory / 'daemon.log').open('ab') as log:\n        subprocess.Popen([sys.executable, '-m', 'goi.journal', '--data', str(directory),\n                          '--server', client.server, '--token-file', str(token_path)],\n                         stdin=subprocess.DEVNULL, stdout=log, stderr=log,\n                         start_new_session=True, env=env)\n    for _ in range(50):\n        time.sleep(.1)\n        running = connect()\n        if running:\n            return running\n    raise Error(errno.EIO, f'client journal failed to start; inspect {directory / \"daemon.log\"}')\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument('--data', required=True)\n    parser.add_argument('--server', required=True)\n    parser.add_argument('--token-file', required=True)\n    args = parser.parse_args()\n    directory = Path(args.data)\n    directory.mkdir(mode=0o700, parents=True, exist_ok=True)\n    with (directory / 'daemon.lock').open('a') as lock:\n        fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)\n        store = Journal(directory, args.server, Path(args.token_file).read_text().strip())\n        port_path = directory / 'port'\n        port = int(port_path.read_text()) if port_path.exists() else 0\n        server = Server(('127.0.0.1', port), store, store.token)\n        server.RequestHandlerClass = JournalHandler\n        temporary = directory / 'port.tmp'\n        temporary.write_text(str(server.server_port))\n        temporary.replace(directory / 'port')\n        try:\n            server.serve_forever()\n        finally:\n            server.server_close()\n            store.close()\n\n\nif __name__ == '__main__':\n    main()\n", "goi/ignore.py": "\"\"\"Small, explicit ignore syntax; only unpublished additions may be ignored.\"\"\"\nimport fnmatch\n\n\ndef rules(store, branch):\n    result = [\"*.swp\", \"*.swx\", \"*~\", \"4913\", \"__pycache__/\", \"*.pyc\"]\n    node = store.child(branch, \".goiignore\")\n    if node and node[\"kind\"] == \"file\":\n        result += store.read(node[\"id\"], 0, 65536).decode(\"utf-8\").splitlines()\n    return result\n\n\ndef ignored(store, node, patterns):\n    if node[\"base_path\"] or node[\"remote_sha\"] or node[\"name\"] == \".goiignore\":\n        return False\n    path = store.path(node)\n    parts = path.split(\"/\")\n    matched = False\n    for line in patterns:\n        pattern = line.strip()\n        if not pattern or pattern.startswith(\"#\"):\n            continue\n        negate = pattern.startswith(\"!\")\n        pattern = pattern[1:] if negate else pattern\n        directory = pattern.endswith(\"/\")\n        anchored = pattern.startswith(\"/\") or \"/\" in pattern.rstrip(\"/\")\n        pattern = pattern.strip(\"/\")\n        if not pattern:\n            continue\n        for end in range(1, len(parts) + 1):\n            if directory and end == len(parts) and node[\"kind\"] != \"dir\":\n                continue\n            candidate = \"/\".join(parts[:end]) if anchored else parts[end - 1]\n            # Slash-separated patterns match components; * does not cross /.\n            left, right = candidate.split(\"/\"), pattern.split(\"/\")\n            if len(left) == len(right) and all(fnmatch.fnmatchcase(a, b) for a, b in zip(left, right)):\n                matched = not negate\n                break\n    return matched\n", "goi/service.py": "\"\"\"Manage the optional per-user systemd service for the default local backend.\"\"\"\nimport errno\nimport os\nfrom pathlib import Path\nimport socket\nimport subprocess\nimport sys\nimport time\nfrom urllib.request import Request, urlopen\n\nfrom .protocol import Error, META, STATUS, require\n\nURL = \"http://127.0.0.1:8080\"\n\n\ndef data_directory():\n    # Keep the same default as goi-server and existing mount configurations.\n    return Path.home() / \".local/share/goi\"\n\n\ndef unit_path():\n    return Path(os.environ.get(\"XDG_CONFIG_HOME\", Path.home() / \".config\")) / \"systemd/user/goi.service\"\n\n\ndef systemctl(*args):\n    try:\n        result = subprocess.run([\"systemctl\", \"--user\", *args], capture_output=True, text=True)\n    except FileNotFoundError:\n        raise Error(errno.ENOSYS, \"systemd is unavailable; start goi-server manually and pass --server URL\") from None\n    require(result.returncode == 0, errno.EIO,\n            \"user systemd operation failed; check systemctl --user status goi and journalctl --user -u goi. \"\n            \"Without a user systemd session, start goi-server manually and pass --server URL\")\n    return result.stdout\n\n\ndef argument(value):\n    value = str(value)\n    require(not any(c in value for c in \"\\n\\r\\0\"), message=\"invalid systemd argument\")\n    # ExecStart is not a shell; protect systemd specifiers and variable expansion too.\n    return '\"' + value.replace('\\\\', '\\\\\\\\').replace('\"', '\\\\\"').replace('%', '%%').replace('$', '$$') + '\"'\n\n\ndef install(client_id=None):\n    path = unit_path()\n    if path.exists() and client_id is None:\n        systemctl(\"daemon-reload\")\n        systemctl(\"enable\", \"goi.service\")\n        return path  # Preserve the existing OAuth App and user edits.\n    client_id = client_id if client_id is not None else os.environ.get(\"GOI_GITHUB_CLIENT_ID\", \"\")\n    executable = Path(__file__).resolve().parents[1] / \"bin/goi-server\"\n    command = [sys.executable, executable, \"--data\", data_directory(), \"--listen\", \"127.0.0.1\",\n               \"--port\", \"8080\", \"--client-id\", client_id]\n    contents = (\"[Unit]\\nDescription=GOI local GitHub filesystem service\\n\\n[Service]\\nType=simple\\n\"\n                \"ExecStart=\" + \" \".join(map(argument, command)) + \"\\n\"\n                \"Restart=on-failure\\nRestartSec=2\\nUMask=0077\\n\\n[Install]\\nWantedBy=default.target\\n\")\n    path.parent.mkdir(parents=True, exist_ok=True)\n    temporary = path.with_suffix(\".tmp\")\n    temporary.write_text(contents)\n    temporary.chmod(0o600)\n    temporary.replace(path)\n    systemctl(\"daemon-reload\")\n    systemctl(\"enable\", \"goi.service\")\n    return path\n\n\ndef ready():\n    try:\n        token = (data_directory() / \"server-token\").read_text().strip()\n        request = Request(URL + \"/api/hello\", headers={\"Authorization\": \"Bearer \" + token})\n        with urlopen(request, timeout=1) as response:\n            data = response.read(STATUS.size + META.size + 1)\n        return len(data) == STATUS.size + META.size and STATUS.unpack_from(data)[0] == 0\n    except (OSError, ValueError):\n        return False\n\n\ndef ensure():\n    if ready():\n        return  # A manually started compatible server is also usable.\n    try:\n        with socket.create_connection((\"127.0.0.1\", 8080), timeout=1):\n            occupied = True\n    except OSError:\n        occupied = False\n    require(not occupied, errno.EADDRINUSE,\n            \"port 8080 is occupied but GOI authentication failed; check the server/token before mounting\")\n    if not unit_path().exists():\n        install()\n    systemctl(\"start\", \"goi.service\")\n    deadline = time.monotonic() + 15\n    while time.monotonic() < deadline:\n        if ready():\n            return\n        time.sleep(.2)\n    raise Error(errno.ETIMEDOUT, \"GOI service did not become ready; inspect journalctl --user -u goi\")\n"}</script>

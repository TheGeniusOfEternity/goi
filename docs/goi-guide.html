<script id="source-data" type="application/json">{"Makefile": "obj-m += vtfs.o\nvtfs-y := source/vtfs.o source/http.o source/remote.o\n\nKDIR ?= /lib/modules/$(shell uname -r)/build\nccflags-y += -Wall -g\n\n.PHONY: all clean test\n\nall:\n\t$(MAKE) -C $(KDIR) M=$(CURDIR) modules\n\tcp vtfs.ko source/vtfs.ko\n\ntest:\n\tpython3 -B -m unittest discover -s test -p test_service.py -v\n\tpython3 -B -m unittest discover -s test -p test_github.py -v\n\nclean:\n\t$(MAKE) -C $(KDIR) M=$(CURDIR) clean\n\trm -rf .cache\n", "source/vtfs.c": "// SPDX-License-Identifier: GPL-2.0\n#include <linux/fs.h>\n#include <linux/fs_context.h>\n#include <linux/fs_parser.h>\n#include <linux/inet.h>\n#include <linux/init.h>\n#include <linux/limits.h>\n#include <linux/module.h>\n#include <linux/pagemap.h>\n#include <linux/printk.h>\n#include <linux/security.h>\n#include <linux/splice.h>\n#include \"http.h\"\n\n#define MODULE_NAME \"vtfs\"\n#define VTFS_MAGIC 0x676f6901\n\nMODULE_LICENSE(\"GPL\");\nMODULE_AUTHOR(\"secs-dev\");\nMODULE_DESCRIPTION(\"GOI filesystem: RAM and HTTP storage backends\");\nMODULE_ALIAS_FS(MODULE_NAME);\n\n#define LOG(fmt, ...) pr_info(\"[\" MODULE_NAME \"]: \" fmt, ##__VA_ARGS__)\n\nstatic const struct inode_operations vtfs_dir_inode_ops;\n\n/* A RAM-only backend cannot acknowledge durable storage on a GOI server. */\nstatic int vtfs_fsync(struct file *file, loff_t start, loff_t end, int datasync)\n{\n\treturn -EOPNOTSUPP;\n}\n\nstatic const struct file_operations vtfs_file_ops = {\n\t.owner = THIS_MODULE,\n\t.llseek = generic_file_llseek,\n\t.read_iter = generic_file_read_iter,\n\t.write_iter = generic_file_write_iter,\n\t.mmap_prepare = generic_file_mmap_prepare,\n\t.splice_read = filemap_splice_read,\n\t.splice_write = iter_file_splice_write,\n\t.fsync = vtfs_fsync,\n};\n\nstatic const struct inode_operations vtfs_file_inode_ops = {\n\t.getattr = simple_getattr,\n\t.setattr = simple_setattr,\n};\n\nstatic const struct file_operations vtfs_dir_ops = {\n\t.owner = THIS_MODULE,\n\t.open = dcache_dir_open,\n\t.release = dcache_dir_close,\n\t.llseek = dcache_dir_lseek,\n\t.read = generic_read_dir,\n\t.iterate_shared = dcache_readdir,\n\t.fsync = vtfs_fsync,\n};\n\nstatic const struct super_operations vtfs_super_ops = {\n\t.statfs = simple_statfs,\n\t.drop_inode = inode_just_drop,\n};\n\nstatic struct inode *vtfs_new_inode(struct mnt_idmap *idmap,\n\t\t\t\t    struct super_block *sb,\n\t\t\t\t    const struct inode *parent, umode_t mode)\n{\n\tstruct inode *inode = new_inode(sb);\n\n\tif (!inode)\n\t\treturn NULL;\n\n\tinode->i_ino = get_next_ino();\n\tinode_init_owner(idmap, inode, parent, mode);\n\tsimple_inode_init_ts(inode);\n\n\tif (S_ISDIR(mode)) {\n\t\tinode->i_op = &vtfs_dir_inode_ops;\n\t\tinode->i_fop = &vtfs_dir_ops;\n\t\tinc_nlink(inode);\n\t} else {\n\t\tinode->i_op = &vtfs_file_inode_ops;\n\t\tinode->i_fop = &vtfs_file_ops;\n\t\tinode->i_mapping->a_ops = &ram_aops;\n\t\tmapping_set_gfp_mask(inode->i_mapping, GFP_HIGHUSER);\n\t\t/* RAM is the only copy: clean pages must not be reclaimed. */\n\t\tmapping_set_unevictable(inode->i_mapping);\n\t}\n\n\treturn inode;\n}\n\nstatic int vtfs_add_inode(struct mnt_idmap *idmap, struct inode *dir,\n\t\t\t  struct dentry *dentry, umode_t mode)\n{\n\tstruct inode *inode;\n\tint ret;\n\n\tinode = vtfs_new_inode(idmap, dir->i_sb, dir, mode);\n\tif (!inode)\n\t\treturn -ENOMEM;\n\n\tret = security_inode_init_security(inode, dir, &dentry->d_name, NULL, NULL);\n\tif (ret) {\n\t\tiput(inode);\n\t\treturn ret;\n\t}\n\n\t/* Keep the directory entry alive even after its last user closes it. */\n\td_make_persistent(dentry, inode);\n\tinode_set_mtime_to_ts(dir, inode_set_ctime_current(dir));\n\treturn 0;\n}\n\nstatic int vtfs_create(struct mnt_idmap *idmap, struct inode *dir,\n\t\t       struct dentry *dentry, umode_t mode, bool excl)\n{\n\treturn vtfs_add_inode(idmap, dir, dentry, S_IFREG | mode);\n}\n\nstatic struct dentry *vtfs_mkdir(struct mnt_idmap *idmap, struct inode *dir,\n\t\t\t\t struct dentry *dentry, umode_t mode)\n{\n\tint ret = vtfs_add_inode(idmap, dir, dentry, S_IFDIR | mode);\n\n\tif (ret)\n\t\treturn ERR_PTR(ret);\n\tinc_nlink(dir);\n\treturn NULL;\n}\n\nstatic const struct inode_operations vtfs_dir_inode_ops = {\n\t.lookup = simple_lookup,\n\t.create = vtfs_create,\n\t.mkdir = vtfs_mkdir,\n\t.unlink = simple_unlink,\n\t.rmdir = simple_rmdir,\n\t.rename = simple_rename,\n\t.getattr = simple_getattr,\n\t.setattr = simple_setattr,\n};\n\nstatic int vtfs_fill_super(struct super_block *sb, struct fs_context *fc)\n{\n\tstruct inode *root;\n\n\tsb->s_magic = VTFS_MAGIC;\n\tsb->s_op = &vtfs_super_ops;\n\t/* Unpinned dentries can be destroyed; live RAM entries are persistent. */\n\tsb->s_d_flags = DCACHE_DONTCACHE;\n\tsb->s_maxbytes = MAX_LFS_FILESIZE;\n\tsb->s_blocksize = PAGE_SIZE;\n\tsb->s_blocksize_bits = PAGE_SHIFT;\n\tsb->s_time_gran = 1;\n\n\troot = vtfs_new_inode(&nop_mnt_idmap, sb, NULL, S_IFDIR | 0755);\n\tif (!root)\n\t\treturn -ENOMEM;\n\n\t/* d_make_root consumes the inode reference, including on failure. */\n\tsb->s_root = d_make_root(root);\n\tif (!sb->s_root)\n\t\treturn -ENOMEM;\n\n\treturn 0;\n}\n\nstatic int vtfs_get_tree(struct fs_context *fc)\n{\n\tstruct vtfs_remote_config *config = fc->fs_private;\n\n\tif (config->server[0]) {\n\t\tif (!config->token[0])\n\t\t\treturn -EACCES;\n\t\treturn get_tree_nodev(fc, vtfs_remote_fill_super);\n\t}\n\treturn get_tree_nodev(fc, vtfs_fill_super);\n}\n\nenum {\n\tOpt_server, Opt_port, Opt_token, Opt_uid, Opt_gid, Opt_autosync, Opt_cache, Opt_journal,\n};\n\nstatic const struct fs_parameter_spec vtfs_parameters[] = {\n\tfsparam_string(\"server\", Opt_server),\n\tfsparam_u32(\"port\", Opt_port),\n\tfsparam_string(\"token\", Opt_token),\n\tfsparam_u32(\"uid\", Opt_uid),\n\tfsparam_u32(\"gid\", Opt_gid),\n\tfsparam_u32(\"autosync\", Opt_autosync),\n\tfsparam_u32(\"cache_mib\", Opt_cache),\n\tfsparam_u32(\"journal_port\", Opt_journal),\n\t{}\n};\n\nstatic int vtfs_parse_param(struct fs_context *fc, struct fs_parameter *parameter)\n{\n\tstruct vtfs_remote_config *config = fc->fs_private;\n\tstruct fs_parse_result result;\n\tint option = fs_parse(fc, vtfs_parameters, parameter, &result);\n\n\tif (option == -ENOPARAM)\n\t\treturn vfs_parse_fs_param_source(fc, parameter);\n\tif (option < 0)\n\t\treturn option;\n\tswitch (option) {\n\tcase Opt_server: {\n\t\tu8 address[4];\n\n\t\tif (!in4_pton(parameter->string, -1, address, -1, NULL) ||\n\t\t    strscpy(config->server, parameter->string, sizeof(config->server)) < 0)\n\t\t\treturn -EINVAL;\n\t\tbreak;\n\t}\n\tcase Opt_port:\n\t\tif (!result.uint_32 || result.uint_32 > 65535)\n\t\t\treturn -EINVAL;\n\t\tconfig->port = result.uint_32;\n\t\tbreak;\n\tcase Opt_token: {\n\t\tconst char *p = parameter->string;\n\n\t\tfor (; *p; p++)\n\t\t\tif (!((*p >= 'a' && *p <= 'z') || (*p >= 'A' && *p <= 'Z') ||\n\t\t\t      (*p >= '0' && *p <= '9') || *p == '-' || *p == '_'))\n\t\t\t\treturn -EINVAL;\n\t\tif (strscpy(config->token, parameter->string, sizeof(config->token)) < 0)\n\t\t\treturn -EINVAL;\n\t\tbreak;\n\t}\n\tcase Opt_uid:\n\t\tif (!uid_valid(make_kuid(&init_user_ns, result.uint_32)))\n\t\t\treturn -EINVAL;\n\t\tconfig->uid = result.uint_32;\n\t\tbreak;\n\tcase Opt_gid:\n\t\tif (!gid_valid(make_kgid(&init_user_ns, result.uint_32)))\n\t\t\treturn -EINVAL;\n\t\tconfig->gid = result.uint_32;\n\t\tbreak;\n\tcase Opt_cache:\n\t\tif (!result.uint_32 || result.uint_32 > 4096)\n\t\t\treturn -EINVAL;\n\t\tconfig->cache_mib = result.uint_32;\n\t\tbreak;\n\tcase Opt_journal:\n\t\tif (result.uint_32 > 65535)\n\t\t\treturn -EINVAL;\n\t\tconfig->journal_port = result.uint_32;\n\t\tbreak;\n\tcase Opt_autosync:\n\t\tif (result.uint_32 > 3600)\n\t\t\treturn -EINVAL;\n\t\tconfig->autosync = result.uint_32;\n\t\tbreak;\n\t}\n\treturn 0;\n}\n\nstatic void vtfs_free_context(struct fs_context *fc)\n{\n\tkfree_sensitive(fc->fs_private);\n}\n\nstatic const struct fs_context_operations vtfs_context_ops = {\n\t.get_tree = vtfs_get_tree,\n\t.parse_param = vtfs_parse_param,\n\t.free = vtfs_free_context,\n};\n\nstatic int vtfs_init_fs_context(struct fs_context *fc)\n{\n\tstruct vtfs_remote_config *config = kzalloc(sizeof(*config), GFP_KERNEL);\n\n\tif (!config)\n\t\treturn -ENOMEM;\n\tconfig->port = 8080;\n\tconfig->uid = from_kuid_munged(&init_user_ns, current_fsuid());\n\tconfig->gid = from_kgid_munged(&init_user_ns, current_fsgid());\n\tconfig->autosync = 1;\n\tconfig->cache_mib = 256;\n\tfc->fs_private = config;\n\tfc->ops = &vtfs_context_ops;\n\treturn 0;\n}\n\nstatic void vtfs_kill_sb(struct super_block *sb)\n{\n\tif (sb->s_fs_info)\n\t\tvtfs_remote_kill_sb(sb);\n\telse\n\t\tkill_anon_super(sb);\n}\n\nstatic struct file_system_type vtfs_fs_type = {\n\t.owner = THIS_MODULE,\n\t.name = MODULE_NAME,\n\t.init_fs_context = vtfs_init_fs_context,\n\t.parameters = vtfs_parameters,\n\t.kill_sb = vtfs_kill_sb,\n};\n\nstatic int __init vtfs_init(void)\n{\n\tint ret = register_filesystem(&vtfs_fs_type);\n\n\tif (ret)\n\t\treturn ret;\n\tLOG(\"VTFS joined the kernel\\n\");\n\treturn 0;\n}\n\nstatic void __exit vtfs_exit(void)\n{\n\tint ret = unregister_filesystem(&vtfs_fs_type);\n\n\tif (ret)\n\t\tpr_err(\"[vtfs]: unregister_filesystem failed: %d\\n\", ret);\n\telse\n\t\tLOG(\"VTFS left the kernel\\n\");\n}\n\nmodule_init(vtfs_init);\nmodule_exit(vtfs_exit);\n", "source/remote.c": "// SPDX-License-Identifier: GPL-2.0\n/* HTTP-backed VFS operations; dirty pages stay local until acknowledged. */\n#include <linux/fs.h>\n#include <linux/fs_context.h>\n#include <linux/highmem.h>\n#include <linux/list.h>\n#include <linux/mm.h>\n#include <linux/module.h>\n#include <linux/namei.h>\n#include <linux/pagemap.h>\n#include <linux/slab.h>\n#include <linux/uio.h>\n#include <linux/vmalloc.h>\n#include <linux/workqueue.h>\n#include \"http.h\"\n\n#define GOI_READONLY 1\n#define GOI_BRANCH 2\n#define GOI_SYNC_ALL 0x4701\n#define GOI_SWITCH 0x4702\n\nstruct goi_meta {\n\t__le64 id;\n\t__le64 size;\n\t__le64 mtime;\n\t__le32 mode; uct socket *sock, char *buffer, size_t buffer_size)\n{\n\tsize_t read = 0;\n\n\twhile (read < buffer_size) {\n\t\tstruct msghdr hdr = {};\n\t\tstruct kvec vec = {\n\t\t\t.iov_base = buffer + read,\n\t\t\t.iov_len = buffer_size - read,\n\t\t};\n\t\tint ret = kernel_recvmsg(sock, &hdr, &vec, 1, vec.iov_len, 0);\n\n\t\tif (!ret)\n\t\t\tbreak;\n\t\tif (ret < 0)\n\t\t\treturn ret;\n\t\tread += ret;\n\t}\n\t/* The extra byte was allocated by vtfs_http_call, not received from the network. */\n\tbuffer[read] = '\\0';\n\treturn read;\n}\n\nstatic int parse_http_response(char *raw_response, size_t raw_response_size,\n\t\t\t       void *response, size_t response_size, size_t *received)\n{\n\tchar *end = strnstr(raw_response, \"\\r\\n\\r\\n\", raw_response_size);\n\tchar *buffer = raw_response, *status_line, *header, *body;\n\tsize_t header_size, length = 0;\n\tbool have_length = false;\n\tunsigned int status_code;\n\t__le64 return_value;\n\ts64 status;\n\n\tif (!end)\n\t\treturn -EPROTO;\n\theader_size = end + 4 - raw_response;\n\tif (header_size > HEADER_LIMIT)\n\t\treturn -E2BIG;\n\tbody = raw_response + header_size;\n\t*end = '\\0';\n\n\t/* Read the response line, then the headers, as in the lab template. */\n\tstatus_line = strsep(&buffer, \"\\n\");\n\tif (sscanf(status_line, \"HTTP/%*u.%*u %u\", &status_code) != 1 || status_code != 200)\n\t\treturn -EPROTO;\n\twhile ((header = strsep(&buffer, \"\\n\"))) {\n\t\tif (!strncasecmp(header, \"Content-Length:\", 15)) {\n\t\t\tunsigned long value;\n\n\t\t\tif (have_length || kstrtoul(strim(header + 15), 10, &value))\n\t\t\t\treturn -EPROTO;\n\t\t\tlength = value;\n\t\t\thave_length = true;\n\t\t} else if (!strncasecmp(header, \"Transfer-Encoding:\", 18)) {\n\t\t\treturn -EPROTO;\n\t\t}\n\t}\n\tif (!have_length || length < sizeof(return_value) ||\n\t    length > raw_response_size - header_size)\n\t\treturn -EPROTO;\n\n\tmemcpy(&return_value, body, sizeof(return_value));\n\tstatus = (s64)le64_to_cpu(return_value);\n\tif (status)\n\t\treturn status < 0 && status >= -4095 ? (int)status : -EPROTO;\n\tlength -= sizeof(return_value);\n\tif (length > response_size)\n\t\treturn -ENOSPC;\n\tif (length)\n\t\tmemcpy(response, body + sizeof(return_value), length);\n\t*received = length;\n\treturn 0;\n}\n\nint vtfs_http_call(const struct vtfs_remote_config *config, const char *method,\n\t\t   const char *query, const void *body, size_t body_len,\n\t\t   void *response_buffer, size_t buffer_size, size_t *received)\n{\n\tstruct socket *sock;\n\tstruct sockaddr_in s_addr = {\n\t\t.sin_family = AF_INET,\n\t\t.sin_addr.s_addr = in_aton(config->server),\n\t\t.sin_port = htons(config->port),\n\t};\n\tstruct kvec vec;\n\tsize_t raw_buffer_size = HEADER_LIMIT + max_t(size_t, buffer_size, 4096) + sizeof(__le64);\n\tchar *raw_response_buffer;\n\tint error, read_bytes;\n\n\t*received = 0;\n\terror = fill_request(&vec, config, method, query, body != NULL, body_len);\n\tif (error)\n\t\treturn error;\n\traw_response_buffer = kvmalloc(raw_buffer_size + 1, GFP_KERNEL);\n\tif (!raw_response_buffer) {\n\t\terror = -ENOMEM;\n\t\tgoto free_request;\n\t}\n\terror = sock_create_kern(&init_net, AF_INET, SOCK_STREAM, IPPROTO_TCP, &sock);\n\tif (error)\n\t\tgoto free_response;\n\tsock->sk->sk_rcvtimeo = msecs_to_jiffies(10000);\n\tsock->sk->sk_sndtimeo = msecs_to_jiffies(10000);\n\terror = kernel_connect(sock, (struct sockaddr_unsized *)&s_addr, sizeof(s_addr), 0);\n\tif (error)\n\t\tgoto release;\n\n\terror = send_all(sock, vec.iov_base, vec.iov_len);\n\tif (!error && body_len)\n\t\terror = send_all(sock, body, body_len);\n\tif (error)\n\t\tgoto release;\n\tread_bytes = receive_all(sock, raw_response_buffer, raw_buffer_size);\n\tif (read_bytes < 0) {\n\t\terror = read_bytes;\n\t\tgoto release;\n\t}\n\terror = parse_http_response(raw_response_buffer, read_bytes, response_buffer,\n\t\t\t\t    buffer_size, received);\nrelease:\n\tsock_release(sock);\nfree_response:\n\tkvfree(raw_response_buffer);\nfree_request:\n\tkfree_sensitive(vec.iov_base);\n\treturn error;\n}\n\n/* Percent encoding from the lab template. dst needs 3 * strlen(src) + 1 bytes. */\nvoid encode(const char *src, char *dst)\n{\n\twhile (*src != '\\0') {\n\t\tif ((*src >= '0' && *src <= '9') || (*src >= 'a' && *src <= 'z') ||\n\t\t    (*src >= 'A' && *src <= 'Z')) {\n\t\t\t*dst++ = *src;\n\t\t} else {\n\t\t\tsprintf(dst, \"%%%02X\", (unsigned char)*src);\n\t\t\tdst += 3;\n\t\t}\n\t\tsrc++;\n\t}\n\t*dst = '\\0';\n}\n\nchar *vtfs_url_encode(const char *source)\n{\n\tsize_t length = strlen(source);\n\tchar *result;\n\n\tif (length > 4096)\n\t\treturn ERR_PTR(-ENAMETOOLONG);\n\tresult = kmalloc(length * 3 + 1, GFP_KERNEL);\n\tif (!result)\n\t\treturn ERR_PTR(-ENOMEM);\n\tencode(source, result);\n\treturn result;\n}\n", "source/http.h": "/* SPDX-License-Identifier: GPL-2.0 */\n#ifndef VTFS_HTTP_H\n#define VTFS_HTTP_H\n#include <linux/types.h>\n#define VTFS_CHUNK_SIZE 32768\n#define VTFS_MAX_FILE_SIZE (64ULL * 1024 * 1024)\nstruct vtfs_remote_config {\n\tchar server[16];\n\tchar token[129];\n\tu16 port;\n\tu32 uid;\n\tu32 gid;\n\tu32 autosync;\n\tu32 cache_mib;\n\tu16 journal_port;\n};\nint vtfs_http_call(const struct vtfs_remote_config *config, const char *method,\n\t\t   const char *query, const void *body, size_t body_len,\n\t\t   void *response, size_t capacity, size_t *received);\nvoid encode(const char *src, char *dst);\nchar *vtfs_url_encode(const char *source);\nstruct fs_context;\nstruct super_block;\nint vtfs_remote_fill_super(struct super_block *sb, struct fs_context *fc);\nvoid vtfs_remote_kill_sb(struct super_block *sb);\n#endif\n", "goi/cli.py": "\"\"\"GOI CLI: Device Flow, mounts, fsync, status and GitHub publication.\"\"\"\n\nimport argparse\nimport errno\nimport fcntl\nimport ipaddress\nimport json\nimport os\nfrom pathlib import Path\nimport socket\nimport subprocess\nimport sys\nimport time\nfrom urllib.error import URLError\nfrom urllib.parse import quote, urlsplit\nfrom urllib.request import Request, urlopen\nimport webbrowser\n\nfrom .protocol import Error, require\nfrom . import service\n\nSYNC_ALL = 0x4701\nSWITCH = 0x4702\n\n\ndef configuration_path():\n    return Path(os.environ.get(\"XDG_CONFIG_HOME\", Path.home() / \".config\")) / \"goi/mounts.json\"\n\n\ndef configurations():\n    path = configuration_path()\n    return json.loads(path.read_text()) if path.exists() else {}\n\n\ndef save_configuration(mountpoint, server, token_file, autosync=None, cache_mib=None, journal=None, managed_local=None):\n    path = configuration_path()\n    path.parent.mkdir(mode=0o700, parents=True, exist_ok=True)\n    records = configurations()\n    record = records.setdefault(str(mountpoint), {})\n    record.update(server=server.rstrip(\"/\"), token_file=str(Path(token_file).resolve()))\n    if autosync is not None:\n        record[\"autosync\"] = autosync\n    if cache_mib is not None:\n        record[\"cache_mib\"] = cache_mib\n    if journal is not None:\n        record[\"journal\"] = journal\n    if managed_local is not None:\n        record[\"managed_local\"] = managed_local\n    temporary = path.with_suffix(\".tmp\")\n    fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)\n    with os.fdopen(fd, \"w\") as file:\n        json.dump(records, file, indent=2)\n        file.flush()\n        os.fsync(file.fileno())\n    os.replace(temporary, path)\n\n\nclass Client:\n    def __init__(self, mountpoint, config):\n        self.mountpoint, self.server = Path(mountpoint), config[\"server\"]\n        path = Path(config[\"token_file\"])\n        require(not path.stat().st_mode & 0o077, errno.EACCES, \"session token file must have mode 0600\")\n        self.token = path.read_text().strip()\n\n    def call(self, operation, **values):\n        body = json.dumps({\"operation\": operation, **values}).encode()\n        request = Request(self.server + \"/control\", body,\n                          {\"Content-Type\": \"application/json\", \"Authorization\": \"Bearer \" + self.token})\n        try:\n            with urlopen(request, timeout=120) as response:\n                result = json.load(response)\n        except (URLError, OSError, TimeoutError):\n            raise Error(errno.EHOSTUNREACH, \"GOI server is unreachable; local changes are retained\") from None\n        require(result.get(\"ok\"), result.get(\"errno\", errno.EIO), result.get(\"error\", \"GOI request failed\"))\n        return result[\"result\"]\n\n    def relative(self, path):\n        return str(Path(path).resolve().relative_to(self.mountpoint))\n\n    def sync_all(self):\n        fd = os.open(self.mountpoint, os.O_RDONLY | os.O_DIRECTORY)\n        try:\n            fcntl.ioctl(fd, SYNC_ALL)\n        finally:\n            os.close(fd)\n\n\ndef connection(path, required=True):\n    resolved = Path(path).resolve()\n    for mountpoint, config in sorted(configurations().items(), key=lambda item: -len(item[0])):\n        if resolved.is_relative_to(mountpoint):\n            return Client(mountpoint, config)\n    if required:\n        raise Error(errno.ENOENT, \"mount this filesystem with goi mount <mountpoint> --server URL --token-file FILE\")\n    return None\n\n\ndef branch_context(client, path):\n    relative = Path(path).resolve().relative_to(client.mountpoint)\n    parts = relative.parts\n    require(len(parts) >= 3,\n            message=\"run this command inside an activated branch\")\n    end = 3\n    branch = Path(*parts[:end])\n    return branch.as_posix(), client.mountpoint / branch\n\n\ndef sync_file(path):\n    fd = os.open(path, os.O_RDONLY)\n    try:\n        os.fsync(fd)\n    finally:\n        os.close(fd)\n\n\ndef switch_branch(directory):\n    fd = os.open(directory, os.O_RDONLY | os.O_DIRECTORY)\n    try:\n        fcntl.ioctl(fd, SWITCH)\n    finally:\n        os.close(fd)\n\n\ndef parser():\n    result = argparse.ArgumentParser(description=__doc__)\n    commands = result.add_subparsers(dest=\"command\", required=True)\n    item = commands.add_parser(\"service\", help=\"manage the local per-user systemd service\")\n    item.add_argument(\"action\", choices=(\"install\", \"start\", \"stop\", \"restart\", \"status\", \"disable\"))\n    item.add_argument(\"--client-id\", help=\"OAuth App ID to persist when installing the service\")\n    item = commands.add_parser(\"mount\")\n    item.add_argument(\"mountpoint\", type=Path)\n    item.add_argument(\"--server\", help=\"saved address or http://127.0.0.1:8080\")\n    item.add_argument(\"--token-file\", type=Path, help=\"saved path or ~/.local/share/goi/server-token\")\n    item.add_argument(\"--autosync\", type=int, help=\"saved interval or 1 second; 0 disables background sync\")\n    item.add_argument(\"--cache-mib\", type=int, help=\"kernel file-cache limit; default 256 MiB\")\n    journal_mode = item.add_mutually_exclusive_group()\n    journal_mode.add_argument(\"--journal\", dest=\"journal\", action=\"store_true\", default=None)\n    journal_mode.add_argument(\"--no-journal\", dest=\"journal\", action=\"store_false\")\n    item = commands.add_parser(\"journal\")\n    item.add_argument(\"action\", choices=(\"status\", \"recover\", \"export\", \"discard\"), nargs=\"?\", default=\"status\")\n    item.add_argument(\"--mountpoint\", type=Path, default=Path.cwd())\n    item.add_argument(\"--output\", type=Path)\n    item.add_argument(\"--id\", type=int)\n    item = commands.add_parser(\"auth\")\n    item.add_argument(\"mountpoint\", nargs=\"?\", default=\"/github\")\n    item.add_argument(\"--no-browser\", action=\"store_true\")\n    commands.add_parser(\"accounts\")\n    item = commands.add_parser(\"logout\")\n    item.add_argument(\"login\")\n    item = commands.add_parser(\"cache\", help=\"inspect or clear the server clean-file cache\")\n    item.add_argument(\"--clear\", action=\"store_true\")\n    item = commands.add_parser(\"activate\")\n    item.add_argument(\"path\", nargs=\"?\", default=Path(\".\"), type=Path,\n                      help=\"repository directory; defaults to the current directory\")\n    item = commands.add_parser(\"sync\")\n    item.add_argument(\"paths\", nargs=\"*\", type=Path)\n    item = commands.add_parser(\"status\")\n    item.add_argument(\"--json\", action=\"store_true\")\n    item.add_argument(\"--ignored\", action=\"store_true\")\n    item = commands.add_parser(\"restore\", help=\"discard local changes to explicit files or directories\")\n    item.add_argument(\"paths\", nargs=\"+\", type=Path)\n    commands.add_parser(\"diff\")\n    commands.add_parser(\"refresh\")\n    item = commands.add_parser(\"recover\", help=\"recover an interrupted publication\")\n    item.add_argument(\"--forget\", action=\"store_true\", help=\"forget publication intent, retaining local edits\")\n    item = commands.add_parser(\"switch\", help=\"save changes, drop other branch caches and print the branch root\")\n    item.add_argument(\"branch\", help=\"branch name in the current repository, or a path to a branch\")\n    item.add_argument(\"--from-cd\", action=\"store_true\", help=argparse.SUPPRESS)\n    item = commands.add_parser(\"commit\")\n    item.add_argument(\"paths\", nargs=\"*\", type=Path)\n    item.add_argument(\"-m\", \"--message\", required=True)\n    item.add_argument(\"--force\", action=\"store_true\", help=\"include ignored new files\")\n    item = commands.add_parser(\"resolve\")\n    item.add_argument(\"path\", type=Path)\n    choice = item.add_mutually_exclusive_group()\n    choice.add_argument(\"--ours\", action=\"store_true\")\n    choice.add_argument(\"--theirs\", action=\"store_true\")\n    item = commands.add_parser(\"unmount\")\n    item.add_argument(\"mountpoint\", type=Path)\n    return result\n\n\ndef main(argv=None):\n    argv = list(sys.argv[1:] if argv is None else argv)\n    if Path(sys.argv[0]).name == \"goida\":\n        argv.insert(0, \"commit\")\n    args = parser().parse_args(argv)\n    try:\n        if args.command == \"service\":\n            require(args.client_id is None or args.action == \"install\", message=\"--client-id is only valid with service install\")\n            if args.action == \"install\":\n                print(service.install(args.client_id))\n                print(\"Enabled for login; use goi service start (or restart after changing Client ID)\")\n            elif args.action == \"start\":\n                service.ensure()\n                print(\"Local GOI service is ready\")\n            elif args.action == \"disable\":\n                print(service.systemctl(\"disable\", \"goi.service\"))\n            elif args.action == \"status\":\n                result = subprocess.run([\"systemctl\", \"--user\", \"status\", \"--no-pager\", \"goi.service\"])\n                return result.returncode\n            else:\n                print(service.systemctl(args.action, \"goi.service\"))\n            return 0\n        if args.command == \"switch\":\n            target = Path(args.branch)\n            if not args.from_cd and not target.is_absolute() and not args.branch.startswith((\"./\", \"../\")):\n                client = connection(Path.cwd())\n                _, current = branch_context(client, Path.cwd())\n                target = current.parent / args.branch\n                if not target.is_dir():\n                    target = current.parent / quote(args.branch, safe=\"\")\n            require(target.is_dir(), errno.ENOENT, \"branch directory does not exist; activate the repository first\")\n            client = connection(target, required=not args.from_cd)\n            if client is None:\n                return 0\n            try:\n                _, directory = branch_context(client, target)\n            except Error as exc:\n                if args.from_cd and exc.code == errno.EINVAL:\n                    return 0  # cd also visits the mount root and repository directories.\n                raise\n            switch_branch(directory)\n            if not args.from_cd:\n                print(directory)\n            return 0\n        if args.command == \"mount\":\n            mountpoint = args.mountpoint.resolve()\n            saved = configurations().get(str(mountpoint), {})\n            server = args.server if args.server is not None else saved.get(\"server\", \"http://127.0.0.1:8080\")\n            token_file = args.token_file if args.token_file is not None else Path(\n                saved.get(\"token_file\", Path.home() / \".local/share/goi/server-token\"))\n            autosync = args.autosync if args.autosync is not None else saved.get(\"autosync\", 1)\n            require(0 <= autosync <= 3600, message=\"autosync must be 0..3600 seconds\")\n            managed_local = (args.server is None and args.token_file is None\n                             and saved.get(\"managed_local\", True)\n                             and server.rstrip(\"/\") == service.URL\n                             and token_file.resolve() == (service.data_directory() / \"server-token\").resolve())\n            require(not os.path.ismount(mountpoint), errno.EBUSY, \"already mounted\")\n            if managed_local:\n                service.ensure()\n            client = Client(mountpoint, {\"server\": server, \"token_file\": str(token_file)})\n            url = urlsplit(server)\n            require(url.scheme == \"http\" and url.hostname and not url.username and not url.password,\n                    message=\"kernel mount requires an HTTP IPv4 endpoint; use a trusted network or SSH tunnel\")\n            address = socket.gethostbyname(url.hostname)\n            ipaddress.IPv4Address(address)\n            require(client.token and all(c.isalnum() or c in \"-_\" for c in client.token), message=\"invalid session token\")\n            cache_mib = args.cache_mib if args.cache_mib is not None else saved.get(\"cache_mib\", 256)\n            journaling = args.journal if args.journal is not None else saved.get(\"journal\", True)\n            require(1 <= cache_mib <= 4096, message=\"cache-mib must be 1..4096\")\n            require(not os.path.ismount(mountpoint), errno.EBUSY, \"already mounted\")\n            journal_port = 0\n            if journaling:\n                from .journal import ensure\n                local, journal_port = ensure(client)\n                result = local.call(\"replay\")\n                if result[\"restored\"]:\n                    print(f\"Recovered {result['restored']} files from the client journal\")\n            uid, gid = os.getuid(), os.getgid()\n            privilege = [\"sudo\"] if uid else []\n            try:\n                mountpoint.mkdir(parents=True, exist_ok=True)\n            except PermissionError:\n                subprocess.run(privilege + [\"mkdir\", \"-p\", \"--\", str(mountpoint)], check=True)\n            options = (f\"server={address},port={url.port or 80},token={client.token},\"\n                       f\"uid={uid},gid={gid},autosync={autosync},cache_mib={cache_mib},journal_port={journal_port}\")\n            command = [\"mount\", \"-t\", \"vtfs\", \"none\", str(mountpoint), \"-o\", options]\n            subprocess.run(privilege + command, check=True)\n            save_configuration(mountpoint, server, token_file, autosync, cache_mib, journaling, managed_local)\n            print(f\"GOI mounted at {mountpoint}\")\n            return 0\n        target = args.mountpoint if args.command in (\"auth\", \"unmount\", \"journal\") else (\n            args.path if args.command == \"activate\" else Path.cwd())\n        client = connection(target)\n        if args.command == \"journal\":\n            from .journal import ensure\n            local, _ = ensure(client)\n            if args.action == \"discard\":\n                require(not os.path.ismount(client.mountpoint), errno.EBUSY, \"unmount before discarding journal entries\")\n                require(args.id is not None, message=\"journal discard requires --id NUMBER\")\n                print(json.dumps(local.call(\"discard\", id=args.id)))\n            elif args.action == \"recover\":\n     if args.command == \"auth\":\n            flow = client.call(\"auth_start\")\n            print(f\"Open {flow['verification_uri']} and enter {flow['user_code']}\", flush=True)\n            if not args.no_browser:\n                webbrowser.open(flow[\"verification_uri\"])\n            deadline, interval = time.monotonic() + flow[\"expires_in\"], flow[\"interval\"]\n            while time.monotonic() < deadline:\n                time.sleep(interval)\n                result = client.call(\"auth_poll\", flow=flow[\"flow\"])\n                if not result.get(\"pending\"):\n                    print(f\"Connected: {client.mountpoint / result['login']}\")\n                    return 0\n                interval = result[\"interval\"]\n            raise Error(errno.ETIMEDOUT, \"Device Flow expired\")\n        if args.command == \"activate\":\n            client.call(\"activate\", path=client.relative(args.path))\n            print(\"Repository activated; open its <branch> directory\")\n            return 0\n        if args.command == \"sync\":\n            if not args.paths:\n                client.sync_all()\n            for path in args.paths:\n                sync_file(path)\n            print(\"Saved on GOI server; no GitHub commit created\")\n            return 0\n        if args.command == \"unmount\":\n            client.sync_all()\n            subprocess.run(([\"sudo\"] if os.getuid() else []) + [\"umount\", str(client.mountpoint)], check=True)\n            return 0\n        if args.command == \"refresh\" and len(Path.cwd().relative_to(client.mountpoint).parts) <= 1:\n            relative = client.relative(Path.cwd())\n            client.call(\"refresh_owners\", path=\"\" if relative == \".\" else relative)\n            print(\"Owner listing updated\")\n            return 0\n        branch, directory = branch_context(client, Path.cwd())\n        if args.command == \"commit\":\n            paths = []\n            for path in args.paths:\n                relative e_address = True\n\n    def __init__(self, address, store, token):\n        self.store, self.token = store, token\n        super().__init__(address, Handler)\n\n\nclass Handler(BaseHTTPRequestHandler):\n    protocol_version = \"HTTP/1.1\"\n\n    def log_message(self, *_args):\n        # Query strings contain capability tokens in the kernel compatibility API.\n        pass\n\n    def setup(self):\n        super().setup()\n        self.connection.settimeout(30)\n\n    def do_GET(self):\n        self.handle_request()\n\n    def do_POST(self):\n        self.handle_request()\n\n    def send(self, payload, content_type=\"application/octet-stream\", status=200):\n        self.send_response(status)\n        self.send_header(\"Content-Type\", content_type)\n        self.send_header(\"Content-Length\", str(len(payload)))\n        self.send_header(\"Connection\", \"close\")\n        self.send_header(\"Cache-Control\", \"no-store\")\n        self.end_headers()\n        self.wfile.write(payload)\n        self.close_connection = True\n\n    def handle_request(self):\n        control = self.path.split(\"?\", 1)[0] == \"/control\"\n        try:\n            require(len(self.path) <= 16384, errno.E2BIG, \"request URL too long\")\n            url = urlsplit(self.path)\n            query = parse_qs(url.query, keep_blank_values=True, strict_parsing=False, errors=\"strict\")\n            args = {key: value[-1] for key, value in query.items()}\n            authorization = self.headers.get(\"Authorization\", \"\")\n            token = authorization[7:] if authorization.startswith(\"Bearer \") else args.pop(\"token\", \"\")\n            require(bool(token) and hmac.compare_digest(token, self.server.token), errno.EACCES, \"invalid GOI session token\")\n            length = int(self.headers.get(\"Content-Length\", \"0\"))\n            require(0 <= length <= MAX_REQUEST, errno.E2BIG, \"request body too large\")\n            body = self.rfile.read(length)\n            require(len(body) == length, errno.EPROTO, \"incomplete request body\")\n            with self.server.store.lock:\n                try:\n                    if control:\n                        require(self.command == \"POST\", message=\"control requests require POST\")\n                        result = self.control(json.loads(body))\n                    else:\n                        require(url.path.startswith(\"/api/\"), errno.ENOENT, \"unknown endpoint\")\n                        result = self.api(url.path[5:], args, body)\n                    self.server.store.trim_cache()\n                    self.server.store.db.commit()\n                except Exception:\n                    self.server.store.db.rollback()\n                    raise\n            if control:\n                self.send(json.dumps({\"ok\": True, \"result\": result}).encode(), \"application/json\")\n            else:\n                self.send(STATUS.pack(0) + result)\n        except (Error, ValueError, TypeError, KeyError) as exc:\n            code = exc.code if isinstance(exc, Error) else errno.EINVAL\n            message = str(exc) if isinstance(exc, Error) else \"invalid request\"\n            if control:\n                self.send(json.dumps({\"ok\": False, \"errno\": code, \"error\": message}).encode(), \"application/json\")\n            else:\n                self.send(STATUS.pack(-code) + message.encode()[:4096])\n        except (BrokenPipeError, ConnectionResetError, TimeoutError):\n            self.close_connection = True\n        except Exception as exc:\n            # Keep implementation exceptions out of client responses and secret-bearing logs.\n            print(f\"GOI internal error: {type(exc).__name__}\", flush=True)\n            if control:\n                self.send(b'{\"ok\":false,\"errno\":5,\"error\":\"internal server error\"}', \"application/json\")\n            else:\n                self.send(STATUS.pack(-errno.EIO))\n\n    def api(self, method, args, body):\n        store = self.server.store\n\n        def integer(key, default=None):\n            value = args.get(key, default)\n            require(value is not None, message=f\"missing {key}\")\n            number = int(value)\n            require(0 <= number < 2**63, message=f\"invalid {key}\")\n            return number\n\n        if method in (\"hello\", \"stat\"):\n            return metadata(store.node(integer(\"id\", 1)))\n        if method == \"lookup\":\n            return metadata(store.lookup(integer(\"parent\"), args[\"name\"]))\n        if method == \"list\":\n            nodes = store.list(integer(\"id\"), integer(\"offset\", 0), 100)\n            result = bytearray(COUNT.pack(len(nodes)))\n            for node in nodes:\n                name = node[\"name\"].encode()\n                result.extend(metadata(node) + NAME_LEN.pack(len(name)) + name)\n            return bytes(result)\n        if method == \"read\":\n            count = integer(\"count\")\n            require(count <= CHUNK_SIZE, errno.E2BIG, \"read exceeds chunk size\")\n            return store.read(integer(\"id\"), integer(\"offset\"), count)\n        if method == \"create\":\n            return metadata(store.create(integer(\"parent\"), args[\"name\"], integer(\"mode\")))\n        if method in (\"unlink\", \"rmdir\"):\n            store.remove(integer(\"parent\"), args[\"name\"], directory=method == \"rmdir\")\n            return b\"\"\n        if method == \"rename\":\n            return metadata(store.rename(integer(\"old_parent\"), args[\"old_name\"], integer(\"new_parent\"),\n                                          args[\"new_name\"], integer(\"flags\", 0)))\n        if method == \"setattr\":\n            return metadata(store.setattr(integer(\"id\"), integer(\"mode\") if \"mode\" in args else None,\n                                           integer(\"size\") if \"size\" in args else None))\n        if method == \"write\":\n            require(self.command == \"POST\", message=\"file writes require POST\")\n            if \"expected_revision\" in args:\n                node = store.node(integer(\"id\"))\n                same = (store.read(node[\"id\"], 0, MAX_REQUEST) == body\n                        and node[\"mode\"] & 0o777 == integer(\"mode\"))\n                require(node[\"revision\"] == integer(\"expected_revision\") or same, errno.ESTALE,\n                        \"remote file changed since journal snapshot\")\n                if same:\n                    return metadata(node)\n            return metadata(store.write(integer(\"id\"), body, integer(\"mode\")))\n        raise Error(errno.ENOSYS, \"unknown filesystem operation\")\n\n    def control(self, request):\n        store = self.server.store\n        operation = request[\"operation\"]\n        if operation == \"accounts\":\n            return {\"client_id\": store.client_id, \"accounts\": [\n                {\"login\": row[\"login\"], \"authenticated\": bool(row[\"token\"])}\n                for row in store.db.execute(\"SELECT login,token FROM accounts ORDER BY login\")]}\n        if operation == \"logout\":\n            cursor = store.db.execute(\"UPDATE accounts SET token=NULL WHERE login=?\", (request[\"login\"],))\n            require(cursor.rowcount, errno.ENOENT, \"account not found\")\n            return {\"logged_out\": request[\"login\"]}\n        if operation == \"cache\":\n            return store.trim_cache(0 if request.get(\"clear\") else None)\n        if operation == \"auth_start\":\n            require(bool(store.client_id), errno.EINVAL, \"configure --client-id for your GitHub OAuth App (Device Flow enabled)\")\n            data = store.github_factory(\"\").device_start(store.client_id)\n            require(\"device_code\" in data, errno.EACCES, data.get(\"error_description\", \"Device Flow rejected\"))\n            flow = secrets.token_hex(16)\n            interval = int(data.get(\"interval\", 5))\n            store.db.execute(\"INSERT INTO devices VALUES (?,?,?,?,?)\",\n

<script id="data" type="application/json">{"steps": [["Build and load", "Build the module against matching kernel headers. insmod loads its code and calls vtfs_init, which registers the vtfs filesystem type. It does not create a mount.", "make W=1\nsudo insmod source/vtfs.ko", ["source/vtfs.c"], "vtfs_init", "inode"], ["Start the service", "The local Python server opens SQLite and exposes HTTP. The user systemd unit starts at login and restarts after failure. Mount can start it on demand and waits for authenticated readiness.", "goi service install --client-id YOUR_CLIENT_ID\ngoi service status", ["goi/service.py", "goi/server.py", "goi/storage.py"], "ensure", "SQLite"], ["Mount", "The CLI prepares the mountpoint, main service and client journal, then invokes mount. VFS builds a filesystem context; get_tree calls fill_super. HTTP hello returns the root object metadata.", "goi mount ~/github", ["goi/cli.py", "source/vtfs.c", "source/remote.c"], "main", "super_block"], ["Authenticate", "Device Flow displays a code and a browser URL. After approval, the service stores the GitHub token and exposes owner directories. Before login, root listing is denied.", "goi auth ~/github", ["goi/cli.py", "goi/server.py", "goi/github.py"], "device_start", "VFS"], ["Activate a repository", "Explicit activation retrieves branches. Each branch is a directory. Other repositories remain inactive; directory discovery does not eagerly fetch every blob.", "goi activate ~/github/YOUR_LOGIN/YOUR_REPO", ["goi/storage.py", "goi/server.py"], "activate", "dentry"], ["Look up and list", "VFS resolves path components using lookup. The server loads directory metadata when needed. Listing uses iterate rather than reading file contents.", "cd ~/github/YOUR_LOGIN/YOUR_REPO/main\nls", ["source/remote.c", "goi/storage.py"], "goi_lookup", "dentry"], ["Open and read", "The module loads a file into page cache. The service fetches its GitHub blob if it is not cached. HTTP transfers data in bounded chunks; generic_file_read_iter returns bytes to the application.", "cat README.md", ["source/remote.c", "goi/storage.py", "goi/github.py"], "goi_load", "page cache"], ["Write and journal", "A write changes cached file contents. With journaling enabled, the full snapshot is committed to the local SQLite journal before write succeeds. This protects content before the main service has acknowledged fsync.", "printf '\\nHello from GOI\\n' >> README.md", ["source/remote.c", "goi/journal.py"], "goi_write_iter", "journal"], ["Fsync and autosync", "Fsync sends the complete file to the main service, waits for SQLite commit, and acknowledges the journal. Autosync schedules the same kind of saving through delayed work. Saving is separate from publication.", "goi sync README.md", ["source/remote.c", "goi/server.py", "goi/storage.py"], "goi_fsync", "fsync"], ["Inspect changes", "Status and diff compare service working state against the recorded baseline. The kernel dirty flag tracks unsaved bytes; service changes track unpublished edits. Ignore rules affect only new unpublished objects.", "goi status\ngoi diff", ["goi/cli.py", "goi/publish.py", "goi/ignore.py"], "status", "baseline"], ["Publish a commit", "Commit synchronizes pending writes, checks the remote branch, creates Git objects, and updates its ref without force. Publication intent is persisted before updating the ref so an uncertain result can be recovered.", "goi commit README.md -m \"Update README\"", ["goi/publish.py", "goi/github.py", "goi/recovery.py"], "commit", "ref"], ["Resolve conflicts", "Independent text edits can merge. Ambiguous changes create a separate conflict copy. Edit that copy and resolve it before reopening the working file and publishing. The working file is preserved until resolution.", "$EDITOR .goi/commit/changes/README.md\ngoi sync .goi/commit/changes/README.md\ngoi resolve README.md", ["goi/merge.py", "goi/publish.py"], "resolve", "baseline"], ["Refresh and restore", "Refresh updates clean files and merges changes while preserving locally changed directory subtrees. Restore discards selected changes back to the baseline. Reopen affected files after either operation.", "goi refresh\ngoi restore README.md", ["goi/workspace.py", "goi/storage.py"], "restore", "revision"], ["Switch and recover", "The shell cd wrapper synchronizes branch transitions and releases eligible caches. Open and dirty files remain protected. Journal replay checks revisions before restoring data; ambiguous snapshots can be exported.", "goi switch main\ngoi journal status\ngoi journal export --output ~/goi-rescue", ["shell/goi.sh", "goi/cli.py", "goi/journal.py"], "switch_branch", "workqueue"], ["Unmount and unload", "Unmount synchronizes before releasing the filesystem instance. Open references can prevent it. rmmod unloads the filesystem type only after mounts are gone. The main service and its SQLite data remain independent.", "cd ~\ngoi unmount ~/github\nsudo rmmod vtfs", ["goi/cli.py", "source/remote.c", "source/vtfs.c"], "vtfs_exit", "super_block"]], "terms": {"inode": "A kernel object describing a filesystem object: ID, type, permissions, timestamps, operations, and mapping to cached content. The filename is represented separately.", "dentry": "A directory-entry cache object connecting a name under a parent directory to an inode. Path lookup walks dentries.", "VFS": "Linux Virtual Filesystem: the common layer that routes ordinary file system calls to filesystem-specific operations.", "super_block": "The kernel object describing one mounted filesystem instance, including its root, operations, and private backend state.", "page cache": "Kernel memory pages containing file data. GOI loads remote bytes here and uses generic file helpers for reads and writes.", "SQLite": "The service database holding working state. WAL and synchronous=FULL provide durable commits, subject to the underlying storage guarantees.", "fsync": "A system call asking a filesystem to complete durable saving for a file. In GOI HTTP mode it saves to the main service; it does not publish to GitHub.", "journal": "A local SQLite store of full-file snapshots retained until the main service acknowledges them. It is distinct from the publication-intent journal.", "baseline": "The recorded version used to compare working files with their starting state and to perform three-way merges.", "ref": "A Git reference, such as a branch name, pointing to a commit. Publication advances the branch ref after constructing Git objects.", "revision": "A service-side change counter used for clean-cache invalidation and conditional journal recovery.", "workqueue": "Kernel infrastructure for running callbacks in worker threads. GOI delayed work may sleep while waiting for HTTP or a mutex; it is not an interrupt handler or a new goi process."}, "sources": {"source/vtfs.c": "// SPDX-License-Identifier: GPL-2.0\n#include <linux/fs.h>\n#include <linux/fs_context.h>\n#include <linux/fs_parser.h>\n#include <linux/inet.h>\n#include <linux/init.h>\n#include <linux/limits.h>\n#include <linux/module.h>\n#include <linux/pagemap.h>\n#include <linux/printk.h>\n#include <linux/security.h>\n#include <linux/splice.h>\n#include \"http.h\"\n\n#define MODULE_NAME \"vtfs\"\n#define VTFS_MAGIC 0x676f6901\n\nMODULE_LICENSE(\"GPL\");\nMODULE_AUTHOR(\"secs-dev\");\nMODULE_DESCRIPTION(\"GOI filesystem: RAM and HTTP storage backends\");\nMODULE_ALIAS_FS(MODULE_NAME);\n\n#define LOG(fmt, ...) pr_info(\"[\" MODULE_NAME \"]: \" fmt, ##__VA_ARGS__)\n\nstatic const struct inode_operations vtfs_dir_inode_ops;\n\n/* A RAM-only backend cannot acknowledge durable storage on a GOI server. */\nstatic int vtfs_fsync(struct file *file, loff_t start, loff_t end, int datasync)\n{\n\treturn -EOPNOTSUPP;\n}\n\nstatic const struct file_operations vtfs_file_ops = {\n\t.owner = THIS_MODULE,\n\t.llseek = generic_file_llseek,\n\t.read_iter = generic_file_read_iter,\n\t.write_iter = generic_file_write_iter,\n\t.mmap_prepare = generic_file_mmap_prepare,\n\t.splice_read = filemap_splice_read,\n\t.splice_write = iter_file_splice_write,\n\t.fsync = vtfs_fsync,\n};\n\nstatic const struct inode_operations vtfs_file_inode_ops = {\n\t.getattr = simple_getattr,\n\t.setattr = simple_setattr,\n};\n\nstatic const struct file_operations vtfs_dir_ops = {\n\t.owner = THIS_MODULE,\n\t.open = dcache_dir_open,\n\t.release = dcache_dir_close,\n\t.llseek = dcache_dir_lseek,\n\t.read = generic_read_dir,\n\t.iterate_shared = dcache_readdir,\n\t.fsync = vtfs_fsync,\n};\n\nstatic const struct super_operations vtfs_super_ops = {\n\t.statfs = simple_statfs,\n\t.drop_inode = inode_just_drop,\n};\n\nstatic struct inode *vtfs_new_inode(struct mnt_idmap *idmap,\n\t\t\t\t    struct super_block *sb,\n\t\t\t\t    const struct inode *parent, umode_t mode)\n{\n\tstruct inode *inode = new_inode(sb);\n\n\tif (!inode)\n\t\treturn NULL;\n\n\tinode->i_ino = get_next_ino();\n\tinode_init_owner(idmap, inode, parent, mode);\n\tsimple_inode_init_ts(inode);\n\n\tif (S_ISDIR(mode)) {\n\t\tinode->i_op = &vtfs_dir_inode_ops;\n\t\tinode->i_fop = &vtfs_dir_ops;\n\t\tinc_nlink(inode);\n\t} else {\n\t\tinode->i_op = &vtfs_file_inode_ops;\n\t\tinode->i_fop = &vtfs_file_ops;\n\t\tinode->i_mapping->a_ops = &ram_aops;\n\t\tmapping_set_gfp_mask(inode->i_mapping, GFP_HIGHUSER);\n\t\t/* RAM is the only copy: clean pages must not be reclaimed. */\n\t\tmapping_set_unevictable(inode->i_mapping);\n\t}\n\n\treturn inode;\n}\n\nstatic int vtfs_add_inode(struct mnt_idmap *idmap, struct inode *dir,\n\t\t\t  struct dentry *dentry, umode_t mode)\n{\n\tstruct inode *inode;\n\tint ret;\n\n\tinode = vtfs_new_inode(idmap, dir->i_sb, dir, mode);\n\tif (!inode)\n\t\treturn -ENOMEM;\n\n\tret = security_inode_init_security(inode, dir, &dentry->d_name, NULL, NULL);\n\tif (ret) {\n\t\tiput(inode);\n\t\treturn ret;\n\t}\n\n\t/* Keep the directory entry alive even after its last user closes it. */\n\td_make_persistent(dentry, inode);\n\tinode_set_mtime_to_ts(dir, inode_set_ctime_current(dir));\n\treturn 0;\n}\n\nstatic int vtfs_create(struct mnt_idmap *idmap, struct inode *dir,\n\t\t       struct dentry *dentry, umode_t mode, bool excl)\n{\n\treturn vtfs_add_inode(idmap, dir, dentry, S_IFREG | mode);\n}\n\nstatic struct dentry *vtfs_mkdir(struct mnt_idmap *idmap, struct inode *dir,\n\t\t\t\t struct dentry *dentry, umode_t mode)\n{\n\tint ret = vtfs_add_inode(idmap, dir, dentry, S_IFDIR | mode);\n\n\tif (ret)\n\t\treturn ERR_PTR(ret);\n\tinc_nlink(dir);\n\treturn NULL;\n}\n\nstatic const struct inode_operations vtfs_dir_inode_ops = {\n\t.lookup = simple_lookup,\n\t.create = vtfs_create,\n\t.mkdir = vtfs_mkdir,\n\t.unlink = simple_unlink,\n\t.rmdir = simple_rmdir,\n\t.rename = simple_rename,\n\t.getattr = simple_getattr,\n\t.setattr = simple_setattr,\n};\n\nstatic int vtfs_fill_super(struct super_block *sb, struct fs_context *fc)\n{\n\tstruct inode *root;\n\n\tsb->s_magic = VTFS_MAGIC;\n\tsb->s_op = &vtfs_super_ops;\n\t/* Unpinned dentries can be destroyed; live RAM entries are persistent. */\n\tsb->s_d_flags = DCACHE_DONTCACHE;\n\tsb->s_maxbytes = MAX_LFS_FILESIZE;\n\tsb->s_blocksize = PAGE_SIZE;\n\tsb->s_blocksize_bits = PAGE_SHIFT;\n\tsb->s_time_gran = 1;\n\n\troot = vtfs_new_inode(&nop_mnt_idmap, sb, NULL, S_IFDIR | 0755);\n\tif (!root)\n\t\treturn -ENOMEM;\n\n\t/* d_make_root consumes the inode reference, including on failure. */\n\tsb->s_root = d_make_root(root);\n\tif (!sb->s_root)\n\t\treturn -ENOMEM;\n\n\treturn 0;\n}\n\nstatic int vtfs_get_tree(struct fs_context *fc)\n{\n\tstruct vtfs_remote_config *config = fc->fs_private;\n\n\tif (config->server[0]) {\n\t\tif (!config->token[0])\n\t\t\treturn -EACCES;\n\t\treturn get_tree_nodev(fc, vtfs_remote_fill_super);\n\t}\n\treturn get_tree_nodev(fc, vtfs_fill_super);\n}\n\nenum {\n\tOpt_server, Opt_port, Opt_token, Opt_uid, Opt_gid, Opt_autosync, Opt_cache, Opt_journal,\n};\n\nstatic const struct fs_parameter_spec vtfs_parameters[] = {\n\tfsparam_string(\"server\", Opt_server),\n\tfsparam_u32(\"port\", Opt_port),\n\tfsparam_string(\"token\", Opt_token),\n\tfsparam_u32(\"uid\", Opt_uid),\n\tfsparam_u32(\"gid\", Opt_gid),\n\tfsparam_u32(\"autosync\", Opt_autosync),\n\tfsparam_u32(\"cache_mib\", Opt_cache),\n\tfsparam_u32(\"journal_port\", Opt_journal),\n\t{}\n};\n\nstatic int vtfs_parse_param(struct fs_context *fc, struct fs_parameter *parameter)\n{\n\tstruct vtfs_remote_config *config = fc->fs_private;\n\tstruct fs_parse_result result;\n\tint option = fs_parse(fc, vtfs_parameters, parameter, &result);\n\n\tif (option == -ENOPARAM)\n\t\treturn vfs_parse_fs_param_source(fc, parameter);\n\tif (option < 0)\n\t\treturn option;\n\tswitch (option) {\n\tcase Opt_server: {\n\t\tu8 address[4];\n\n\t\tif (!in4_pton(parameter->string, -1, address, -1, NULL) ||\n\t\t    strscpy(config->server, parameter->string, sizeof(config->server)) < 0)\n\t\t\treturn -EINVAL;\n\t\tbreak;\n\t}\n\tcase Opt_port:\n\t\tif (!result.uint_32 || result.uint_32 > 65535)\n\t\t\treturn -EINVAL;\n\t\tconfig->port = result.uint_32;\n\t\tbreak;\n\tcase Opt_token: {\n\t\tconst char *p = parameter->string;\n\n\t\tfor (; *p; p++)\n\t\t\tif (!((*p >= 'a' && *p <= 'z') || (*p >= 'A' && *p <= 'Z') ||\n\t\t\t      (*p >= '0' && *p <= '9') || *p == '-' || *p == '_'))\n\t\t\t\treturn -EINVAL;\n\t\tif (strscpy(config->token, parameter->string, sizeof(config->token)) < 0)\n\t\t\treturn -EINVAL;\n\t\tbreak;\n\t}\n\tcase Opt_uid:\n\t\tif (!uid_valid(make_kuid(&init_user_ns, result.uint_32)))\n\t\t\treturn -EINVAL;\n\t\tconfig->uid = result.uint_32;\n\t\tbreak;\n\tcase Opt_gid:\n\t\tif (!gid_valid(make_kgid(&init_user_ns, result.uint_32)))\n\t\t\treturn -EINVAL;\n\t\tconfig->gid = result.uint_32;\n\t\tbreak;\n\tcase Opt_cache:\n\t\tif (!result.uint_32 || result.uint_32 > 4096)\n\t\t\treturn -EINVAL;\n\t\tconfig->cache_mib = result.uint_32;\n\t\tbreak;\n\tcase Opt_journal:\n\t\tif (result.uint_32 > 65535)\n\t\t\treturn -EINVAL;\n\t\tconfig->journal_port = result.uint_32;\n\t\tbreak;\n\tcase Opt_autosync:\n\t\tif (result.uint_32 > 3600)\n\t\t\treturn -EINVAL;\n\t\tconfig->autosync = result.uint_32;\n\t\tbreak;\n\t}\n\treturn 0;\n}\n\nstatic void vtfs_free_context(struct fs_context *fc)\n{\n\tkfree_sensitive(fc->fs_private);\n}\n\nstatic const struct fs_context_operations vtfs_context_ops = {\n\t.get_tree = vtfs_get_tree,\n\t.parse_param = vtfs_parse_param,\n\t.free = vtfs_free_context,\n};\n\nstatic int vtfs_init_fs_context(struct fs_context *fc)\n{\n\tstruct vtfs_remote_config *config = kzalloc(sizeof(*config), GFP_KERNEL);\n\n\tif (!config)\n\t\treturn -ENOMEM;\n\tconfig->port = 8080;\n\tconfig->uid = from_kuid_munged(&init_user_ns, current_fsuid());\n\tconfig->gid = from_kgid_munged(&init_user_ns, current_fsgid());\n\tconfig->autosync = 1;\n\tconfig->cache_mib = 256;\n\tfc->fs_private = config;\n\tfc->ops = &vtfs_context_ops;\n\treturn 0;\n}\n\nstatic void vtfs_kill_sb(struct super_block *sb)\n{\n\tif (sb->s_fs_info)\n\t\tvtfs_remote_kill_sb(sb);\n\telse\n\t\tkill_anon_super(sb);\n}\n\nstatic struct file_system_type vtfs_fs_type = {\n\t.owner = THIS_MODULE,\n\t.name = MODULE_NAME,\n\t.init_fs_context = vtfs_init_fs_context,\n\t.parameters = vtfs_parameters,\n\t.kill_sb = vtfs_kill_sb,\n};\n\nstatic int __init vtfs_init(void)\n{\n\tint ret = register_filesystem(&vtfs_fs_type);\n\n\tif (ret)\n\t\treturn ret;\n\tLOG(\"VTFS joined the kernel\\n\");\n\treturn 0;\n}\n\nstatic void __exit vtfs_exit(void)\n{\n\tint ret = unregister_filesystem(&vtfs_fs_type);\n\n\tif (ret)\n\t\tpr_err(\"[vtfs]: unregister_filesystem failed: %d\\n\", ret);\n\telse\n\t\tLOG(\"VTFS left the kernel\\n\");\n}\n\nmodule_init(vtfs_init);\nmodule_exit(vtfs_exit);\n", "goi/service.py": "\"\"\"Manage the optional per-user systemd service for the default local backend.\"\"\"\nimport errno\nimport os\nfrom pathlib import Path\nimport socket\nimport subprocess\nimport sys\nimport time\nfrom urllib.request import Request, urlopen\n\nfrom .protocol import Error, META, STATUS, require\n\nURL = \"http://127.0.0.1:8080\"\n\n\ndef data_directory():\n    # Keep the same default as goi-server and existing mount configurations.\n    return Path.home() / \".local/share/goi\"\n\n\ndef unit_path():\n    return Path(os.environ.get(\"XDG_CONFIG_HOME\", Path.home() / \".config\")) / \"systemd/user/goi.service\"\n\n\ndef systemctl(*args):\n    try:\n        result = subprocess.run([\"systemctl\", \"--user\", *args], capture_output=True, text=True)\n    except FileNotFoundError:\n        raise Error(errno.ENOSYS, \"systemd is unavailable; start goi-server manually and pass --server URL\") from None\n    require(result.returncode == 0, errno.EIO,\n            \"user systemd operation failed; check systemctl --user status goi and journalctl --user -u goi. \"\n            \"Without a user systemd session, start goi-server manually and pass --server URL\")\n    return result.stdout\n\n\ndef argument(value):\n    value = str(value)\n    require(not any(c in value for c in \"\\n\\r\\0\"), message=\"invalid systemd argument\")\n    # ExecStart is not a shell; protect systemd specifiers and variable expansion too.\n    return '\"' + value.replace('\\\\', '\\\\\\\\').replace('\"', '\\\\\"').replace('%', '%%').replace('$', '$$') + '\"'\n\n\ndef install(client_id=None):\n    path = unit_path()\n    if path.exists() and client_id is None:\n        systemctl(\"daemon-reload\")\n        systemctl(\"enable\", \"goi.service\")\n        return path  # Preserve the existing OAuth App and user edits.\n    client_id = client_id if client_id is not None else os.environ.get(\"GOI_GITHUB_CLIENT_ID\", \"\")\n    executable = Path(__file__).resolve().parents[1] / \"bin/goi-server\"\n    command = [sys.executable, executable, \"--data\", data_directory(), \"--listen\", \"127.0.0.1\",\n               \"--port\", \"8080\", \"--client-id\", client_id]\n    contents = (\"[Unit]\\nDescription=GOI local GitHub filesystem service\\n\\n[Service]\\nType=simple\\n\"\n                \"ExecStart=\" + \" \".join(map(argument, command)) + \"\\n\"\n                \"Restart=on-failure\\nRestartSec=2\\nUMask=0077\\n\\n[Install]\\nWantedBy=default.target\\n\")\n    path.parent.mkdir(parents=True, exist_ok=True)\n    temporary = path.with_suffix(\".tmp\")\n    temporary.write_text(contents)\n    temporary.chmod(0o600)\n    temporary.replace(path)\n    systemctl(\"daemon-reload\")\n    systemctl(\"enable\", \"goi.service\")\n    return path\n\n\ndef ready():\n    try:\n        token = (data_directory() / \"server-token\").read_text().strip()\n        request = Request(URL + \"/api/hello\", headers={\"Authorization\": \"Bearer \" + token})\n        with urlopen(request, timeout=1) as response:\n            data = response.read(STATUS.size + META.size + 1)\n        return len(data) == STATUS.size + META.size and STATUS.unpack_from(data)[0] == 0\n    except (OSError, ValueError):\n        return False\n\n\ndef ensure():\n    if ready():\n        return  # A manually started compatible server is also usable.\n    try:\n        with socket.create_connection((\"127.0.0.1\", 8080), timeout=1):\n            occupied = True\n    except OSError:\n        occupied = False\n    require(not occupied, errno.EADDRINUSE,\n            \"port 8080 is occupied but GOI authentication failed; check the server/token before mounting\")\n    if not unit_path().exists():\n        install()\n    systemctl(\"start\", \"goi.service\")\n    deadline = time.monotonic() + 15\n    while time.monotonic() < deadline:\n        if ready():\n            return\n        time.sleep(.2)\n    raise Error(errno.ETIMEDOUT, \"GOI service did not become ready; inspect journalctl --user -u goi\")\n", "goi/server.py": "\"\"\"HTTP storage server. Run: python3 -m goi.server --data ./state.\"\"\"\n\nimport argparse\nimport errno\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nimport hmac\nimport json\nimport os\nfrom pathlib import Path\nimport secrets\nimport time\nfrom urllib.parse import parse_qs, urlsplit\n\nfrom .protocol import CHUNK_SIZE, COUNT, Error, MAX_REQUEST, NAME_LEN, STATUS, metadata, require\nfrom .storage import Store\nfrom . import publish, workspace, recovery\n\n\nclass Server(ThreadingHTTPServer):\n    # Threads receive request bodies and send replies independently. Only the\n    # storage transaction is serialized: one SQLite connection and one writer.\n    # GitHub calls inside that transaction may delay other storage operations;\n    # releasing the lock there would allow edits against an outdated baseline.\n    daemon_threads = True\n    allow_reuse_address = True\n\n    def __init__(self, address, store, token):\n        self.store, self.token = store, token\n        super().__init__(address, Handler)\n\n\nclass Handler(BaseHTTPRequestHandler):\n    protocol_version = \"HTTP/1.1\"\n\n    def log_message(self, *_args):\n        # Query strings contain capability tokens in the kernel compatibility API.\n        pass\n\n    def setup(self):\n        super().setup()\n        self.connection.settimeout(30)\n\n    def do_GET(self):\n        self.handle_request()\n\n    def do_POST(self):\n        self.handle_request()\n\n    def send(self, payload, content_type=\"application/octet-stream\", status=200):\n        self.send_response(status)\n        self.send_header(\"Content-Type\", content_type)\n        self.send_header(\"Content-Length\", str(len(payload)))\n        self.send_header(\"Connection\", \"close\")\n        self.send_header(\"Cache-Control\", \"no-store\")\n        self.end_headers()\n        self.wfile.write(payload)\n        self.close_connection = True\n\n    def handle_request(self):\n        control = self.path.split(\"?\", 1)[0] == \"/control\"\n        try:\n            require(len(self.path) <= 16384, errno.E2BIG, \"request URL too long\")\n            url = urlsplit(self.path)\n            query = parse_qs(url.query, keep_blank_values=True, strict_parsing=False, errors=\"strict\")\n            args = {key: value[-1] for key, value in query.items()}\n            authorization = self.headers.get(\"Authorization\", \"\")\n            token = authorization[7:] if authorization.startswith(\"Bearer \") else args.pop(\"token\", \"\")\n            require(bool(token) and hmac.compare_digest(token, self.server.token), errno.EACCES, \"invalid GOI session token\")\n            length = int(self.headers.get(\"Content-Length\", \"0\"))\n            require(0 <= length <= MAX_REQUEST, errno.E2BIG, \"request body too large\")\n            body = self.rfile.read(length)\n            require(len(body) == length, errno.EPROTO, \"incomplete request body\")\n            with self.server.store.lock:\n                try:\n                    if control:\n                        require(self.command == \"POST\", message=\"control requests require POST\")\n                        result = self.control(json.loads(body))\n                    else:\n                        require(url.path.startswith(\"/api/\"), errno.ENOENT, \"unknown endpoint\")\n                        result = self.api(url.path[5:], args, body)\n                    self.server.store.trim_cache()\n                    self.server.store.db.commit()\n                except Exception:\n                    self.server.store.db.rollback()\n                    raise\n            if control:\n                self.send(json.dumps({\"ok\": True, \"result\": result}).encode(), \"application/json\")\n            else:\n                self.send(STATUS.pack(0) + result)\n        except (Error, ValueError, TypeError, KeyError) as exc:\n            code = exc.code if isinstance(exc, Error) else errno.EINVAL\n            message = str(exc) if isinstance(exc, Error) else \"invalid request\"\n            if control:\n                self.send(json.dumps({\"ok\": False, \"errno\": code, \"error\": message}).encode(), \"application/json\")\n            else:\n                self.send(STATUS.pack(-code) + message.encode()[:4096])\n        except (BrokenPipeError, ConnectionResetError, TimeoutError):\n            self.close_connection = True\n        except Exception as exc:\n            # Keep implementation exceptions out of client responses and secret-bearing logs.\n            print(f\"GOI internal error: {type(exc).__name__}\", flush=True)\n            if control:\n                self.send(b'{\"ok\":false,\"errno\":5,\"error\":\"internal server error\"}', \"application/json\")\n            else:\n                self.send(STATUS.pack(-errno.EIO))\n\n    def api(self, method, args, body):\n        store = self.server.store\n\n        def integer(key, default=None):\n            value = args.get(key, default)\n            require(value is not None, message=f\"missing {key}\")\n            number = int(value)\n            require(0 <= number < 2**63, message=f\"invalid {key}\")\n            return number\n\n        if method in (\"hello\", \"stat\"):\n            return metadata(store.node(integer(\"id\", 1)))\n        if method == \"lookup\":\n            return metadata(store.lookup(integer(\"parent\"), args[\"name\"]))\n        if method == \"list\":\n            nodes = store.list(integer(\"id\"), integer(\"offset\", 0), 100)\n            result = bytearray(COUNT.pack(len(nodes)))\n            for node in nodes:\n                name = node[\"name\"].encode()\n                result.extend(metadata(node) + NAME_LEN.pack(len(name)) + name)\n            return bytes(result)\n        if method == \"read\":\n            count = integer(\"count\")\n            require(count <= CHUNK_SIZE, errno.E2BIG, \"read exceeds chunk size\")\n            return store.read(integer(\"id\"), integer(\"offset\"), count)\n        if method == \"create\":\n            return metadata(store.create(integer(\"parent\"), args[\"name\"], integer(\"mode\")))\n        if method in (\"unlink\", \"rmdir\"):\n            store.remove(integer(\"parent\"), args[\"name\"], directory=method == \"rmdir\")\n            return b\"\"\n        if method == \"rename\":\n            return metadata(store.rename(integer(\"old_parent\"), args[\"old_name\"], integer(\"new_parent\"),\n                                          args[\"new_name\"], integer(\"flags\", 0)))\n        if method == \"setattr\":\n            return metadata(store.setattr(integer(\"id\"), integer(\"mode\") if \"mode\" in args else None,\n                                           integer(\"size\") if \"size\" in args else None))\n        if method == \"write\":\n            require(self.command == \"POST\", message=\"file writes require POST\")\n            if \"expected_revision\" in args:\n                node = store.node(integer(\"id\"))\n                same = (store.read(node[\"id\"], 0, MAX_REQUEST) == body\n                        and node[\"mode\"] & 0o777 == integer(\"mode\"))\n                require(node[\"revision\"] == integer(\"expected_revision\") or same, errno.ESTALE,\n                        \"remote file changed since journal snapshot\")\n                if same:\n                    return metadata(node)\n            return metadata(store.write(integer(\"id\"), body, integer(\"mode\")))\n        raise Error(errno.ENOSYS, \"unknown filesystem operation\")\n\n    def control(self, request):\n        store = self.server.store\n        operation = request[\"operation\"]\n        if operation == \"accounts\":\n            return {\"client_id\": store.client_id, \"accounts\": [\n                {\"login\": row[\"login\"], \"authenticated\": bool(row[\"token\"])}\n                for row in store.db.execute(\"SELECT login,token FROM accounts ORDER BY login\")]}\n        if operation == \"logout\":\n            cursor = store.db.execute(\"UPDATE accounts SET token=NULL WHERE login=?\", (request[\"login\"],))\n            require(cursor.rowcount, errno.ENOENT, \"account not found\")\n            return {\"logged_out\": request[\"login\"]}\n        if operation == \"cache\":\n            return store.trim_cache(0 if request.get(\"clear\") else None)\n        if operation == \"auth_start\":\n            require(bool(store.client_id), errno.EINVAL, \"configure --client-id for your GitHub OAuth App (Device Flow enabled)\")\n            data = store.github_factory(\"\").device_start(store.client_id)\n            require(\"device_code\" in data, errno.EACCES, data.get(\"error_description\", \"Device Flow rejected\"))\n            flow = secrets.token_hex(16)\n            interval = int(data.get(\"interval\", 5))\n            store.db.execute(\"INSERT INTO devices VALUES (?,?,?,?,?)\",\n                              (flow, data[\"device_code\"], time.time() + data[\"expires_in\"], interval, time.time()))\n            return {\"flow\": flow, \"user_code\": data[\"user_code\"], \"verification_uri\": data[\"verification_uri\"],\n                    \"interval\": interval, \"expires_in\": data[\"expires_in\"]}\n        if operation == \"auth_poll\":\n            row = store.db.execute(\"SELECT * FROM devices WHERE id=?\", (request[\"flow\"],)).fetchone()\n            require(row is not None and time.time() < row[\"expires\"], errno.ETIMEDOUT, \"authorization expired\")\n            if time.time() < row[\"next_poll\"]:\n                return {\"pending\": True, \"interval\": row[\"interval\"]}\n            data = store.github_factory(\"\").device_poll(store.client_id, row[\"code\"])\n            if data.get(\"error\") in (\"authorization_pending\", \"slow_down\"):\n                interval = row[\"interval\"] + (5 if data[\"error\"] == \"slow_down\" else 0)\n                store.db.execute(\"UPDATE devices SET interval=?,next_poll=? WHERE id=?\",\n                                  (interval, time.time() + interval, request[\"flow\"]))\n                return {\"pending\": True, \"interval\": interval}\n            require(\"access_token\" in data, errno.EACCES, data.get(\"error_description\", \"authorization rejected\"))\n            account = store.add_account(data[\"access_token\"])\n            store.db.execute(\"DELETE FROM devices ow in store.db.execute(\"SELECT node FROM conflicts WHERE branch=?\", (branch[\"id\"],))}\n            candidates = [n for n in store.dirty_nodes(branch[\"id\"])\n                          if n[\"id\"] in conflicted and (store.path(n) == path or n[\"base_path\"] == path)]\n            require(len(candidates) == 1, errno.ENOENT, \"conflicted file not found\")\n            publish.resolve(store, candidates[0][\"id\"], request.get(\"choice\"))\n            return {\"resolved\": path}\n        raise Error(errno.ENOSYS, \"unknown control operation\")\n\n\ndef session_token(directory):\n    path = Path(directory) / \"server-token\"\n    if not path.exists():\n        try:\n            fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)\n        except FileExistsError:\n            pass\n        else:\n            with os.fdopen(fd, \"w\") as file:\n                file.write(secrets.token_hex(32) + \"\\n\")\n                file.flush()\n                os.fsync(file.fileno())\n    token = path.read_text().strip()\n    require(len(token) == 64 and all(c in \"0123456789abcdef\" for c in token), message=\"invalid server-token file\")\n    os.chmod(path, 0o600)\n    return token\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"--data\", default=str(Path.home() / \".local/share/goi\"))\n    parser.add_argument(\"--listen\", default=\"127.0.0.1\")\n    parser.add_argument(\"--port\", type=int, default=8080)\n    parser.add_argument(\"--client-id\", default=os.environ.get(\"GOI_GITHUB_CLIENT_ID\", \"\"))\n    parser.add_argument(\"--cache-mib\", type=int, default=256, help=\"clean blob cache limit; 0 disables caching\")\n    args = parser.parse_args()\n    if args.cache_mib < 0:\n        parser.error(\"--cache-mib must be nonnegative\")\n    store = Store(args.data, args.client_id, cache_bytes=args.cache_mib * 1024 * 1024)\n    with store.db:\n        store.trim_cache()\n    for row in list(store.db.execute(\"SEL OM nodes WHERE id=1\").fetchone():\n            self.new_node(None, \"\", \"root\", stat.S_IFDIR | 0o755)\n        with self.db:\n            self.migrate_owners()\n            self.migrate_branches()\n            self.db.execute(\"UPDATE nodes SET name='.info.json' \"\n                            \"WHERE kind='info' AND name='info.json'\")\n        self.db.commit()\n\n    def migrate_owners(self):\n        \"\"\"Move old containers without changing repository IDs or working files.\"\"\"\n        containers = self.db.execute(\n            \"SELECT * FROM nodes WHERE kind IN ('personal','orgs') AND deleted=0\").fetchall()\n        for container in containers:\n            target = container[\"parent\"] if container[\"kind\"] == \"personal\" else 1\n            for child in self.children(container[\"id\"]):\n                require(self.child(target, child[\"name\"]) is None, errno.EEXIST,\n                        \"owner migration has duplicate names; original data retained\")\n                self.update(child[\"id\"], parent=target)\n            if container[\"kind\"] == \"personal\":\n                self.update(target, loaded=container[\"loaded\"])\n            self.db.execute(\"DELETE FROM nodes WHERE id=?\", (container[\"id\"],))\n        if containers:\n            self.update(1, loaded=0)\n\n    def migrate_branches(self):\n        \"\"\"Flatten branch containers while preserving node IDs and local edits.\"\"\"\n        containers = self.db.execute(\n            \"SELECT id,parent FROM nodes WHERE kind='branches'\").fetchall()\n        for container in containers:\n            children = self.children(container[\"id\"])\n            self.db.execute(\"DELETE FROM nodes WHERE id=?\", (container[\"id\"],))\n            for child in children:\n                require(self.child(container[\"parent\"], child[\"name\"]) is None,\n                        errno.EEXIST, \"branch migration has duplicate names; original data retained\")\n                self.update(child[\"id\"], parent=container[\"parent\"])\n\n    def close(self):\n        self.db.close()\n\n    def new_node(self, parent, name, kind, mode, **values):\n        if parent is not None:\n            self.check_name(name)\n        fields = {\"parent\": parent, \"name\": name, \"kind\": kind, \"mode\": mode,\n                  \"mtime_ns\": time.time_ns(), **values}\n        cursor = self.db.execute(\n            \"INSERT INTO nodes (\" + \",\".join(fields) + \") VALUES (\" + \",\".join(\"?\" for _ in fields) + \")\",\n            tuple(fields.values()),\n        )\n        return self.node(cursor.lastrowid)\n\n    @staticmethod\n    def check_name(name):\n        require(isinstance(name, str) and name not in (\"\", \".\", \"..\") and \"/\" not in name\n                and \"\\0\" not in name, message=\"invalid filename\")\n        require(len(name.encode()) <= 255, errno.ENAMETOOLONG, \"filename exceeds 255 bytes\")\n\n    def node(self, number, *, deleted=False):\n        row = self.db.execute(\"SELECT * FROM nodes WHERE id=?\", (int(number),)).fetchone()\n        require(row is not None and (deleted or not row[\"deleted\"]), errno.ENOENT, \"object not found\")\n        return dict(row)\n\n    def update(self, number, **values):\n        self.db.execute(\"UPDATE nodes SET \" + \",\".join(key + \"=?\" for key in values) + \" WHERE id=?\",\n                        (*values.values(), number))\n        return self.node(number, deleted=True)\n\n    def child(self, parent, name):\n        row = self.db.execute(\"SELECT id FROM nodes WHERE parent=? AND name=? AND deleted=0\",\n                              (parent, name)).fetchone()\n        return self.node(row[0]) if row else None\n\n    def children(self, parent):\n        return [dict(row) for row in self.db.execute(\n            \"SELECT * FROM nodes WHERE parent=? AND deleted=0 ORDER BY name COLLATE BINARY\", (parent,))]\n\n    def github(self, account):\n        row = self.db.execute(\"SELECT token FROM accounts WHERE [\"name\"]))\n        info = {\"owner\": item[\"owner\"][\"login\"], \"name\": item[\"name\"], \"active\": False,\n                \"writable\": writable, \"hint\": \"goi activate <repository-path>\"}\n        self.new_node(node[\"id\"], \".info.json\", \"info\", stat.S_IFREG | 0o444,\n                      data=json.dumps(info, indent=2).encode(), size=len(json.dumps(info, indent=2).encode()),\n                      account=parent[\"account\"], repo=node[\"id\"], loaded=1)\n        return self.node(node[\"id\"])\n\n    def load_directory(self, node):\n        require(stat.S_ISDIR(node[\"mode\"]), errno.ENOTDIR, \"not a directory\")\n        if node[\"kind\"] == \"root\":\n            require(self.db.execute(\"SELECT 1 FROM accounts LIMIT 1\").fetchone() is not None,\n                    errno.EACCES, \"sign in with goi auth before browsing /github\")\n        if node[\"loaded\"]:\n            return\n        kind = node[\"kind\"]\n        if kind == \"root\":\n            for account in self.db.execute(\"SELECT id FROM accounts WHERE token IS NOT NULL\").fetchall():\n                for org in self.github(account[\"id\"]).organizations():\n                    if self.child(1, org[\"login\"]) is None:\n                        self.new_node(1, org[\"login\"], \"org\", stat.S_IFDIR | 0o755,\n                                      account=account[\"id\"])\n            self.update(1, loaded=1)\n            return\n        api = self.github(node[\"account\"])\n        if kind in (\"account\", \"org\"):\n            owner = node[\"name\"]\n            for repo in api.repositories(owner, personal=kind == \"account\"):\n                if repo[\"owner\"][\"login\"].casefold() == owner.casefold():\n                    self.add_repo(node, repo)\n        elif kind in (\"branch\", \"dir\"):\n            repo = self.repo(node[\"repo\"])\n            for entry in api.tree(repo[\"owner\"], repo[\"name\"], node[\"tree_sha\"]):\n                # Symbolic links and submodules are int n and bytes.\n            restored += 1\n        return {'restored': restored}\n\n\nclass JournalHandler(Handler):\n    def api(self, method, args, body):\n        require(self.command == 'POST', message='journal changes require POST')\n        number = int(args['id'])\n        require(number > 0, message='invalid inode')\n        if method == 'record':\n            revision, mode = int(args['revision']), int(args['mode'])\n            require(revision >= 0 and 0 <= mode <= 0o777 and len(body) <= MAX_FILE_SIZE)\n            self.server.store.record(number, revision, mode, body)\n        elif method == 'ack':\n            self.server.store.db.execute('DELETE FROM writes WHERE id=?', (number,))\n        else:\n            raise Error(errno.ENOSYS, 'unknown journal operation')\n        return b''\n\n    def control(self, request):\n        store = self.server.store\n        operation = request['operation']\n        if operation == 'info':\n            return {'identity': store.identity, 'files': [\n                {'id': row['id'], 'revision': row['revision'], 'bytes': row['bytes']}\n                for row in store.db.execute('SELECT id,revision,length(data) AS bytes FROM writes ORDER BY id')]}\n        if operation == 'discard':\n            store.db.execute('DELETE FROM writes WHERE id=?', (int(request['id']),))\n            return {'discarded': int(request['id'])}\n        if operation == 'replay':\n            return store.recover()\n        if operation == 'export':\n            # The CLI chooses a local destination; the daemon never writes arbitrary paths.\n            import base64\n            row = store.db.execute('SELECT data FROM writes WHERE id=?', (int(request['id']),)).fetchone()\n            require(row is not None, errno.ENOENT, 'journal entry not found')\n            return {'data': base64.b64encode(row['data']).decode()}\n        raise Error(errno.ENOSYS, 'unknown journal operation')\n\n\ndef ensure(client):\n    from .cli import Client, configuration_path\n    key = hashlib.sha256(str(client.mountpoint).encode()).hexdigest()[:24]\n    directory = configuration_path().parent / 'journals' / key\n    directory.mkdir(mode=0o700, parents=True, exist_ok=True)\n    identity = hashlib.sha256((client.server.rstrip('/') + '\\n' + client.token).encode()).hexdigest()\n    token_path = directory / 'token'\n    # Refuse a changed backend before replacing the token of a running journal.\n    dbpath = directory / 'journal.sqlite3'\n    if dbpath.exists():\n        db = sqlite3.connect(dbpath)\n        try:\n            row = db.execute('SELECT value FROM identity').fetchone()\n            require(row is None or row[0] == identity, errno.EXDEV,\n                    'journal backend changed; retain the old configuration and export/recover its data first')\n        finally:\n            db.close()\n    fd = os.open(token_path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)\n    with os.fdopen(fd, 'w') as file:\n        file.write(client.token)\n        file.flush()\n        os.fsync(file.fileno())\n    def connect():\n        try:\n            port = int((directory / 'port').read_text())\n            local = Client(client.mountpoint, {'server': f'http://127.0.0.1:{port}', 'token_file': str(token_path)})\n            require(local.call('info')['identity'] == identity, errno.EXDEV, 'journal identity mismatch')\n            return local, port\n        except (OSError, ValueError, Error):\n            return None\n    running = connect()\n    if running:\n        return running\n    env = dict(os.environ, PYTHONPATH=str(Path(__file__).resolve().parents[1]))\n    with (directory / 'daemon.log').open('ab') as log:\n        subprocess.Popen([sys.executable, '-m', 'goi.journal', '--data', str(directory),\n                          '--server', client.server, '--token-file', str(token_path)],\n                         stdin=subprocess.DEVNULL, stdout=log, stderr=log,\n                         start_new_session=True, env=env)\n    for _ in def selected(store, branch, paths, force=False):\n    patterns = ignore.rules(store, branch)\n    nodes = [n for n in store.dirty_nodes(branch) if force or not ignore.ignored(store, n, patterns)]\n    if paths:\n        def matches(node, prefix):\n            return any(path is not None and (prefix in (\"\", \".\") or path == prefix or path.startswith(prefix + \"/\"))\n                       for path in (store.path(node), node[\"base_path\"]))\n        nodes = [node for node in nodes if any(matches(node, prefix) for prefix in paths)]\n        require(all(any(matches(node, prefix) for node in nodes) for prefix in paths), errno.ENOENT,\n                \"selected path has no publishable changes; ignored additions require --force\")\n    destinations = {store.path(node) for node in nodes if not node[\"deleted\"]}\n    for node in store.dirty_nodes(branch):\n        if node[\"deleted\"] and node[\"base_path\"] in destinations and node not in nodes:\n            nodes.append(node)\n    return [node for node in nodes if node[\"kind\"] == \"file\"]\n\n\ndef commit(store, branch_id, paths, message, force=False):\n    \"\"\"Read saved files, build one Git tree/commit, then fast-forward the branch.\"\"\"\n    require(isinstance(message, str) and message.strip() and len(message.encode()) <= 8192,\n            message=\"commit message must be nonempty and at most 8192 bytes\")\n    recovered = recovery.recover(store, branch_id)\n    require(not store.db.execute(\"SELECT 1 FROM conflicts WHERE branch=?\", (branch_id,)).fetchone(),\n            errno.EAGAIN, \"resolve pending conflicts first\")\n    require(store.node(branch_id)[\"writable\"], errno.EACCES, \"branch is read-only\")\n    branch = store.branch(branch_id)\n    repo = store.repo(branch[\"repo\"])\n    api = store.github(repo[\"account\"])\n    latest_repo = api.repository(repo[\"owner\"], repo[\"name\"])\n    require(latest_repo.get(\"permissions\", {}).get(\"push\") and not latest_repo.get(\"archived\", False),\n      recovery.prepare(store, branch_id, head, None, saved)\n            head = api.delete_file(repo[\"owner\"], repo[\"name\"], branch[\"name\"], path,\n                                   current[path][\"sha\"], message, author)\n        else:\n            tree = api.create_tree(repo[\"owner\"], repo[\"name\"], current_commit[\"tree\"][\"sha\"], list(entries.values()))\n            base_head = head\n            head = api.create_commit(repo[\"owner\"], repo[\"name\"], head, tree, message, author)\n            recovery.prepare(store, branch_id, base_head, head, saved)\n            api.update_head(repo[\"owner\"], repo[\"name\"], branch[\"name\"], head)\n    store.db.execute(\"DELETE FROM publications WHERE branch=?\", (branch_id,))\n    for node, path, sha, mode in saved:\n        store.update(node[\"id\"], base_path=path, remote_sha=sha, base_mode=mode, dirty=0)\n        store.db.execute(\"UPDATE nodes SET deleted=1 WHERE source_id=?\", (node[\"id\"],))\n    store.db.execute(\"UPDATE branches SET head=? WHERE id=?\", (head, branch_id))\n    return {\"sha\": head}\n", "goi/ignore.py": "\"\"\"Small, explicit ignore syntax; only unpublished additions may be ignored.\"\"\"\nimport fnmatch\n\n\ndef rules(store, branch):\n    result = [\"*.swp\", \"*.swx\", \"*~\", \"4913\", \"__pycache__/\", \"*.pyc\"]\n    node = store.child(branch, \".goiignore\")\n    if node and node[\"kind\"] == \"file\":\n        result += store.read(node[\"id\"], 0, 65536).decode(\"utf-8\").splitlines()\n    return result\n\n\ndef ignored(store, node, patterns):\n    if node[\"base_path\"] or node[\"remote_sha\"] or node[\"name\"] == \".goiignore\":\n        return False\n    path = store.path(node)\n    parts = path.split(\"/\")\n    matched = False\n    for line in patterns:\n        pattern = line.strip()\n        if not pattern or pattern.startswith(\"#\"):\n            continue\n        negate = pattern.startswith(\"!\")\n        pattern = pattern[1:] if negate else pattern\n        directory <script>

});

function highlight(line){

function showCode(){

}

$('files').onchange=showCode;
$('term').onclick=()=>{const t=steps[selected][5];$('termTitle').textContent=t;$('termText').textContent=terms[t];$('definition').showModal()};
$('close').onclick=()=>$('definition').close();
$('toggleLeft').onclick=()=>$('left').hidden=!$('left').hidden;
$('toggleRight').onclick=()=>$('right').hidden=!$('right').hidden;
$('prev').onclick=()=>select(selected-1);$('next').onclick=()=>select(selected+1);

$('zoomOut').onclick=()=>{scale=Math.max(.25,scale/1.2);transform()};
$('reset').onclick=()=>{scale=.85;x=30;y=30;transform()};
